<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>TM9035 storage probe — can two scenes share a baseline?</title>
<style>
/* ============================================================
   TM9035 — STORAGE PROBE (temporary diagnostic, NOT a learner asset)
   Answers one question: inside the REAL Visme embed, can scene A write a
   value that scene B can read back?

   Two URLs on ONE origin:
     <base>/            -> WRITER  (scene A)
     <base>/?role=read  -> READER  (scene B)
   localStorage is scoped to the ORIGIN (scheme+host+port) — path and query are
   irrelevant to it. So one file on two URLs proves exactly what two separate
   folders would: whether two Visme slides on this origin share a storage jar.
   What this DOES test that a single slide cannot: whether the two iframe
   placements land in the same storage partition (partition key is the pair
   (top-level site, our origin) — same deck, same key, so they should).

   Reports: opaque origin? localStorage/sessionStorage/cookie reachable?
   did the writer's nonce survive to the reader? which browser?
   Nothing here is load-bearing; every storage access is guarded.
   No window.open / window.print / external deps (Visme sandbox safe).
   DELETE THIS SLUG once the question is settled.
   ============================================================ */
:root{
  --teal:#0098be; --teal-strong:#007a98; --navy:#222f55;
  --muted:#56608a; --faint:#8a91b0; --pale:#d9eff8; --mist:#f4f7f9; --line:#e3e8ee;
  --good:#287d5c; --good-soft:#e3f3ec;
  --amber:#9a6a16; --amber-soft:#fbf0db;
  --flag:#b64457; --flag-soft:#fbe7ea;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;background:#eef4f7;color:var(--navy);font-family:var(--font);display:flex;align-items:center;justify-content:center}
.frame{width:100%;height:100%;max-width:1370px;max-height:680px;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:16px;box-shadow:0 20px 52px rgba(16,26,38,.18)}
.banner{flex:0 0 auto;text-align:center;padding:12px 16px;background:#fff;box-shadow:0 4px 11px rgba(34,47,85,.07);border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
.banner h1{margin:0;font-size:clamp(20px,2.4vw,30px);font-weight:700;color:var(--navy)}
.banner p{margin:3px 0 0;font-size:.82rem;color:var(--muted)}
.role{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--pale);color:var(--teal-strong);vertical-align:middle}
.body{flex:1 1 auto;min-height:0;overflow:auto;padding:9px clamp(14px,2.4vw,28px) 10px}
.verdict{margin:0 0 9px;padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:var(--mist);font-size:clamp(.86rem,1.5vw,1.05rem);font-weight:700;line-height:1.3;text-align:center}
.verdict.good{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.verdict.bad{border-color:var(--flag);background:var(--flag-soft);color:var(--flag)}
.verdict.warn{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.verdict small{display:block;margin-top:4px;font-size:.76rem;font-weight:600;opacity:.9}
/* 14 diagnostic rows must fit the 1370x620 box without an inner scroll:
   3 cols >=1100px (5 rows tall), 2 cols on tablet, 1 col on phone. */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 14px}
@media(max-width:1100px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.row{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;padding:4px 9px;border:1px solid var(--line);border-radius:9px;background:#fff}
.pill{flex:0 0 auto;font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;align-self:center}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--flag-soft);color:var(--flag)}
.pill.na{background:var(--mist);color:var(--faint)}
.k{font-size:.78rem;font-weight:700;color:var(--navy)}
.v{font-size:.74rem;color:var(--muted);word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.35}
.controls{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:10px 16px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:9px 18px;border:2px solid var(--teal);border-radius:10px;background:var(--teal);color:#fff;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.btn.secondary{background:#fff;color:var(--teal)}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.status{width:100%;text-align:center;font-size:.78rem;font-weight:600;color:var(--teal-strong);min-height:1.1em;margin:0}
.hint{margin:8px 0 0;padding:8px 12px;border-radius:9px;background:var(--pale);font-size:.75rem;line-height:1.35;color:var(--navy)}
.hint b{font-weight:700}
.hint code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#fff;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<main class="frame">
  <header class="banner">
    <h1>TM9035 storage probe<span class="role" id="roleTag">writer</span></h1>
    <p>Can a value written on one scene be read on another, inside the real embed?</p>
  </header>

  <div class="body">
    <p class="verdict" id="verdict">Checking&hellip;</p>
    <div class="grid" id="grid"></div>
    <p class="hint" id="hint"></p>
  </div>

  <div class="controls">
    <button class="btn" id="actionBtn" type="button">Write probe value</button>
    <button class="btn secondary" id="copyBtn" type="button">Copy diagnostics</button>
    <button class="btn secondary" id="clearBtn" type="button">Clear probe data</button>
    <p class="status" id="status"></p>
  </div>
</main>

<script>
(function(){
  "use strict";
  var KEY='tm9035:probe:v1';
  var $=function(id){ return document.getElementById(id); };
  var isRead=/[?&]role=read/.test(location.search);

  // ---- guarded storage primitives (the whole point of the probe) ----
  function tryLS(fn){ try{ return {ok:true, value:fn(window.localStorage)}; }catch(e){ return {ok:false, err:e.name+': '+e.message}; } }
  function trySS(fn){ try{ return {ok:true, value:fn(window.sessionStorage)}; }catch(e){ return {ok:false, err:e.name+': '+e.message}; } }
  function readCookie(){
    try{
      var m=document.cookie.match(/(?:^|;\s*)tm9035probe=([^;]+)/);
      return {ok:true, value:m?decodeURIComponent(m[1]):null};
    }catch(e){ return {ok:false, err:e.name+': '+e.message}; }
  }
  function writeCookie(nonce){
    try{
      var secure = location.protocol==='https:' ? ';SameSite=None;Secure' : '';
      document.cookie='tm9035probe='+encodeURIComponent(nonce)+';max-age=86400;path=/'+secure;
      return {ok:true};
    }catch(e){ return {ok:false, err:e.name+': '+e.message}; }
  }

  var inIframe=true; try{ inIframe=(window.self!==window.top); }catch(e){ inIframe=true; }
  var winOrigin='(unreadable)'; try{ winOrigin=String(window.origin); }catch(e){}
  var referrer='(unreadable)'; try{ referrer=document.referrer||'(empty)'; }catch(e){}

  var lsProbe=tryLS(function(s){ s.setItem('tm9035:rw','1'); s.removeItem('tm9035:rw'); return 'read+write'; });
  var ssProbe=trySS(function(s){ s.setItem('tm9035:rw','1'); s.removeItem('tm9035:rw'); return 'read+write'; });
  var lsRead =lsProbe.ok ? tryLS(function(s){ return s.getItem(KEY); }) : lsProbe;
  var ssRead =ssProbe.ok ? trySS(function(s){ return s.getItem(KEY); }) : ssProbe;
  var ckRead =readCookie();

  function parse(raw){ try{ return raw?JSON.parse(raw):null; }catch(e){ return null; } }
  var lsRec = lsRead.ok ? parse(lsRead.value) : null;
  var ssRec = ssRead.ok ? parse(ssRead.value) : null;

  // opaque origin is the tell-tale: window.origin === 'null'
  var opaque = (winOrigin==='null');

  var hasSA='not supported';
  try{ if(document.hasStorageAccess){ hasSA='checking…'; document.hasStorageAccess().then(function(v){ setRow('storageAccess', v?'granted':'denied', v?'ok':'no'); },function(){ setRow('storageAccess','error','no'); }); } }catch(e){ hasSA='error'; }

  var ROWS=[
    ['role',        isRead?'READER (scene B)':'WRITER (scene A)', 'na'],
    ['browser',     navigator.userAgent.slice(0,72), 'na'],
    ['in iframe',   inIframe?'yes':'no (opened directly)', inIframe?'ok':'na'],
    ['location.origin', (function(){ try{ return location.origin; }catch(e){ return '(unreadable)'; } })(), 'na'],
    ['window.origin',  winOrigin, opaque?'no':'ok'],
    ['opaque origin',  opaque?'YES — sandbox has no allow-same-origin':'no', opaque?'no':'ok'],
    ['referrer',    referrer.slice(0,72), 'na'],
    ['localStorage',   lsProbe.ok?'reachable ('+lsProbe.value+')':'BLOCKED — '+lsProbe.err, lsProbe.ok?'ok':'no'],
    ['sessionStorage', ssProbe.ok?'reachable ('+ssProbe.value+')':'BLOCKED — '+ssProbe.err, ssProbe.ok?'ok':'no'],
    ['cookies',        navigator.cookieEnabled?'cookieEnabled = true':'cookieEnabled = false', navigator.cookieEnabled?'ok':'no'],
    ['storageAccess',  hasSA, 'na'],
    ['LS record',   lsRec?('nonce '+lsRec.nonce+' · written '+lsRec.when+' · from '+lsRec.from):(lsRead.ok?'(none)':'(unreadable)'), lsRec?'ok':'no'],
    ['SS record',   ssRec?('nonce '+ssRec.nonce):(ssRead.ok?'(none)':'(unreadable)'), ssRec?'ok':'no'],
    ['cookie record', ckRead.ok?(ckRead.value||'(none)'):'(unreadable)', (ckRead.ok&&ckRead.value)?'ok':'no']
  ];

  function setRow(key,val,pill){
    var el=document.querySelector('[data-row="'+key+'"]');
    if(!el) return;
    el.querySelector('.v').textContent=val;
    var p=el.querySelector('.pill'); p.className='pill '+pill; p.textContent=pill==='ok'?'ok':(pill==='no'?'no':'—');
  }

  (function render(){
    $('grid').innerHTML=ROWS.map(function(r){
      var pill=r[2];
      return '<div class="row" data-row="'+r[0]+'">'+
        '<span class="pill '+pill+'">'+(pill==='ok'?'ok':(pill==='no'?'no':'—'))+'</span>'+
        '<span><span class="k">'+r[0]+'</span><br><span class="v">'+String(r[1]).replace(/[<>&]/g,'')+'</span></span>'+
      '</div>';
    }).join('');
  })();

  // ---- verdict ----
  var v=$('verdict');
  if(!lsProbe.ok){
    v.className='verdict bad';
    v.innerHTML='localStorage is BLOCKED in this embed.'+
      '<small>Cross-scene baseline handoff is impossible here. The summary scene will fall back to asking for the baseline in-asset — which is already built.</small>';
  } else if(isRead){
    if(lsRec){
      v.className='verdict good';
      v.innerHTML='READ OK — the writer&rsquo;s value survived: <b>'+lsRec.nonce+'</b>'+
        '<small>Two scenes on this origin share storage. The cross-scene benchmark will work in this browser.</small>';
    } else {
      v.className='verdict warn';
      v.innerHTML='localStorage works, but the writer&rsquo;s value is NOT here.'+
        '<small>Either scene A was never run in this browser, or storage is partitioned between the two placements. Run the writer first, then return here without closing the tab.</small>';
    }
  } else {
    v.className='verdict warn';
    v.innerHTML='Writer ready. Press <b>Write probe value</b>, then open the reader scene.'+
      '<small>localStorage is reachable here, so a write should succeed.</small>';
  }

  $('hint').innerHTML = isRead
    ? '<b>Reader (scene B).</b> This page only reads. If the pill next to <code>LS record</code> is green and the nonce matches what scene A showed you, the two scenes share storage.'
    : '<b>Writer (scene A).</b> Press <b>Write probe value</b>, note the nonce, then go to the slide embedding <code>?role=read</code> and check the nonce matches.';

  $('roleTag').textContent = isRead ? 'reader' : 'writer';
  $('actionBtn').textContent = isRead ? 'Re-read now' : 'Write probe value';

  function nowStr(){ try{ return new Date().toLocaleString('en-GB'); }catch(e){ return '?'; } }

  $('actionBtn').addEventListener('click', function(){
    if(isRead){ location.reload(); return; }
    var nonce=Math.random().toString(36).slice(2,8).toUpperCase();
    var rec={v:1, nonce:nonce, when:nowStr(), from:(inIframe?'iframe':'top')};
    var raw=JSON.stringify(rec);
    var a=tryLS(function(s){ s.setItem(KEY,raw); return 1; });
    var b=trySS(function(s){ s.setItem(KEY,raw); return 1; });
    var c=writeCookie(nonce);
    $('status').textContent='Wrote nonce '+nonce+' — localStorage: '+(a.ok?'ok':'blocked')+
      ' · sessionStorage: '+(b.ok?'ok':'blocked')+' · cookie: '+(c.ok?'ok':'blocked')+
      '. Now open the reader scene and check the nonce.';
    setRow('LS record', a.ok?('nonce '+nonce+' · written '+rec.when+' · from '+rec.from):'(write blocked)', a.ok?'ok':'no');
    setRow('SS record', b.ok?('nonce '+nonce):'(write blocked)', b.ok?'ok':'no');
    setRow('cookie record', c.ok?nonce:'(write blocked)', c.ok?'ok':'no');
  });

  $('clearBtn').addEventListener('click', function(){
    tryLS(function(s){ s.removeItem(KEY); return 1; });
    trySS(function(s){ s.removeItem(KEY); return 1; });
    try{ document.cookie='tm9035probe=;max-age=0;path=/'; }catch(e){}
    $('status').textContent='Probe data cleared. Reload to re-check.';
  });

  $('copyBtn').addEventListener('click', function(){
    var lines=['TM9035 STORAGE PROBE — '+nowStr(), 'url: '+location.href, ''];
    ROWS.forEach(function(r){
      var el=document.querySelector('[data-row="'+r[0]+'"] .v');
      lines.push(r[0]+': '+(el?el.textContent:r[1]));
    });
    lines.push(''); lines.push('verdict: '+$('verdict').textContent.trim());
    var text=lines.join('\n');
    function ok(){ $('status').textContent='Diagnostics copied — paste them back into the chat.'; }
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select();
      var done=false; try{ done=document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      $('status').textContent = done ? 'Diagnostics copied — paste them back into the chat.' : 'Copy blocked. Read the values off the screen instead.';
    }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, fallback); } else { fallback(); }
  });
})();
</script>
</body>
</html>
