f5h9UE3lbZvT5no6Pbip0jMGJb2hLum8uko/jAN+yFXyl+sqPyo+joD6073XdQZkklfJ32+qfE48B4FhImiH35dJ1GImOYK6Sj+uq/xWf6+wDmnSIqhL+mJT5f/ob5XXYVstEdRV3luXvLMuaXtd8hXtz/g2VfpIXdIb2h+E70+nM7b3er8S3z/pZ/n/CzsB1eGrufgAAAAASUVORK5CYII=\");\n}\n\n\n/* ===========================================================================\n   Lilly CLL - component styles (the class vocabulary)\n   Structure and colour are lifted from the approved infographic. Anything the\n   print source could not have (hover, focus, selected) is marked DERIVED and\n   is built only from tokens already present in the source palette.\n   =========================================================================== */\n\n/* --- Foundations --------------------------------------------------------- */\n.lly-root {\n  font-family: var(--lly-font);\n  font-size: var(--lly-size-body);\n  line-height: var(--lly-lh-body);\n  color: var(--lly-ink);\n  background: var(--lly-white);\n}\n.lly-root *, .lly-root *::before, .lly-root *::after { box-sizing: border-box; }\n\n/* Screen shell. The source is text-dense: keep generous internal padding and\n   do not stretch measure much beyond 72ch. */\n.lly-screen { padding: 24px; max-width: 1200px; margin: 0 auto; }\n.lly-stack  { display: flex; flex-direction: column; gap: var(--lly-gap); }\n.lly-row    { display: flex; gap: var(--lly-gap); flex-wrap: wrap; }\n.lly-grid   { display: grid; gap: var(--lly-gap); grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }\n\n/* --- Title bar ------------------------------------------------------------\n   Solid red band, white text. In the source this is Background shape.png, a\n   3630x312 solid #E1251B block, reproduced here as a fill rather than an image. */\n.lly-titlebar {\n  background: var(--lly-red);\n  color: var(--lly-white);\n  padding: 14px 24px;\n  border-radius: var(--lly-radius-sm);\n}\n.lly-titlebar__title {\n  font-family: var(--lly-font-bold);\n  font-size: var(--lly-size-title);\n  line-height: var(--lly-lh-tight);\n  font-weight: 700;\n  margin: 0;\n}\n.lly-titlebar__sub {\n  font-size: var(--lly-size-subtitle);\n  line-height: var(--lly-lh-tight);\n  margin: 4px 0 0;\n  opacity: .95;\n}\n\n/* --- Card base ------------------------------------------------------------\n   Every content block in the source is a thin ink outline on white with a\n   generous corner radius. */\n.lly-card {\n  background: var(--lly-white);\n  border: var(--lly-border) solid var(--lly-ink);\n  border-radius: var(--lly-radius);\n  padding: var(--lly-pad);\n}\n\n/* --- Consider card --------------------------------------------------------\n   The four \"Consider: ...\" clusters. Heading is red, questions are an unmarked\n   list in ink, icon is the supplied artwork for that cluster. */\n.lly-consider__head {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  margin: 0 0 10px;\n}\n.lly-consider__title {\n  font-family: var(--lly-font-bold);\n  font-size: var(--lly-size-section);\n  line-height: var(--lly-lh-tight);\n  color: var(--lly-red);\n  font-weight: 700;\n  margin: 0;\n}\n.lly-icon {\n  width: 34px; height: 34px; flex: 0 0 34px;\n  background-repeat: no-repeat;\n  background-position: center;\n  background-size: contain;\n}\n.lly-icon--frailty    { background-image: var(--lly-icon-frailty); }\n.lly-icon--patient    { background-image: var(--lly-icon-patient); }\n.lly-icon--disease    { background-image: var(--lly-icon-disease); }\n.lly-icon--preference { background-image: var(--lly-icon-preference); }\n.lly-icon--bcl2i      { background-image: var(--lly-icon-bcl2i); }\n/* The cog artwork is WHITE. It must sit on red, never on white. */\n.lly-icon--btki {\n  background-image: var(--lly-icon-btki);\n  background-color: var(--lly-red);\n  border-radius: 50%;\n  padding: 3px;\n}\n\n.lly-questions { list-style: none; margin: 0; padding: 0; }\n.lly-questions > li {\n  position: relative;\n  padding-left: 18px;\n  margin: 0 0 10px;\n}\n.lly-questions > li:last-child { margin-bottom: 0; }\n.lly-questions > li::before {\n  content: \"\";\n  position: absolute; left: 0; top: .55em;\n  width: 7px; height: 7px; border-radius: 50%;\n  background: var(--lly-red);\n}\n\n/* DERIVED - not in the print source. Use only on cards the learner can select. */\n.lly-card--interactive { cursor: pointer; transition: box-shadow .15s, transform .15s; }\n.lly-card--interactive:hover { box-shadow: 0 4px 14px rgba(33,33,33,.16); transform: translateY(-2px); }\n.lly-card--interactive:focus-visible { outline: 3px solid var(--lly-red); outline-offset: 3px; }\n.lly-card--interactive[aria-pressed=\"true\"],\n.lly-card--selected { background: var(--lly-panel); border-color: var(--lly-red); border-width: 2px; }\n\n/* --- Pale panel -----------------------------------------------------------\n   The \"Identifying frailty\" block: pale blue fill, ink outline. */\n.lly-panel {\n  background: var(--lly-panel);\n  border: var(--lly-border) solid var(--lly-ink);\n  border-radius: var(--lly-radius);\n  padding: var(--lly-pad);\n}\n\n/* --- Patient profile ------------------------------------------------------\n   The two worked patient examples. Attribute list, no bullets. */\n.lly-profile__name {\n  font-family: var(--lly-font-bold);\n  font-size: var(--lly-size-body);\n  font-weight: 700;\n  color: var(--lly-ink);\n  margin: 0 0 8px;\n}\n.lly-profile__attrs { list-style: none; margin: 0; padding: 0; font-size: var(--lly-size-small); }\n.lly-profile__attrs > li { padding: 4px 0; border-top: 1px solid rgba(33,33,33,.15); }\n.lly-profile__attrs > li:first-child { border-top: 0; }\n\n/* --- 1L feature panel -----------------------------------------------------\n   BTKi / BCL-2i. Sky fill, navy outline, TOP corners only, red header bar with\n   white text, exactly as the source draws it. */\n.lly-feature {\n  background: var(--lly-sky);\n  border: var(--lly-border) solid var(--lly-navy);\n  border-radius: var(--lly-radius) var(--lly-radius) 0 0;\n  overflow: hidden;\n}\n.lly-feature__head {\n  background: var(--lly-red);\n  color: var(--lly-white);\n  font-family: var(--lly-font-bold);\n  font-weight: 700;\n  font-size: var(--lly-size-body);\n  padding: 10px 14px;\n  display: flex; align-items: center; gap: 10px;\n}\n.lly-feature__body { padding: 14px; }\n.lly-feature__list { list-style: none; margin: 0; padding: 0; }\n.lly-feature__list > li {\n  position: relative; padding-left: 16px; margin-bottom: 8px;\n  font-size: var(--lly-size-small);\n}\n.lly-feature__list > li:last-child { margin-bottom: 0; }\n.lly-feature__list > li::before {\n  content: \"\"; position: absolute; left: 0; top: .5em;\n  width: 6px; height: 6px; border-radius: 50%; background: var(--lly-navy);\n}\n\n/* --- Treatment algorithm --------------------------------------------------\n   Two branches, colour-coded throughout: TIME-LIMITED = forest, CONTINUOUS =\n   navy. The branch colour carries both the outline AND the text of its nodes. */\n.lly-branch {\n  display: inline-block;\n  color: var(--lly-white);\n  font-family: var(--lly-font-bold);\n  font-weight: 700;\n  font-size: var(--lly-size-body);\n  padding: 8px 18px;\n  border-radius: var(--lly-radius);\n}\n.lly-branch--timelimited { background: var(--lly-forest); }\n.lly-branch--continuous  { background: var(--lly-navy); }\n\n.lly-node {\n  background: var(--lly-white);\n  border: var(--lly-border) solid currentColor;\n  border-radius: var(--lly-radius);\n  padding: 12px 14px;\n  font-size: var(--lly-size-small);\n}\n.lly-node--timelimited { color: var(--lly-forest); }\n.lly-node--continuous  { color: var(--lly-navy); }\n.lly-node__trigger {\n  font-family: var(--lly-font-bold);\n  font-weight: 700;\n  display: block;\n  margin-bottom: 6px;\n}\n.lly-node__options { list-style: none; margin: 0; padding: 0; color: var(--lly-ink); }\n.lly-node__options > li { padding: 3px 0; }\n\n/* --- Key message ----------------------------------------------------------\n   The closing shared-decision-making statement: ink outline, red text. */\n.lly-keymsg {\n  border: var(--lly-border) solid var(--lly-ink);\n  border-radius: var(--lly-radius);\n  padding: 14px 18px;\n  color: var(--lly-red);\n  font-family: var(--lly-font-bold);\n  font-weight: 700;\n}\n\n/* --- Furniture ------------------------------------------------------------\n   Abbreviation lists and numbered references. 8pt in the source: small, but\n   approved copy that must ship on every screen that cites. */\n.lly-footnote { font-size: var(--lly-size-footnote); line-height: 1.35; color: var(--lly-ink); }\n.lly-sup { font-size: .72em; vertical-align: super; line-height: 0; }\n\n/* --- Section heading (non-card) ------------------------------------------ */\n.lly-section-title {\n  font-family: var(--lly-font-bold);\n  font-size: var(--lly-size-section);\n  font-weight: 700;\n  color: var(--lly-red);\n  margin: 0 0 8px;\n}\n\n/* --- Lilly logo ----------------------------------------------------------- */\n.lly-logo {\n  background-image: var(--lly-logo-lilly);\n  background-repeat: no-repeat;\n  background-position: left center;\n  background-size: contain;\n  width: 120px; height: 40px;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .lly-card--interactive { transition: none; }\n  .lly-card--interactive:hover { transform: none; }\n}\n\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #212121; overflow: hidden; }\n  a { color: #E1251B; text-decoration: none; }\n  a:hover { color: #212121; }\n  @keyframes cllUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n  @keyframes cllExpand { from { opacity: 0; transform: translateY(-7px); } to { opacity: 1; transform: none; } }\n  @keyframes cllRoll { from { max-height: 0; opacity: 0; } to { max-height: 420px; opacity: 1; } }\n  @keyframes cllGrow { from { grid-template-rows: 0fr; opacity: 0; } to { grid-template-rows: 1fr; opacity: 1; } }\n  @keyframes cllPop { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }\n  @keyframes cllTrunk { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }\n  @keyframes cllSceneNext { from { opacity: 0; transform: translateX(30px) scale(.99); } to { opacity: 1; transform: none; } }\n  @keyframes cllScenePrev { from { opacity: 0; transform: translateX(-30px) scale(.99); } to { opacity: 1; transform: none; } }\n  @keyframes cllSceneBack { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }\n  @keyframes cllSceneOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-6px); } }\n  @keyframes cllStage { from { opacity: 0; transform: translateY(-9px); } to { opacity: 1; transform: none; } }\n  @keyframes cllSpin { to { transform: rotate(360deg); } }\n  @keyframes cllLaunchPop { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }\n  @keyframes cllSettle { 0% { opacity: 0; transform: translateY(26px) scale(.97); } 70% { opacity: 1; transform: translateY(0) scale(1.008); } 100% { opacity: 1; transform: none; } }\n  @keyframes cllFade { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes cllTip { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }\n  @keyframes cllSign { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }\n  @keyframes cllNudgeSoft { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(2px); } }\n  /* Transform only - the chevrons' own inline opacity has to be free to fade them out. */\n  @keyframes cllBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }\n  @keyframes cllDrawLine { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }\n  @keyframes cllFieldMigrate { from { mask-size: 340% 340%; -webkit-mask-size: 340% 340%; } to { mask-size: 118% 118%; -webkit-mask-size: 118% 118%; } }\n  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }\n  @media print {\n    body bar\" style=\"position:relative;flex:0 0 auto;border-radius:var(--lly-radius);animation:cllFade .4s ease both\">\n        <p class=\"lly-titlebar__title\">CLL Clinical Decision Making: Patient Focused<\u002Fp>\n        <p class=\"lly-titlebar__sub\" style=\"font-style:italic\">Elderly patients with active CLL<\u002Fp>\n        <sc-if value=\"{{ howToPill }}\" hint-placeholder-val=\"{{ true }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ openWalk }}\" data-print-hide=\"1\" style=\"position:absolute;right:22px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;justify-content:center;gap:9px;width:186px;padding:8px 16px;border:1.5px solid #fff;border-radius:12px;background:#fff;color:#E1251B;font-family:var(--lly-font-bold);font-size:var(--lly-size-footnote);text-align:center;cursor:pointer;box-shadow:0 4px 14px rgba(33,33,33,.22);transition:box-shadow .18s ease\" style-hover=\"box-shadow:0 7px 18px rgba(33,33,33,.3)\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"6.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fcircle><path d=\"M6.3 6.2a1.8 1.8 0 1 1 2.1 2.1v1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"8\" cy=\"11.4\" r=\".85\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>\n            <span title=\"Placeholder copy - not from the approved infographic\">How to use this<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:12px 0;justify-content:{{ sceneJustify }};animation:{{ sceneAnim }}\">\n\n      <sc-if value=\"{{ show0 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center;height:100%\">\n urce is ready<\u002Fp>\n            <p class=\"lly-footnote\" style=\"margin:0 auto 6px;max-width:40ch\">{{ srcCitation }}<\u002Fp>\n            <p class=\"lly-footnote\" style=\"margin:0 auto 14px;max-width:40ch;color:{{ srcSubInk }}\">{{ srcSub }}<\u002Fp>\n            <p style=\"margin:0 auto 18px;padding:9px 12px;max-width:100%;border:1px solid rgba(33,33,33,.2);border-radius:10px;background:var(--lly-panel);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.4;color:#212121;word-break:break-all\">{{ srcUrl }}<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:center\">\n              <a ref=\"{{ srcGoRef }}\" href=\"{{ srcHref }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ goGuard }}\" aria-disabled=\"{{ srcDisabledAria }}\" style=\"display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:14px;background:{{ srcGoBg }};color:{{ srcGoInk }};border:{{ srcGoBorder }};font-family:var(--lly-font-bold);font-size:var(--lly-size-small);box-shadow:{{ srcGoShadow }};pointer-events:{{ srcGoEvents }};transition:transform .18s ease,filter .18s ease\" style-hover=\"transform:translateY(-2px);filter:brightness(1.03)\" title=\"Placeholder copy - not from the approved infographic\">Open in a new tab\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5\"><\u002Fpath><\u002Fsvg>\n              <\u002Fa>\n              <button type=\"button\" sc-camel-on-click=\"{{ copyLink }}\" style=\"display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:14px;background:#fff;color:#E1251B;border:1.5px solid #E1251B;font-family:var(--lly-font-bold);font-size:var(--lly-size-small);cursor:pointer;transition:background .18s ease,color .18s ease\" style-hover=\"background:#E1251B;color:#fff\" title=\"Placeholder copy - not from the approved infographic\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M5 15V5a2 2 0 0 1 2-2h8\"><\u002Fpath><\u002Fsvg>\n                Copy link\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <p aria-live=\"polite\" class=\"lly-footnote\" style=\"margin:14px 0 0;min-height:22px;font-family:var(--lly-font-bold);color:{{ srcStatusInk }}\">{{ srcStatus }}<\u002Fp>\n            <button ref=\"{{ srcBackRef }}\" type=\"button\" sc-camel-on-click=\"{{ closeSource }}\" class=\"lly-footnote\" style=\"display:block;margin:12px auto 0;border:0;background:none;color:#616161;cursor:pointer;text-decoration:underline;font-family:var(--lly-font-bold)\" style-hover=\"color:#212121\" title=\"Placeholder copy - not from the approved infographic\">Back to references<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ tipOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"lly-footnote\" style=\"position:absolute;z-index:9;max-width:380px;white-space:pre-line;background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius-sm);padding:9px 12px;box-shadow:0 10px 28px rgba(33,33,33,.2);pointer-events:none;left:{{ tipX }};top:{{ tipY }};animation:cllTip .28s cubic-bezier(.16,1,.3,1) both\">{{ tipText }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:720},&quot;showBridging&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Copy&quot;},&quot;showHowToPill&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Copy&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    scene: 0, dir: 1, visited: [0], motion: true, tip: null, refsOpen: false,\n    jump: false, walk: null, src: null,\n    patients: {}, tab: null, tabsSeen: [], features: {},\n    branch: {}, nodes: {}, subsequent: false, leaving: false\n  };\n\n  LAST = 6;\n\n  componentDidMount() {\n    this.fit = () => {\n      if (!this.stageEl) return;\n      const k = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n      this.stageEl.style.transform = \"translate(-50%,-50%) scale(\" + k + \")\";\n      this.scale = k;\n    };\n    this.fit();\n    window.addEventListener(\"resize\", this.fit);\n    const reduce = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n    if (reduce) { this.setState({ motion: false }); this.paintOnce(); }\n    else this.startField();\n    this.onKey = e => {\n      if (e.key === \"Escape\") { clearTimeout(this.srcTimer); this.setState({ refsOpen: false, walk: null, tip: null, src: null }); }\n      else if (this.state.src) return;\n      else if (e.key === \"ArrowRight\" && this.canAdvance()) this.go(this.state.scene + 1);\n      else if (e.key === \"ArrowLeft\" && this.state.scene > 1) this.go(this.state.scene - 1);\n    };\n    window.addEventListener(\"keydown\", this.onKey);\n    this.onSrcKey = e => this.srcKeys(e);\n    document.addEventListener(\"keydown\", this.onSrcKey, true);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"resize\", this.fit);\n    window.removeEventListener(\"keydown\", this.onKey);\n    document.removeEventListener(\"keydown\", this.onSrcKey, true);\n    clearTimeout(this.srcTimer);\n    clearTimeout(this.leaveTimer);\n    this.freezeField();\n  }\n\n  seedField() {\n    if (this.parts) return;\n    const n = Math.min(Math.floor(1280 / 34), 46);\n    this.parts = [];\n    for (let i = 0; i < n; i++) {\n      this.parts.push({\n        x: Math.random() * 1280, y: Math.random() * 720,\n        vx: (Math.random() - 0.5) * 0.32, vy: (Math.random() - 0.5) * 0.32,\n        r: Math.random() * 1.7 + 0.9\n      });\n    }\n  }\n\n  /* The approved decision-network motif, red-tinted per the deck's slide master.\n     It runs full-bleed on the title, then the mask migrates it into the top-right\n     corner and it keeps moving there for the rest of the flow. */\n  paintFrame(step) {\n    const c = this.canvasEl;\n    if (!c) return;\n    const ctx = c.getContext(\"2d\"), W = 1280, H = 720, p = this.parts;\n    ctx.clearRect(0, 0, W, H);\n    for (const q of p) {\n      if (step) {\n        q.x += q.vx; q.y += q.vy;\n        if (q.x < 0 || q.x > W) q.vx = -q.vx;\n        if (q.y < 0 || q.y > H) q.vy = -q.vy;\n      }\n      ctx.beginPath();\n      ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2);\n      ctx.fillStyle = \"rgba(225, 37, 27, 0.34)\";\n      ctx.fill();\n    }\n    for (let i = 0; i < p.length; i++) {\n      for (let j = i + 1; j < p.length; j++) {\n        const dx = p[i].x - p[j].x, dy = p[i].y - p[j].y;\n        const d = Math.sqrt(dx * dx + dy * dy);\n        if (d < 150) {\n          ctx.beginPath();\n          ctx.moveTo(p[i].x, p[i].y);\n          ctx.lineTo(p[j].x, p[j].y);\n          ctx.strokeStyle = \"rgba(225, 37, 27, \" + (0.13 - d / 1500) + \")\";\n          ctx.lineWidth = 1;\n          ctx.stroke();\n        }\n      }\n    }\n  }\n\n  paintOnce() { this.seedField(); this.paintFrame(false); }\n\n  startField() {\n    if (this.frame) return;\n    this.seedField();\n    const loop = () => { this.paintFrame(true); this.frame = requestAnimationFrame(loop); };\n    loop();\n  }\n\n  freezeField() {\n    if (this.frame) { cancelAnimationFrame(this.frame); this.frame = null; }\n  }\n\n  /* The outgoing scene fades away before the next one is mounted. */\n  go(i) {\n    const s = Math.max(0, Math.min(this.LAST, i));\n    if (s === this.state.scene || this.leaving) return;\n    const jump = Math.abs(s - this.state.scene) > 1;\n    this.leaving = true;\n    this.setState({ leaving: true, tip: null, refsOpen: false, walk: null, src: null });\n    clearTimeout(this.leaveTimer);\n    this.leaveTimer = setTimeout(() => {\n      this.leaving = false;\n      this.setState(st => ({\n        scene: s, dir: s > st.scene ? 1 : -1, jump, leaving: false,\n        visited: st.visited.includes(s) ? st.visited : st.visited.concat([s])\n      }));\n    }, 240);\n  }\n\n  /* Everything on the scene must be opened before the flow moves on. */\n  exploredAt(cur) {\n    const s = this.state, isNode = k => !!s.nodes[k];\n    if (cur === 1) return !!s.patients.a && !!s.patients.b;\n    if (cur === 2) return s.tabsSeen.length >= 3;\n    if (cur === 3) return !!s.features.btki && !!s.features.bcl2i;\n    if (cur === 4) return !!s.branch.tl && !!s.branch.ct && isNode(\"tl-c\") && isNode(\"tl-i\") && isNode(\"tl-p\") && isNode(\"ct-i\") && isNode(\"ct-p\");\n    if (cur === 5) return s.subsequent;\n    return true;\n  }\n\n  canAdvance() { return this.state.scene < this.LAST && this.exploredAt(this.state.scene); }\n\n  touch(fn) { this.setState(st => fn(st)); }\n\n  closeSource() {\n    clearTimeout(this.srcTimer);\n    this.setState({ src: null });\n    const t = this.srcTrigger;\n    if (t && t.focus) setTimeout(() => { try { t.focus(); } catch (err) {} }, 30);\n  }\n\n  /* Capture phase, exactly as the hub does it, so the scene keys never see these. */\n  srcKeys(e) {\n    if (!this.state.src) return;\n    if (e.key === \"Escape\") { e.preventDefault(); e.stopPropagation(); this.closeSource(); return; }\n    if (e.key !== \"Tab\" || !this.srcCard) return;\n    const f = this.srcCard.querySelectorAll('a[href], button:not([disabled])');\n    if (!f.length) return;\n    const first = f[0], last = f[f.length - 1];\n    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }\n    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }\n  }\n\n  tipFor(el, text) {\n    if (!this.stageEl) return null;\n    const a = el.getBoundingClientRect(), b = this.stageEl.getBoundingClientRect();\n    const k = this.scale || 1;\n    return { text, x: Math.min((a.left - b.left) / k, 860), y: (a.bottom - b.top) / k + 8 };\n  }\n\n  /* The pop-up shows the definition only - the abbreviation is already on screen. */\n  definitionOf(gloss) {\n    const i = gloss.indexOf(\", \");\n    const body = i > 0 ? gloss.slice(i + 2) : gloss;\n    return body.replace(/\\.$/, \"\");\n  }\n\n  labels() {\n    return [\"CLL Clinical Decision Making: Patient Focused\", \"Considerations in elderly patients\",\n      \"Consider: Patient background, Disease background, Patient preference\",\n      \"Consider: Key features of 1L treatment options\", \"Treatment algorithm example\",\n      \"Consider: For subsequent treatment\", \"End of resource\"];\n  }\n\n  bridgeFor(i) {\n    return [\"\", \"Next, three considerations: patient background, disease background and patient preference\",\n      \"With those in mind, what are the key features of the first-line treatment options?\",\n      \"How might those options play out across a treatment algorithm?\",\n      \"And once a patient has moved beyond first line, what should we consider next?\",\n      \"\", \"\"][i] || \"\";\n  }\n\n  /* Placeholder walkthrough copy - not from the approved infographic.\n     Each step shows the real on-screen control, not a stand-in icon. */\n  walkSteps() {\n    return [\n      { kind: \"nav\", title: \"Move between scenes\", body: \"The red forward control appears bottom right once you have opened everything on a scene. Back sits bottom left.\" },\n      { kind: \"pips\", title: \"Jump to any scene\", body: \"The numbered pips along the bottom cover every scene you have reached. Select one to move back or forward at any point.\" },\n      { kind: \"diamond\", title: \"Open a box\", body: \"A red diamond marks anything that opens, and it pulses until you open it. Patient examples, treatment options and each branch of the algorithm roll down when you select them.\" },\n      { kind: \"gloss\", title: \"See a definition\", body: \"Hover an abbreviation with a dotted underline for what it stands for. Each one is marked the first time it appears.\" },\n      { kind: \"chip\", title: \"Check a source\", body: \"Select a red citation chip next to a statement to see that reference in place. It clears as soon as you do anything else.\" },\n      { kind: \"prompt\", title: \"Follow the prompts\", body: \"A short red line above each group tells you what to open on that scene.\" },\n      { kind: \"refs\", title: \"References\", body: \"The full numbered reference list sits on the final scene, with a source link for each and a print option.\" },\n      { kind: \"contents\", title: \"Contents at the end\", body: \"The final scene lists every section so you can go back over anything you want to revisit.\" }\n    ];\n  }\n\n  renderVals() {\n    const s = this.state, cur = s.scene, tip = s.tip;\n    const isNode = k => !!s.nodes[k];\n    const openNode = k => () => this.touch(st => ({ nodes: Object.assign({}, st.nodes, { [k]: true }) }));\n    const pickTab = t => () => this.touch(st => ({\n      tab: t, tabsSeen: st.tabsSeen.includes(t) ? st.tabsSeen : st.tabsSeen.concat([t])\n    }));\n    /* A trigger stays lit once its panel has been revealed - all three end up open. */\n    const tabStyle = t => {\n      const on = s.tabsSeen.includes(t);\n      return {\n        border: on ? \"2px solid #E1251B\" : \"1.5px solid #212121\",\n        bg: on ? \"var(--lly-panel)\" : \"#fff\",\n        ink: on ? \"#E1251B\" : \"#212121\",\n        shadow: on ? \"0 6px 18px rgba(225,37,27,.16)\" : \"0 2px 6px rgba(33,33,33,.06)\"\n      };\n    };\n    const tp = tabStyle(\"patient\"), td = tabStyle(\"diseas
