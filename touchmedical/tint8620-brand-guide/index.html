display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:2px solid #212121;padding-bottom:10px\">\n        <h2 style=\"margin:0;font-family:var(--lly-font-bold);font-weight:700;font-size:26px\">11 · Knowledge check<\u002Fh2>\n        <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161\">Select, confirm, then feedback. Answers collate at the end.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:26px 30px\">\n        <sc-if value=\"{{ quizAsking }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:1.25fr 1fr;gap:30px;align-items:start\">\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-footnote);letter-spacing:.06em;text-transform:uppercase;color:#616161\">Question {{ qNum }} of {{ qTotal }}<\u002Fp>\n              <p style=\"margin:0;font-size:24px;line-height:1.25\">{{ qStem }}<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:2px\">\n                <sc-for list=\"{{ qOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:var(--lly-radius);cursor:pointer;text-align:left;font-size:var(--lly-size-small);transition:box-shadow .18s ease,transform .18s ease,border-color .18s ease,background .18s ease,color .18s ease;border:{{ o.border }};background:{{ o.bg }};color:{{ o.ink }}\" style-hover=\"transform:translateY(-1px);box-shadow:0 5px 16px rgba(33,33,33,.14)\" style-focus=\"outline:3px solid #212121;outline-offset:2px\">\n                    <span style=\"display:grid;place-items:center;width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:{{ o.dotBorder }};background:{{ o.dotBg }}\">\n                      <span style=\"width:8px;height:8px;border-radius:50%;background:{{ o.dotInk }}\"><\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"flex:1 1 auto\">{{ o.label }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ canConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:14px;animation:tlUp .35s cubic-bezier(.16,1,.3,1) both\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ confirmAnswer }}\" style=\"padding:13px 26px;border-radius:var(--lly-radius-pill);border:0;background:#E1251B;color:#fff;font-family:var(--lly-font-bold);font-size:var(--lly-size-small);cursor:pointer;box-shadow:0 6px 18px rgba(225,37,27,.26);transition:box-shadow .18s ease\" style-hover=\"box-shadow:0 9px 22px rgba(225,37,27,.34)\">Confirm answer<\u002Fbutton>\n                  <span style=\"font-size:var(--lly-size-footnote);color:#616161\">You can change your selection until you confirm<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ awaitingPick }}\" hint-placeholder-val=\"{{ true }}\">\n                <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161\">Select an answer to continue. Nothing is submitted until you confirm it.<\u002Fp>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ showFeedback }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border-radius:var(--lly-radius);border:2px solid {{ fbEdge }};background:{{ fbFill }};padding:18px 20px;animation:tlUp .45s cubic-bezier(.16,1,.3,1) both\">\n                  <p style=\"margin:0 0 4px;font-family:var(--lly-font-bold);font-weight:700;font-size:var(--lly-size-section);color:{{ fbEdge }}\">{{ fbTitle }}<\u002Fp>\n                  <p style=\"margin:0 0 10px;font-size:var(--lly-size-footnote);color:#616161\">Your answer: {{ fbPicked }}<\u002Fp>\n                  <p style=\"margin:0 0 12px;font-size:var(--lly-size-small);line-height:1.55\">{{ fbBody }}<\u002Fp>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n                    <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161\">Where this is documented: {{ fbRef }}<\u002Fp>\n                    <button type=\"button\" sc-camel-on-click=\"{{ nextQuestion }}\" style=\"display:inline-flex;align-items:center;gap:9px;padding:11px 20px;border-radius:var(--lly-radius-pill);border:0;background:#212121;color:#fff;font-family:var(--lly-font-bold);font-size:var(--lly-size-footnote);cursor:pointer;transition:box-shadow .18s ease\" style-hover=\"box-shadow:0 5px 14px rgba(33,33,33,.28)\">{{ nextLabel }}\n                      <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M4 1l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;background:var(--lly-panel);border-radius:var(--lly-radius);padding:20px 22px\">\n              <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-body);color:#E1251B\">What the earlier simulation is missing<\u002Fp>\n              <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\"><b>No confirmation step.<\u002Fb> Selecting an option submits it, so a misplaced click is a wrong answer. Here, selection and submission are two acts, and the choice stays changeable until confirmed.<\u002Fp>\n              <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\"><b>No selected state worth the name.<\u002Fb> The option is now filled, ringed and marked, so the learner can see what they are about to commit to.<\u002Fp>\n              <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\"><b>Feedback replaces the screen.<\u002Fb> There, the answer screen swaps out the question. Here it arrives beneath it, so the question, the choice and the explanation are readable together.<\u002Fp>\n              <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\"><b>Nothing is collated.<\u002Fb> Answers are held and returned at the end with a confidence rating, so the learner can see where their judgment and their knowledge diverged.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ quizReview }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:18px;animation:tlUp .5s cubic-bezier(.16,1,.3,1) both\">\n            <div>\n              <p style=\"margin:0 0 4px;font-size:24px;line-height:1.25\">Your answers<\u002Fp>\n              <p style=\"margin:0;font-size:var(--lly-size-small);color:#616161\">{{ scoreLine }}<\u002Fp>\n            <\u002Fdiv>\n            <sc-for list=\"{{ review }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div style=\"border:1.5px solid #212121;border-radius:var(--lly-radius);padding:16px 18px;display:flex;flex-direction:column;gap:10px\">\n                <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px\">\n                  <div>\n                    <p style=\"margin:0 0 3px;font-size:var(--lly-size-small);font-family:var(--lly-font-bold)\">{{ r.stem }}<\u002Fp>\n                    <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161\">You answered: {{ r.picked }}<\u002Fp>\n                  <\u002Fdiv>\n                  <span style=\"flex:0 0 auto;padding:5px 11px;border-radius:5px;font-size:10px;font-family:var(--lly-font-bold);letter-spacing:.06em;text-transform:uppercase;background:{{ r.badgeBg }};color:{{ r.badgeInk }}\">{{ r.badge }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n                  <span style=\"font-size:var(--lly-size-footnote);color:#616161\">How confident were you?<\u002Fspan>\n                  <sc-for list=\"{{ r.levels }}\" as=\"l\" hint-placeholder-count=\"3\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ l.set }}\" style=\"padding:6px 14px;border-radius:var(--lly-radius-pill);cursor:pointer;font-size:var(--lly-size-footnote);font-family:var(--lly-font-bold);transition:background .18s ease,color .18s ease,border-color .18s ease;border:{{ l.border }};background:{{ l.bg }};color:{{ l.ink }}\" style-hover=\"border-color:#E1251B;color:#E1251B\">{{ l.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-if value=\"{{ r.flagged }}\" hint-placeholder-val=\"{{ false }}\">\n                  <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#8D6708;line-height:1.5\">Confident and wrong, or unsure and right. Worth revisiting {{ r.ref }}.<\u002Fp>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;align-items:center;gap:14px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ restartQuiz }}\" style=\"padding:11px 22px;border-radius:var(--lly-radius-pill);border:1.5px solid #212121;background:#fff;color:#212121;font-family:var(--lly-font-bold);font-size:var(--lly-size-footnote);cursor:pointer;transition:background .18s ease,color .18s ease\" style-hover=\"background:#212121;color:#fff\">Run it again<\u002Fbutton>\n              <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.5\">In a real asset this panel is where the reflection record is assembled, and where a learner can print or copy their answers.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:22px 24px;display:flex;flex-direction:column;gap:12px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">The micro-interaction inventory<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\">Every control in a Lilly interactive answers on contact. A control with no hover state, no focus ring and no transition reads as a picture of a button, which is the flattest thing about the earlier simulation.<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\">The minimum set is: a hover that lifts by one pixel and adds shadow, a visible focus ring, a pressed state, a selected state that survives the next render, and a pop-in on anything that arrives after a click. Two hundred milliseconds or under, easing out.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:22px 24px;display:flex;flex-direction:column;gap:12px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">Assessment for learning, not scoring<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\">A tally tells a learner nothing they can act on. Pairing each answer with the confidence they held it at does: the gap between the two is the thing worth showing them, and it is what makes the closing panel a review rather than a result.<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\">Feedback names where the answer is documented, so a learner can go back to it. Confidently wrong answers are flagged for revisiting by name, never by score.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:24px;background:#212121;color:#fff;border-radius:var(--lly-radius);padding:24px 30px;margin-top:8px\">\n      <div style=\"display:flex;flex-direction:column;gap:10px;max-width:70ch\">\n        <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.55;color:rgba(255,255,255,.82)\">This page renders from the same stylesheet the assets load, so a token change moves the specimens with it. It documents the interactive layer only; clinical content, claims and copy remain the source's.<\u002Fp>\n        <p style=\"margin:0;font-size:var(--lly-size-footnote);line-height:1.5;color:rgba(255,255,255,.6)\">Built by Forged Frameworks — Dan Boyland — <a href=\"mailto:dan.boyland@forgedframeworks.co.uk\" style=\"color:#fff\">dan.boyland@forgedframeworks.co.uk<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n      <img src=\"31c11dc7-447a-42d1-8f80-01f46d3010e0\" alt=\"touch MEDICAL MEDIA\" style=\"flex:0 0 auto;width:168px;height:auto;filter:brightness(0) invert(1)\">\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1160,&quot;height&quot;:900},&quot;showReserved&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  state = { demo: false, sel: false, sceneOut: false, qi: 0, pick: null, confirmed: false, answers: [], conf: {} };\n\n  componentWillUnmount() { clearTimeout(this.t); }\n\n  /* The demo asks about this system, so the pattern can be shown\n     without inventing a clinical question to hang it on. */\n  questions() {\n    return [\n      { stem: \"Which control marks something that opens?\",\n        options: [\"A dotted underline\", \"A pulsing diamond chevron\", \"A red square chip\"],\n        correct: 1, ref: \"section 4, reveal and gating\",\n        body: \"The diamond chevron breathes on anything that opens and stops for good once that box has been opened. A dotted underline marks an abbreviation, and a red square chip is a citation.\" },\n      { stem: \"When does the forward control appear?\",\n        options: [\"On arrival, greyed out until the screen is explored\", \"Once everything on the screen has been opened\", \"After a short delay\"],\n        correct: 1, ref: \"section 4, forward is earned\",\n        body: \"Forward is absent rather than disabled until the screen has been explored, so there is nothing to click at and no ambiguity about why. Backward is always available.\" }\n    ];\n  }\n\n  renderVals() {\n    const s = this.state;\n    const Q = this.questions();\n    const q = Q[s.qi];\n    const right = !!q && s.pick === q.correct;\n    return {\n      motions: [\n        { name: \"Screen enter\", spec: \".5s cubic-bezier(.16,1,.3,1)\", use: \"Incoming content, drifting in from the direction of travel\" },\n        { name: \"Screen leave\", spec: \".24s ease\", use: \"Outgoing content fades before the next screen mounts\" },\n        { name: \"Box open\", spec: \".55s cubic-bezier(.16,1,.3,1)\", use: \"A card or node rolling down to its content\" },\n        { name: \"Line stage\", spec: \".55s, 300ms apart\", use: \"Bullets arriving one at a time inside an opened box\" },\n        { name: \"Affordance pulse\", spec: \"2.6s ease-in-out, infinite\", use: \"The diamond chevron, until its box has been opened\" },\n        { name: \"Elevation on hover\", spec: \".2s ease\", use: \"Shadow only, on genuinely clickable things\" },\n        { name: \"Interstitial prepare\", spec: \"1.7s, then reveal\", use: \"The pause before an external link is handed over\" }\n      ],\n      showReserved: this.props.showReserved ?? true,\n\n      quizAsking: s.qi < Q.length,\n      quizReview: s.qi >= Q.length,\n      qNum: Math.min(s.qi + 1, Q.length),\n      qTotal: Q.length,\n      qStem: q ? q.stem : \"\",\n      qOptions: (q ? q.options : []).map((label, i) => {\n        const on = s.pick === i;\n        return {\n          label, pick: () => { if (!this.state.confirmed) this.setState({ pick: i }); },\n          border: on ? \"2px solid #E1251B\" : \"1.5px solid #212121\",\n          bg: on ? \"var(--lly-panel)\" : \"#fff\",\n          ink: on ? \"#E1251B\" : \"#212121\",\n          dotBorder: on ? \"2px solid #E1251B\" : \"1.5px solid rgba(33,33,33,.45)\",\n          dotBg: \"#fff\",\n          dotInk: on ? \"#E1251B\" : \"transparent\"\n        };\n      }),\n      awaitingPick: !!q && s.pick === null,\n      canConfirm: !!q && s.pick !== null && !s.confirmed,\n      showFeedback: !!q && s.confirmed,\n      fbEdge: right ? \"#144B2D\" : \"#E1251B\",\n      fbFill: right ? \"rgba(20,75,45,.07)\" : \"rgba(225,37,27,.07)\",\n      fbTitle: right ? \"That is the one\" : \"Not quite\",\n      fbPicked: q && s.pick !== null ? q.options[s.pick] : \"\",\n      fbBody: q ? q.body : \"\",\n      fbRef: q ? q.ref : \"\",\n      nextLabel: s.qi >= Q.length - 1 ? \"See your answers\" : \"Next question\",\n      confirmAnswer: () => this.setState(st => {\n        const qq = this.questions()[st.qi];\n        return {\n          confirmed: true,\n          answers: st.answers.concat([{ stem: qq.stem, picked: qq.options[st.pick], right: st.pick === qq.correct, ref: qq.ref }])\n        };\n      }),\n      nextQuestion: () => this.setState(st => ({ qi: st.qi + 1, pick: null, confirmed: false })),\n      restartQuiz: () => this.setState({ qi: 0, pick: null, confirmed: false, answers: [], conf: {} }),\n      scoreLine: s.answers.length\n        ? \"Rate how sure you were of each one. The gap between confidence and outcome is the part worth reading.\"\n        : \"\",\n      review: s.answers.map((a, i) => ({\n        stem: a.stem, picked: a.picked, ref: a.ref,\n        badge: a.right ? \"Correct\" : \"Review\",\n        badgeBg: a.right ? \"rgba(20,75,45,.12)\" : \"rgba(225,37,27,.12)\",\n        badgeInk: a.right ? \"#144B2D\" : \"#E1251B\",\n        flagged: (s.conf[i] === \"High\" && !a.right) || (s.conf[i] === \"Low\" && a.right),\n        levels: [\"Low\", \"Medium\", \"High\"].map(label => {\n          const on = s.conf[i] === label;\n          return {\n            label,\n            set: () => this.setState(st => ({ conf: Object.assign({}, st.conf, { [i]: label }) })),\n            border: on ? \"1.5px solid #E1251B\" : \"1.5px solid rgba(33,33,33,.3)\",\n            bg: on ? \"var(--lly-panel)\" : \"#fff\",\n            ink: on ? \"#E1251B\" : \"#616161\"\n          };\n        })\n      })),\n\n      demoOpen: s.demo,\n      demoClosed: !s.demo,\n      toggleDemo: () => this.setState({ demo: true }),\n      resetDemo: e => { e.stopPropagation(); this.setState({ demo: false }); },\n      toggleSel: () => this.setState(st => ({ sel: !st.sel })),\n      selBorder: s.sel ? \"2px solid #E1251B\" : \"1.5px solid #212121\",\n      selBg: s.sel ? \"var(--lly-panel)\" : \"#fff\",\n      selInk: s.sel ? \"#E1251B\" : \"#212121\",\n      selShadow: s.sel ? \"0 6px 18px rgba(225,37,27,.16)\" : \"0 2px 6px rgba(33,33,33,.06)\",\n      sceneIn: !s.sceneOut,\n      sceneOut: s.sceneOut,\n      replay: () => {\n        clearTimeout(this.t);\n        this.setState({ sceneOut: true });\n        this.t = setTimeout(() => this.setState({ sceneOut: false }), 260);\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
