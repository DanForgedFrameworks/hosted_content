f5h9UE3lbZvT5no6Pbip0jMGJb2hLum8uko/jAN+yFXyl+sqPyo+joD6073XdQZkklfJ32+qfE48B4FhImiH35dJ1GImOYK6Sj+uq/xWf6+wDmnSIqhL+mJT5f/ob5XXYVstEdRV3luXvLMuaXtd8hXtz/g2VfpIXdIb2h+E70+nM7b3er8S3z/pZ/n/CzsB1eGrufgAAAAASUVORK5CYII=\");\n}\n\n\n/* ===========================================================================\n   Lilly CLL - component styles (the class vocabulary)\n   Structure and colour are lifted from the approved infographic. Anything the\n   print source could not have (hover, focus, selected) is marked DERIVED and\n   is built only from tokens already present in the source palette.\n   =========================================================================== */\n\n/* --- Foundations --------------------------------------------------------- */\n.lly-root {\n  font-family: var(--lly-font);\n  font-size: var(--lly-size-body);\n  line-height: var(--lly-lh-body);\n  color: var(--lly-ink);\n  background: var(--lly-white);\n}\n.lly-root *, .lly-root *::before, .lly-root *::after { box-sizing: border-box; }\n\n/* Screen shell. The source is text-dense: keep generous internal padding and\n   do not stretch measure much beyond 72ch. */\n.lly-screen { padding: 24px; max-width: 1200px; margin: 0 auto; }\n.lly-stack  { display: flex; flex-direction: column; gap: var(--lly-gap); }\n.lly-row    { display: flex; gap: var(--lly-gap); flex-wrap: wrap; }\n.lly-grid   { display: grid; gap: var(--lly-gap); grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }\n\n/* --- Title bar ------------------------------------------------------------\n   Solid red band, white text. In the source this is Background shape.png, a\n   3630x312 solid #E1251B block, reproduced here as a fill rather than an image. */\n.lly-titlebar {\n  background: var(--lly-red);\n  color: var(--lly-white);\n  padding: 14px 24px;\n  border-radius: var(--lly-radius-sm);\n}\n.lly-titlebar__title {\n  font-family: var(--lly-font-bold);\n  font-size: var(--lly-size-title);\n  line-height: var(--lly-lh-tight);\n  font-weight: 700;\n  margin: 0;\n}\n.lly-titlebar__sub {\n  font-size: var(--lly-size-subtitle);\n  line-height: var(--lly-lh-tight);\n  margin: 4px 0 0;\n  opacity: .95;\n}\n\n/* --- Card base ------------------------------------------------------------\n   Every content block in the source is a thin ink outline on white with a\n   generous corner radius. */\n.lly-card {\n  background: var(--lly-white);\n  border: var(--lly-border) solid var(--lly-ink);\n  border-radius: var(--lly-radius);\n  padding: var(--lly-pad);\n}\n\n/* --- Consider card --------------------------------------------------------\n   The four \"Consider: ...\" clusters. Heading is red, questions are an unmarked\n   list in ink, icon is the supplied artwork for that cluster. */\n.lly-consider__head {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  margin: 0 0 10px;\n}\n.lly-consider__title {\n  font-family: var(--lly-font-bold);\n  font-size: var(--lly-size-section);\n  line-height: var(--lly-lh-tight);\n  color: var(--lly-red);\n  font-weight: 700;\n  margin: 0;\n}\n.lly-icon {\n  width: 34px; height: 34px; flex: 0 0 34px;\n  background-repeat: no-repeat;\n  background-position: center;\n  background-size: contain;\n}\n.lly-icon--frailty    { background-image: var(--lly-icon-frailty); }\n.lly-icon--patient    { background-image: var(--lly-icon-patient); }\n.lly-icon--disease    { background-image: var(--lly-icon-disease); }\n.lly-icon--preference { background-image: var(--lly-icon-preference); }\n.lly-icon--bcl2i      { background-image: var(--lly-icon-bcl2i); }\n/* The cog artwork is WHITE. It must sit on red, never on white. */\n.lly-icon--btki {\n  background-image: var(--lly-icon-btki);\n  background-color: var(--lly-red);\n  border-radius: 50%;\n  padding: 3px;\n}\n\n.lly-questions { list-style: none; margin: 0; padding: 0; }\n.lly-questions > li {\n  position: relative;\n  padding-left: 18px;\n  margin: 0 0 10px;\n}\n.lly-questions > li:last-child { margin-bottom: 0; }\n.lly-questions > li::before {\n  content: \"\";\n  position: absolute; left: 0; top: .55em;\n  width: 7px; height: 7px; border-radius: 50%;\n  background: var(--lly-red);\n}\n\n/* DERIVED - not in the print source. Use only on cards the learner can select. */\n.lly-card--interactive { cursor: pointer; transition: box-shadow .15s, transform .15s; }\n.lly-card--interactive:hover { box-shadow: 0 4px 14px rgba(33,33,33,.16); transform: translateY(-2px); }\n.lly-card--interactive:focus-visible { outline: 3px solid var(--lly-red); outline-offset: 3px; }\n.lly-card--interactive[aria-pressed=\"true\"],\n.lly-card--selected { background: var(--lly-panel); border-color: var(--lly-red); border-width: 2px; }\n\n/* --- Pale panel -----------------------------------------------------------\n   The \"Identifying frailty\" block: pale blue fill, ink outline. */\n.lly-panel {\n  background: var(--lly-panel);\n  border: var(--lly-border) solid var(--lly-ink);\n  border-radius: var(--lly-radius);\n  padding: var(--lly-pad);\n}\n\n/* --- Patient profile ------------------------------------------------------\n   The two worked patient examples. Attribute list, no bullets. */\n.lly-profile__name {\n  font-family: var(--lly-font-bold);\n  font-size: var(--lly-size-body);\n  font-weight: 700;\n  color: var(--lly-ink);\n  margin: 0 0 8px;\n}\n.lly-profile__attrs { list-style: none; margin: 0; padding: 0; font-size: var(--lly-size-small); }\n.lly-profile__attrs > li { padding: 4px 0; border-top: 1px solid rgba(33,33,33,.15); }\n.lly-profile__attrs > li:first-child { border-top: 0; }\n\n/* --- 1L feature panel -----------------------------------------------------\n   BTKi / BCL-2i. Sky fill, navy outline, TOP corners only, red header bar with\n   white text, exactly as the source draws it. */\n.lly-feature {\n  background: var(--lly-sky);\n  border: var(--lly-border) solid var(--lly-navy);\n  border-radius: var(--lly-radius) var(--lly-radius) 0 0;\n  overflow: hidden;\n}\n.lly-feature__head {\n  background: var(--lly-red);\n  color: var(--lly-white);\n  font-family: var(--lly-font-bold);\n  font-weight: 700;\n  font-size: var(--lly-size-body);\n  padding: 10px 14px;\n  display: flex; align-items: center; gap: 10px;\n}\n.lly-feature__body { padding: 14px; }\n.lly-feature__list { list-style: none; margin: 0; padding: 0; }\n.lly-feature__list > li {\n  position: relative; padding-left: 16px; margin-bottom: 8px;\n  font-size: var(--lly-size-small);\n}\n.lly-feature__list > li:last-child { margin-bottom: 0; }\n.lly-feature__list > li::before {\n  content: \"\"; position: absolute; left: 0; top: .5em;\n  width: 6px; height: 6px; border-radius: 50%; background: var(--lly-navy);\n}\n\n/* --- Treatment algorithm --------------------------------------------------\n   Two branches, colour-coded throughout: TIME-LIMITED = forest, CONTINUOUS =\n   navy. The branch colour carries both the outline AND the text of its nodes. */\n.lly-branch {\n  display: inline-block;\n  color: var(--lly-white);\n  font-family: var(--lly-font-bold);\n  font-weight: 700;\n  font-size: var(--lly-size-body);\n  padding: 8px 18px;\n  border-radius: var(--lly-radius);\n}\n.lly-branch--timelimited { background: var(--lly-forest); }\n.lly-branch--continuous  { background: var(--lly-navy); }\n\n.lly-node {\n  background: var(--lly-white);\n  border: var(--lly-border) solid currentColor;\n  border-radius: var(--lly-radius);\n  padding: 12px 14px;\n  font-size: var(--lly-size-small);\n}\n.lly-node--timelimited { color: var(--lly-forest); }\n.lly-node--continuous  { color: var(--lly-navy); }\n.lly-node__trigger {\n  font-family: var(--lly-font-bold);\n  font-weight: 700;\n  display: block;\n  margin-bottom: 6px;\n}\n.lly-node__options { list-style: none; margin: 0; padding: 0; color: var(--lly-ink); }\n.lly-node__options > li { padding: 3px 0; }\n\n/* --- Key message ----------------------------------------------------------\n   The closing shared-decision-making statement: ink outline, red text. */\n.lly-keymsg {\n  border: var(--lly-border) solid var(--lly-ink);\n  border-radius: var(--lly-radius);\n  padding: 14px 18px;\n  color: var(--lly-red);\n  font-family: var(--lly-font-bold);\n  font-weight: 700;\n}\n\n/* --- Furniture ------------------------------------------------------------\n   Abbreviation lists and numbered references. 8pt in the source: small, but\n   approved copy that must ship on every screen that cites. */\n.lly-footnote { font-size: var(--lly-size-footnote); line-height: 1.35; color: var(--lly-ink); }\n.lly-sup { font-size: .72em; vertical-align: super; line-height: 0; }\n\n/* --- Section heading (non-card) ------------------------------------------ */\n.lly-section-title {\n  font-family: var(--lly-font-bold);\n  font-size: var(--lly-size-section);\n  font-weight: 700;\n  color: var(--lly-red);\n  margin: 0 0 8px;\n}\n\n/* --- Lilly logo ----------------------------------------------------------- */\n.lly-logo {\n  background-image: var(--lly-logo-lilly);\n  background-repeat: no-repeat;\n  background-position: left center;\n  background-size: contain;\n  width: 120px; height: 40px;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .lly-card--interactive { transition: none; }\n  .lly-card--interactive:hover { transform: none; }\n}\n\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #F4F6F8; }\n  a { color: #E1251B; text-decoration: none; }\n  a:hover { color: #212121; }\n  @keyframes tlUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }\n  @keyframes tlRoll { from { max-height: 0; opacity: 0; } to { max-height: 400px; opacity: 1; } }\n  @keyframes tlStage { from { opacity: 0; transform: translateY(-9px); } to { opacity: 1; transform: none; } }\n  @keyframes tlBreathe { 0%, 100% { transform: scale(1); opacity: .82; } 50% { transform: scale(1.1); opacity: 1; } }\n  @keyframes tlSceneOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-6px); } }\n  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"lly-root\" style=\"background:#F4F6F8;min-height:100vh;padding:0 0 90px\">\n\n  <div style=\"background:#212121;color:#fff;padding:44px 0 40px\">\n    <div style=\"max-width:1080px;margin:0 auto;padding:0 40px;display:flex;flex-direction:column;gap:18px\">\n      <span style=\"font-family:var(--lly-font-bold);font-size:var(--lly-size-footnote);letter-spacing:.18em;text-transform:uppercase;color:#E1251B\">Touch Medical · Interactive<\u002Fspan>\n      <h1 style=\"margin:0;font-family:var(--lly-font-bold);font-weight:700;font-size:44px;line-height:1.1;max-width:24ch\">The house system for Lilly interactive assets<\u002Fh1>\n      <p style=\"margin:0;max-width:66ch;font-size:var(--lly-size-section);line-height:1.5;color:rgba(255,255,255,.82)\">This is the brand and style guideline being authored for Lilly interactive assets, not a record of one that exists. Role-based slots rather than a fixed palette: the system names what each colour, size and state is <i>for<\u002Fi>, and every asset fills those slots from its own source. Four roles are fixed house-wide, and every value is traceable rather than chosen.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:4px\">\n        <span style=\"padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);font-size:var(--lly-size-footnote);font-family:var(--lly-font-bold)\">Draft · nothing signed off yet<\u002Fspan>\n        <span style=\"padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);font-size:var(--lly-size-footnote);font-family:var(--lly-font-bold)\">lly-* namespace<\u002Fspan>\n        <span style=\"padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);font-size:var(--lly-size-footnote);font-family:var(--lly-font-bold)\">Rendered from lilly/styles.css<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1080px;margin:0 auto;padding:0 40px;display:flex;flex-direction:column;gap:30px\">\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:-22px\">\n      <div style=\"background:#fff;border:2px solid #E1251B;border-radius:var(--lly-radius);padding:22px 26px;box-shadow:0 8px 24px rgba(33,33,33,.1)\">\n        <p style=\"margin:0 0 8px;font-family:var(--lly-font-bold);font-weight:700;font-size:20px;color:#E1251B\">Rule one: no new copy<\u002Fp>\n        <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.55\">An interactive may use more screens than its source. It may not contain a sentence the source does not contain. Screen titles and navigation labels come from headings already in the source, and anything written for the interactive layer is marked in the build so a reviewer can tell at a glance what is verbatim and what needs a decision.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:2px solid #E1251B;border-radius:var(--lly-radius);padding:22px 26px;box-shadow:0 8px 24px rgba(33,33,33,.1)\">\n        <p style=\"margin:0 0 8px;font-family:var(--lly-font-bold);font-weight:700;font-size:20px;color:#E1251B\">Rule two: colour is traced, not chosen<\u002Fp>\n        <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.55\">Every value here was pulled from the asset's source file rather than picked. Hover, focus and selected states are built by changing the opacity, elevation and weight of colours already in the palette, never by adding a hue. That discipline is this guideline's rule, and it is what makes the palette defensible.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:flex-start;gap:20px;background:#fff;border-left:4px solid #212121;border-radius:var(--lly-radius);padding:18px 22px\">\n      <span style=\"flex:0 0 auto;padding:5px 11px;border-radius:5px;background:#212121;color:#fff;font-size:10px;font-family:var(--lly-font-bold);letter-spacing:.06em;text-transform:uppercase\">Status<\u002Fspan>\n      <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\">There is no existing Lilly brand style guide, no approved font and no approved interactive palette. Medical review covers technical content and design choices; the brand and style layer is what this document sets out, for the client to confirm and adopt. Everything here is therefore a recommendation with its provenance shown, not a rule inherited from somewhere else.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:2px solid #212121;padding-bottom:10px\">\n        <h2 style=\"margin:0;font-family:var(--lly-font-bold);font-weight:700;font-size:26px\">1 · Colour roles<\u002Fh2>\n        <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161\">Fixed roles hold across every Lilly asset. Slot roles are refilled per asset.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:74px 1fr 154px 118px;gap:18px;align-items:center;background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:14px 18px\">\n        <span style=\"height:52px;border-radius:10px;background:var(--lly-red)\"><\u002Fspan>\n        <div>\n          <p style=\"margin:0 0 3px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">Brand signal<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.45\">Masthead band, section headings, question markers, citation chips, and the one forward action. Never a background for long copy.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px\">--lly-red<\u002Fp>\n          <p style=\"margin:2px 0 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#616161\">#E1251B<\u002Fp>\n        <\u002Fdiv>\n        <span style=\"justify-self:start;padding:4px 9px;border-radius:5px;background:#212121;color:#fff;font-size:10px;font-family:var(--lly-font-bold);letter-spacing:.06em;text-transform:uppercase\">Fixed<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:74px 1fr 154px 118px;gap:18px;align-items:center;background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:14px 18px\">\n        <span style=\"height:52px;border-radius:10px;background:var(--lly-ink)\"><\u002Fspan>\n        <div>\n          <p style=\"margin:0 0 3px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">Ink and outline<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.45\">All body copy, and the thin outline on every card. One ink and one outline weight; depth comes from shadow, not from a second grey.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px\">--lly-ink<\u002Fp>\n          <p style=\"margin:2px 0 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#616161\">#212121<\u002Fp>\n        <\u002Fdiv>\n        <span style=\"justify-self:start;padding:4px 9px;border-radius:5px;background:#212121;color:#fff;font-size:10px;font-family:var(--lly-font-bold);letter-spacing:.06em;text-transform:uppercase\">Fixed<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:74px 1fr 154px 118px;gap:18px;align-items:center;background:#fff;border:1.5px solid var(--lly-navy);border-radius:var(--lly-radius);padding:14px 18px\">\n        <span style=\"height:52px;border-radius:10px;background:var(--lly-navy)\"><\u002Fspan>\n        <div>\n          <p style=\"margin:0 0 3px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body);color:var(--lly-navy)\">Pathway: continuous therapy<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.45\">Semantic, not decorative. Navy carries the continuous-therapy route on the entry pill and every node beneath it, in every therapy area. It is the reader's only cue to which path they are on.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px\">--lly-navy<\u002Fp>\n          <p style=\"margin:2px 0 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#616161\">#0F3A85<\u002Fp>\n        <\u002Fdiv>\n        <span style=\"justify-self:start;padding:4px 9px;border-radius:5px;background:var(--lly-navy);color:#fff;font-size:10px;font-family:var(--lly-font-bold);letter-spacing:.06em;text-transform:uppercase\">Fixed<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:74px 1fr 154px 118px;gap:18px;align-items:center;background:#fff;border:1.5px solid var(--lly-forest);border-radius:var(--lly-radius);padding:14px 18px\">\n        <span style=\"height:52px;border-radius:10px;background:var(--lly-forest)\"><\u002Fspan>\n        <div>\n          <p style=\"margin:0 0 3px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body);color:var(--lly-forest)\">Pathway: time-limited therapy<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.45\">The paired route, including treatment-free periods. Swapping the pair, or borrowing either colour for anything that is not a treatment route, breaks the cue.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px\">--lly-forest<\u002Fp>\n          <p style=\"margin:2px 0 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#616161\">#144B2D<\u002Fp>\n        <\u002Fdiv>\n        <span style=\"justify-self:start;padding:4px 9px;border-radius:5px;background:var(--lly-forest);color:#fff;font-size:10px;font-family:var(--lly-font-bold);letter-spacing:.06em;text-transform:uppercase\">Fixed<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:74px 1fr 154px 118px;gap:18px;align-items:center;background:#fff;border:1.5px dashed #212121;border-radius:var(--lly-radius);padding:14px 18px\">\n        <span style=\"height:52px;border-radius:10px;background:var(--lly-panel);border:1px solid rgba(33,33,33,.18)\"><\u002Fspan>\n        <div>\n          <p style=\"margin:0 0 3px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">Framing panel<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.45\">The pale surface framing definitional or scene-setting content, and the fill behind bridging prompts and modal headers. One panel tone per asset; a second reads as a new colour.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px\">--lly-panel<\u002Fp>\n          <p style=\"margin:2px 0 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#616161\">#EBF2FA<\u002Fp>\n        <\u002Fdiv>\n        <span style=\"justify-self:start;padding:4px 9px;border-radius:5px;background:#fff;border:1.5px solid #212121;color:#212121;font-size:10px;font-family:var(--lly-font-bold);letter-spacing:.06em;text-transform:uppercase\">Slot<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:74px 1fr 154px 118px;gap:18px;align-items:center;background:#fff;border:1.5px dashed #212121;border-radius:var(--lly-radius);padding:14px 18px\">\n        <span style=\"height:52px;border-radius:10px;background:var(--lly-sky)\"><\u002Fspan>\n        <div>\n          <p style=\"margin:0 0 3px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">Comparison fill<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.45\">The fill for side-by-side option panels, where two things are weighed rather than routed. Takes ink copy, never white.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px\">--lly-sky<\u002Fp>\n          <p style=\"margin:2px 0 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#616161\">#99BFE5<\u002Fp>\n        <\u002Fdiv>\n        <span style=\"justify-self:start;padding:4px 9px;border-radius:5px;background:#fff;border:1.5px solid #212121;color:#212121;font-size:10px;font-family:var(--lly-font-bold);letter-spacing:.06em;text-transform:uppercase\">Slot<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:74px 1fr 154px 118px;gap:18px;align-items:center;background:#fff;border:1.5px dashed #212121;border-radius:var(--lly-radius);padding:14px 18px\">\n        <span style=\"height:52px;border-radius:10px;background:var(--lly-mist)\"><\u002Fspan>\n        <div>\n          <p style=\"margin:0 0 3px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">Background field<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.45\">The decorative motif only: network art, connective lines, the ambient corner graphic. Never carries content, never sits behind copy at full strength.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px\">--lly-mist<\u002Fp>\n          <p style=\"margin:2px 0 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#616161\">#E4EBF1<\u002Fp>\n        <\u002Fdiv>\n        <span style=\"justify-self:start;padding:4px 9px;border-radius:5px;background:#fff;border:1.5px solid #212121;color:#212121;font-size:10px;font-family:var(--lly-font-bold);letter-spacing:.06em;text-transform:uppercase\">Slot<\u002Fspan>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showReserved }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;align-items:flex-start;gap:18px;background:#fff;border:1.5px solid rgba(33,33,33,.28);border-radius:var(--lly-radius);padding:16px 18px\">\n        <div style=\"display:flex;gap:8px;flex:0 0 auto\">\n          <span style=\"width:34px;height:46px;border-radius:8px;background:var(--lly-amber-unused);opacity:.42\"><\u002Fspan>\n          <span style=\"width:34px;height:46px;border-radius:8px;background:var(--lly-salmon-unused);opacity:.42\"><\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0 0 3px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body);color:#616161\">Held back — #FFC709 and #F58E7D<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.45\">Accent five and six sit in the client theme but appear nowhere in the source deck, so they are held rather than banned. Opening one is a decision this guideline makes deliberately, with a named role attached, rather than something an asset reaches for when it runs short of colours.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"background:var(--lly-panel);border-radius:var(--lly-radius);padding:18px 22px\">\n        <p style=\"margin:0 0 6px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body);color:#E1251B\">Filling the slots on a new asset<\u002Fp>\n        <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.55\">Pull the theme colour scheme out of the approved source and map it by role, not by slot number. Brand signal and ink are already answered. If the source has two treatment routes, they take navy and forest regardless of what the source used for them. The remaining hues fill framing panel, comparison fill and background field. Any colour left over stays unused, and is recorded as such.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:2px solid #212121;padding-bottom:10px\">\n        <h2 style=\"margin:0;font-family:var(--lly-font-bold);font-weight:700;font-size:26px\">2 · Type<\u002Fh2>\n        <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161\">Six sizes, two weights, one family. Sizes are the source's print points mapped to screen.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:26px 30px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:grid;grid-template-columns:1fr 230px;gap:24px;align-items:baseline;border-bottom:1px solid rgba(33,33,33,.12);padding-bottom:16px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-weight:700;font-size:var(--lly-size-title);line-height:1.15\">Clinical decision making<\u002Fp>\n          <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#616161\">--lly-size-title · 28px<br>masthead only, bold<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 230px;gap:24px;align-items:baseline;border-bottom:1px solid rgba(33,33,33,.12);padding-bottom:16px\">\n          <p style=\"margin:0;font-size:var(--lly-size-subtitle);font-style:italic;line-height:1.25\">The patient population in scope<\u002Fp>\n          <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#616161\">--lly-size-subtitle · 19px<br>masthead second line, italic<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 230px;gap:24px;align-items:baseline;border-bottom:1px solid rgba(33,33,33,.12);padding-bottom:16px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-weight:700;font-size:var(--lly-size-section);color:#E1251B;line-height:1.25\">Consider: patient background<\u002Fp>\n          <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#616161\">--lly-size-section · 18px<br>section headings, bold, brand signal<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 230px;gap:24px;align-items:baseline;border-bottom:1px solid rgba(33,33,33,.12);padding-bottom:16px\">\n          <p style=\"margin:0;font-size:var(--lly-size-body);line-height:var(--lly-lh-body)\">Question and statement copy carried straight from the approved source, set at reading length and never justified below this size.<\u002Fp>\n          <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#616161\">--lly-size-body · 15px<br>clinical copy, regular<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 230px;gap:24px;align-items:baseline;border-bottom:1px solid rgba(33,33,33,.12);padding-bottom:16px\">\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.5\">Algorithm node options, bridging lines, walkthrough body and interface labels.<\u002Fp>\n          <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#616161\">--lly-size-small · 13px<br>interface and node copy<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 230px;gap:24px;align-items:baseline\">\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);line-height:1.45\">Abbreviations, references, provenance and the job code.<\u002Fp>\n          <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#616161\">--lly-size-footnote · 11px<br>the floor, never smaller<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:20px 24px\">\n          <p style=\"margin:0 0 8px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">The house position on the face<\u002Fp>\n          <p style=\"margin:0 0 10px;font-size:var(--lly-size-small);line-height:1.55\">No font has been approved. The deck theme names Ringside, which is licensed and not distributed with assets, while the deck's own text runs set Arial. This guideline recommends Arial and keeps Ringside first in the stack so it is picked up wherever the client has it installed. Earlier assets used a geometric sans, which loses definition at footnote size in dense clinical copy.<\u002Fp>\n          <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#616161;word-break:break-word\">\"Ringside Book\", \"Ringside\", Arial, Helvetica, sans-serif<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1.5px solid rgba(33,33,33,.28);border-radius:var(--lly-radius);padding:20px 24px\">\n          <p style=\"margin:0 0 8px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body);color:#616161\">On a second, more designed face<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.55\">Clinical copy stays on the source's face. If a Touch chrome face is wanted for the interface layer, it is declared as a separate slot and applied to nothing carrying approved copy. A geometric sans loses legibility at footnote size in dense clinical text, so the chrome face never inherits downward.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:2px solid #212121;padding-bottom:10px\">\n        <h2 style=\"margin:0;font-family:var(--lly-font-bold);font-weight:700;font-size:26px\">3 · Interaction states<\u002Fh2>\n        <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161\">Derived from the palette, applied only to things that are genuinely clickable.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:26px 30px;display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-small);letter-spacing:.06em;text-transform:uppercase;color:#616161\">Openable card<\u002Fp>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid #E1251B;border-radius:var(--lly-radius);background:linear-gradient(180deg,#fff,rgba(225,37,27,.05));padding:14px 16px;cursor:pointer;transition:box-shadow .2s ease\" style-hover=\"box-shadow:0 4px 14px rgba(33,33,33,.14)\">\n              <span style=\"font-family:var(--lly-font-bold);font-size:var(--lly-size-small);color:#E1251B\">Rest — hover me<\u002Fspan>\n              <span style=\"display:flex;color:#E1251B;animation:tlBreathe 2.6s ease-in-out infinite\" aria-hidden=\"true\">\n                <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 2.5 21.5 12 12 21.5 2.5 12z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><\u002Fpath><path d=\"M8.6 10.4 12 13.8l3.4-3.4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.45\">Brand-signal outline, a five per cent wash of the same colour, and a chevron that breathes until the card has been opened once. Hover adds elevation only.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-small);letter-spacing:.06em;text-transform:uppercase;color:#616161\">Selected and unreachable<\u002Fp>\n            <div style=\"display:flex;gap:12px;align-items:stretch\">\n              <button type=\"button\" sc-camel-on-click=\"{{ toggleSel }}\" style=\"flex:1 1 0;padding:14px 16px;border-radius:var(--lly-radius);cursor:pointer;text-align:left;font-family:var(--lly-font-bold);font-size:var(--lly-size-small);transition:box-shadow .2s ease,background .2s ease,border-color .2s ease,color .2s ease;border:{{ selBorder }};background:{{ selBg }};color:{{ selInk }};box-shadow:{{ selShadow }}\" style-hover=\"box-shadow:0 5px 16px rgba(33,33,33,.16)\">Select me<\u002Fbutton>\n              <span style=\"flex:1 1 0;padding:14px 16px;border:1.5px solid rgba(33,33,33,.3);border-radius:var(--lly-radius);background:#fff;color:rgba(33,33,33,.45);font-family:var(--lly-font-bold);font-size:var(--lly-size-small)\">Not yet reachable<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.45\">Selected takes a two-pixel brand outline, the panel fill and brand-signal ink. Unreachable drops ink and outline to thirty per cent and takes no pointer. No greys outside those two opacities.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px;border-top:1px solid rgba(33,33,33,.12);padding-top:22px\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-small);letter-spacing:.06em;text-transform:uppercase;color:#616161\">Focus<\u002Fp>\n            <div style=\"display:flex;gap:12px;align-items:center\">\n              <button type=\"button\" style=\"display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:12px;background:#E1251B;color:#fff;cursor:pointer\" style-focus=\"outline:3px solid #212121;outline-offset:2px\">\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M4 1l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n              <button type=\"button\" style=\"padding:10px 18px;border:1.5px solid #212121;border-radius:12px;background:#fff;color:#212121;font-family:var(--lly-font-bold);font-size:var(--lly-size-footnote);cursor:pointer\" style-focus=\"outline:3px solid #E1251B;outline-offset:2px\">Tab to me<\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.45\">Focus is always a visible ring offset by two pixels, in whichever of ink or brand signal the control is not already using. It is never removed, and never replaced by the hover treatment.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-small);letter-spacing:.06em;text-transform:uppercase;color:#616161\">Shape<\u002Fp>\n            <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n              <span style=\"padding:11px 16px;border:1.5px solid #212121;border-radius:var(--lly-radius);font-size:var(--lly-size-footnote)\">14px · cards and nodes<\u002Fspan>\n              <span style=\"padding:11px 16px;border:1.5px solid #212121;border-radius:var(--lly-radius-sm);font-size:var(--lly-size-footnote)\">8px · pills inside nodes<\u002Fspan>\n              <span style=\"padding:11px 18px;border:1.5px solid #212121;border-radius:var(--lly-radius-pill);font-size:var(--lly-size-footnote)\">pill · primary actions<\u002Fspan>\n              <span style=\"padding:11px 16px;border:1.5px solid #212121;border-radius:12px;font-size:var(--lly-size-footnote)\">12px · interface chrome<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.45\">Content shapes come from the source's two rounded families. Interface chrome, which the source has none of, sits at twelve pixels so it reads as a layer above the content rather than part of it.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:2px solid #212121;padding-bottom:10px\">\n        <h2 style=\"margin:0;font-family:var(--lly-font-bold);font-weight:700;font-size:26px\">4 · Reveal and gating<\u002Fh2>\n        <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161\">The pattern that turns a printed layout into a paced one.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1.05fr 1fr;gap:20px\">\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:24px 26px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-small);letter-spacing:.06em;text-transform:uppercase;color:#616161\">Try it<\u002Fp>\n          <div sc-camel-on-click=\"{{ toggleDemo }}\" role=\"button\" sc-camel-tab-index=\"0\" style=\"border:1.5px solid #E1251B;border-radius:var(--lly-radius);background:linear-gradient(180deg,#fff,rgba(225,37,27,.05));padding:16px 18px;cursor:pointer;transition:box-shadow .2s ease\" style-hover=\"box-shadow:0 4px 14px rgba(33,33,33,.14)\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:10px\">\n              <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-body);color:#E1251B\">A patient example<\u002Fp>\n              <sc-if value=\"{{ demoClosed }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"flex:0 0 22px;display:flex;color:#E1251B;animation:tlBreathe 2.6s ease-in-out infinite\" aria-hidden=\"true\">\n                  <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 2.5 21.5 12 12 21.5 2.5 12z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><\u002Fpath><path d=\"M8.6 10.4 12 13.8l3.4-3.4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ demoOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"overflow:hidden;max-height:400px;animation:tlRoll .55s cubic-bezier(.16,1,.3,1)\">\n                <div style=\"overflow:hidden\">\n                  <ul style=\"margin:12px 0 0;padding-left:18px;font-size:var(--lly-size-small);line-height:1.6\">\n                    <li style=\"animation:tlStage .55s cubic-bezier(.16,1,.3,1) .10s both\">One attribute per line<\u002Fli>\n                    <li style=\"animation:tlStage .55s cubic-bezier(.16,1,.3,1) .40s both\">Each arriving three hundred milliseconds after the last<\u002Fli>\n                    <li style=\"animation:tlStage .55s cubic-bezier(.16,1,.3,1) .70s both\">So the eye is led rather than flooded<\u002Fli>\n                    <li style=\"animation:tlStage .55s cubic-bezier(.16,1,.3,1) 1.00s both\">And each line is read before the next lands<\u002Fli>\n                  <\u002Ful>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ resetDemo }}\" style=\"align-self:flex-start;border:0;background:none;padding:0;color:#E1251B;font-family:var(--lly-font-bold);font-size:var(--lly-size-footnote);cursor:pointer\" style-hover=\"color:#212121\">Reset<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:24px 26px;display:flex;flex-direction:column;gap:12px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">The four rules<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\"><b>Nothing is open on arrival.<\u002Fb> Every screen lands closed, so the learner's first act is a choice rather than a scroll.<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\"><b>The affordance pulses until it is used.<\u002Fb> A diamond chevron breathes on anything that opens, and stops for good once that box has been opened.<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\"><b>Content stages, it does not appear.<\u002Fb> A box rolls down, then its lines arrive one at a time. Nothing on a screen animates twice.<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\"><b>Forward is earned.<\u002Fb> The forward control is absent, not disabled, until everything on the screen has been opened. Backward is always available.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:2px solid #212121;padding-bottom:10px\">\n        <h2 style=\"margin:0;font-family:var(--lly-font-bold);font-weight:700;font-size:26px\">5 · Motion<\u002Fh2>\n        <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161\">Soft easing, one direction of travel, and a reduced-motion path that removes all of it.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:26px 30px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:grid;grid-template-columns:180px 300px 1fr;gap:16px;align-items:center;padding-bottom:10px;border-bottom:1px solid rgba(33,33,33,.12)\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-footnote);letter-spacing:.06em;text-transform:uppercase;color:#616161\">Move<\u002Fp>\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-footnote);letter-spacing:.06em;text-transform:uppercase;color:#616161\">Duration and easing<\u002Fp>\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-footnote);letter-spacing:.06em;text-transform:uppercase;color:#616161\">What it is for<\u002Fp>\n        <\u002Fdiv>\n        <sc-for list=\"{{ motions }}\" as=\"m\" hint-placeholder-count=\"7\">\n          <div style=\"display:grid;grid-template-columns:180px 300px 1fr;gap:16px;align-items:baseline\">\n            <p style=\"margin:0;font-size:var(--lly-size-small);font-family:var(--lly-font-bold)\">{{ m.name }}<\u002Fp>\n            <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#616161\">{{ m.spec }}<\u002Fp>\n            <p style=\"margin:0;font-size:var(--lly-size-footnote);line-height:1.5;color:#616161\">{{ m.use }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:flex;align-items:center;gap:20px;border-top:1px solid rgba(33,33,33,.12);padding-top:18px;margin-top:6px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ replay }}\" style=\"flex:0 0 auto;padding:10px 20px;border-radius:var(--lly-radius-pill);border:0;background:#E1251B;color:#fff;font-family:var(--lly-font-bold);font-size:var(--lly-size-footnote);cursor:pointer\">Replay a scene change<\u002Fbutton>\n          <sc-if value=\"{{ sceneIn }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"flex:1 1 auto;display:flex;gap:12px;animation:tlUp .5s cubic-bezier(.16,1,.3,1) both\">\n              <span style=\"flex:1 1 0;height:44px;border-radius:var(--lly-radius);background:var(--lly-panel)\"><\u002Fspan>\n              <span style=\"flex:1 1 0;height:44px;border-radius:var(--lly-radius);background:var(--lly-panel)\"><\u002Fspan>\n              <span style=\"flex:1 1 0;height:44px;border-radius:var(--lly-radius);background:var(--lly-panel)\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ sceneOut }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1 1 auto;display:flex;gap:12px;animation:tlSceneOut .24s ease both\">\n              <span style=\"flex:1 1 0;height:44px;border-radius:var(--lly-radius);background:var(--lly-panel)\"><\u002Fspan>\n              <span style=\"flex:1 1 0;height:44px;border-radius:var(--lly-radius);background:var(--lly-panel)\"><\u002Fspan>\n              <span style=\"flex:1 1 0;height:44px;border-radius:var(--lly-radius);background:var(--lly-panel)\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.5\">Outgoing content fades before incoming content is mounted, so the two never cross. Every asset carries a background-motion switch and honours the operating system's reduced-motion setting by disabling animation, not by shortening it.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:2px solid #212121;padding-bottom:10px\">\n        <h2 style=\"margin:0;font-family:var(--lly-font-bold);font-weight:700;font-size:26px\">6 · Artwork<\u002Fh2>\n        <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161\">Supplied graphics are the approved artwork. Substitutes are not drawn.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:26px 30px;display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n            <span class=\"lly-icon lly-icon--frailty\" aria-hidden=\"true\"><\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:#616161\">frailty<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n            <span class=\"lly-icon lly-icon--patient\" aria-hidden=\"true\"><\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:#616161\">patient<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n            <span class=\"lly-icon lly-icon--disease\" aria-hidden=\"true\"><\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:#616161\">disease<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n            <span class=\"lly-icon lly-icon--preference\" aria-hidden=\"true\"><\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:#616161\">preference<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n            <span class=\"lly-icon lly-icon--btki\" aria-hidden=\"true\"><\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:#616161\">btki<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n            <span class=\"lly-icon lly-icon--bcl2i\" aria-hidden=\"true\"><\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:#616161\">bcl2i<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n            <span class=\"lly-logo\" style=\"width:120px;height:40px\" aria-hidden=\"true\"><\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:#616161\">logo<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px solid rgba(33,33,33,.12);padding-top:20px\">\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\"><b>White artwork keeps its ground.<\u002Fb> Any supplied graphic drawn in white carries the brand-signal background that comes with it. Placed on white it disappears, and redrawing it in another colour makes it unapproved artwork.<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\"><b>Nothing is illustrated to fill a gap.<\u002Fb> If a screen needs an image the source does not supply, the screen is wrong. Diagram lines and arrows are drawn in the pathway colours at a hairline weight and always dashed, so they read as structure rather than content.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:2px solid #212121;padding-bottom:10px\">\n        <h2 style=\"margin:0;font-family:var(--lly-font-bold);font-weight:700;font-size:26px\">7 · Components<\u002Fh2>\n        <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161\">Nine parts cover every screen we have built. A tenth needs a reason, not a preference.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:22px 24px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-small);letter-spacing:.06em;text-transform:uppercase;color:#616161\">Masthead<\u002Fp>\n          <div class=\"lly-titlebar\" style=\"border-radius:var(--lly-radius)\">\n            <p class=\"lly-titlebar__title\">The asset title, carried verbatim<\u002Fp>\n            <p class=\"lly-titlebar__sub\" style=\"font-style:italic\">The population, in italic<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.5\">On every screen but the title. Holds the interface entry point at its right edge, in reverse, so the chrome never competes with the content.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:22px 24px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-small);letter-spacing:.06em;text-transform:uppercase;color:#616161\">Question cluster<\u002Fp>\n          <div class=\"lly-card\" style=\"border-radius:var(--lly-radius)\">\n            <div class=\"lly-consider__head\">\n              <span class=\"lly-icon lly-icon--patient\" style=\"width:28px;height:28px;flex:0 0 28px\" aria-hidden=\"true\"><\u002Fspan>\n              <p class=\"lly-consider__title\" style=\"font-size:var(--lly-size-section)\">Consider: a heading from the source<\u002Fp>\n            <\u002Fdiv>\n            <ul class=\"lly-questions\" style=\"margin:0\">\n              <li>Two to four questions, verbatim, red dot markers, staged in<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.5\">The workhorse. Icon plus brand-signal heading, then the source's questions. Questions are never answered by the asset.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:22px 24px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-small);letter-spacing:.06em;text-transform:uppercase;color:#616161\">Option panel, always in pairs<\u002Fp>\n          <div class=\"lly-feature\" style=\"border-radius:var(--lly-radius);border-color:var(--lly-navy);overflow:hidden\">\n            <div class=\"lly-feature__head\">\n              <span class=\"lly-icon lly-icon--bcl2i\" aria-hidden=\"true\"><\u002Fspan>\n              <span style=\"flex:1 1 auto\">The option, and its citation<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"lly-feature__body\">\n              <ul class=\"lly-feature__list\" style=\"margin:0\">\n                <li>Three or four features, one per line<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.5\">Rendered as a pair or not at all. A single option panel reads as a recommendation, which the source does not make.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:22px 24px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-small);letter-spacing:.06em;text-transform:uppercase;color:#616161\">Algorithm node<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"padding:9px 14px;border-radius:var(--lly-radius-sm);border:1.5px solid var(--lly-forest);background:linear-gradient(90deg,#fff,rgba(20,75,45,.10));color:var(--lly-forest);font-family:var(--lly-font-bold);text-align:center;font-size:var(--lly-size-small)\">Entry pill, in the pathway colour<\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-start;gap:0;position:relative\">\n              <span style=\"position:absolute;left:13px;top:-8px;height:28px;border-left:1.4px dashed var(--lly-forest)\" aria-hidden=\"true\"><\u002Fspan>\n              <svg width=\"30\" height=\"14\" sc-camel-view-box=\"0 0 30 14\" aria-hidden=\"true\" style=\"flex:0 0 30px;margin-top:11px\"><defs><marker id=\"sysA\" sc-camel-view-box=\"0 0 8 8\" sc-camel-ref-x=\"4\" sc-camel-ref-y=\"4\" sc-camel-marker-width=\"5\" sc-camel-marker-height=\"5\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8 z\" fill=\"#144B2D\"><\u002Fpath><\u002Fmarker><\u002Fdefs><path d=\"M14 7 H22.5\" fill=\"none\" stroke=\"#144B2D\" stroke-width=\"1.4\" stroke-dasharray=\"3 2\" marker-end=\"url(#sysA)\"><\u002Fpath><\u002Fsvg>\n              <div class=\"lly-node lly-node--timelimited\" style=\"flex:1 1 auto;border-radius:var(--lly-radius)\">\n                <span class=\"lly-node__trigger\">A trigger, from the source<\u002Fspan>\n                <ul class=\"lly-node__options\" style=\"margin:6px 0 0\"><li>Its options, staged<\u002Fli><\u002Ful>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.5\">The dashed trunk stops at the last arrow, never past it. Nodes hold their position when they expand, so the branch does not reflow under the reader.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:22px 24px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-small);letter-spacing:.06em;text-transform:uppercase;color:#616161\">Key message<\u002Fp>\n          <div class=\"lly-card\" style=\"border-radius:var(--lly-radius);border:2px solid #E1251B;background:linear-gradient(140deg,#fff,rgba(225,37,27,.12));display:flex;align-items:flex-start;gap:16px\">\n            <span class=\"lly-icon lly-icon--frailty\" style=\"width:40px;height:40px;flex:0 0 40px\" aria-hidden=\"true\"><\u002Fspan>\n            <p style=\"margin:0\">\n              <span style=\"display:block;color:#E1251B;font-family:var(--lly-font-bold);font-weight:700;font-size:var(--lly-size-section);margin-bottom:3px\">The source's closing statement,<\u002Fspan>\n              <span style=\"display:block;font-size:var(--lly-size-small)\">split so its opening clause carries the emphasis and the rest reads as body copy.<\u002Fspan>\n            <\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.5\">One per asset, at the end, held back until the screen's content has been explored. Never paraphrased, never more than one.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:22px 24px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-small);letter-spacing:.06em;text-transform:uppercase;color:#616161\">Chrome<\u002Fp>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap\">\n            <div style=\"display:flex;gap:8px;align-items:center\">\n              <span style=\"display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid #E1251B;background:rgba(225,37,27,.14);color:#E1251B;font-family:var(--lly-font-bold);font-size:11px\">1<\u002Fspan>\n              <span style=\"display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid #E1251B;background:#E1251B;color:#fff;font-family:var(--lly-font-bold);font-size:11px\">2<\u002Fspan>\n              <span style=\"display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(33,33,33,.3);background:#fff;color:rgba(33,33,33,.45);font-family:var(--lly-font-bold);font-size:11px\">3<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1.5px solid #E1251B;border-radius:12px;color:#E1251B;font-family:var(--lly-font-bold);font-size:var(--lly-size-footnote)\">How to use this<\u002Fspan>\n            <span style=\"display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#E1251B;color:#fff\">\n              <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M4 1l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.5\">Numbered pips for reached screens, a walkthrough entry point, and one forward action. Pips for unreached screens are shown but inert, so progress is legible without being clickable.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:2px solid #212121;padding-bottom:10px\">\n        <h2 style=\"margin:0;font-family:var(--lly-font-bold);font-weight:700;font-size:26px\">8 · References and citations<\u002Fh2>\n        <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161\">Four layers, in this order. The trap is in the numbering.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:26px 30px;display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <span style=\"font-size:var(--lly-size-small)\">a statement<span style=\"display:inline-grid;place-items:center;min-width:26px;height:16px;padding:0 4px;margin-left:4px;border-radius:4px;background:#E1251B;color:#fff;font-size:10px;vertical-align:super\">1, 2<\u002Fspan><\u002Fspan>\n            <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.5\"><b>The chip.<\u002Fb> A brand-signal square on the statement it supports, sized to its label. Click, not hover.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <span style=\"align-self:flex-start;background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius-sm);padding:8px 11px;font-size:var(--lly-size-footnote);box-shadow:0 8px 20px rgba(33,33,33,.16);white-space:pre-line\">1. Author A, et al. Journal. 2025.<\u002Fspan>\n            <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.5\"><b>The tip.<\u002Fb> Opens on click, one line per citation, and clears on the learner's next interaction rather than on a timer.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <span style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border:1.5px solid #E1251B;border-radius:12px;color:#E1251B;font-family:var(--lly-font-bold);font-size:var(--lly-size-footnote)\">\n              <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M3 1.5h6.5L11 3.5v9H3z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><path d=\"M5 5h4M5 7.5h4M5 10h2.5\" stroke=\"currentColor\" stroke-width=\"1.2\"><\u002Fpath><\u002Fsvg>\n              References\n            <\u002Fspan>\n            <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.5\"><b>The list.<\u002Fb> One numbered list for the whole asset, on the final screen, in full Vancouver with DOIs, and printable.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <span style=\"align-self:flex-start;padding:9px 14px;border-radius:12px;background:#E1251B;color:#fff;font-family:var(--lly-font-bold);font-size:var(--lly-size-footnote)\">Open in a new tab<\u002Fspan>\n            <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.5\"><b>The handover.<\u002Fb> An interstitial shows the full URL and opens it only when pressed. Nothing auto-launches out of a validated asset.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border-top:1px solid rgba(33,33,33,.12);padding-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:24px\">\n          <div style=\"border-left:3px solid #E1251B;padding-left:16px\">\n            <p style=\"margin:0 0 6px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body);color:#E1251B\">The numbering trap<\u002Fp>\n            <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.55\">Source decks number references per slide, so the same paper can be reference one on one slide and reference three on another. Splitting one slide across several screens is safe. Merging content from two slides onto one screen silently corrupts every superscript on it. When an asset merges, the whole list is renumbered once, for the asset, and every chip is checked against it.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0 0 6px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">Abbreviations<\u002Fp>\n            <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.55\">The source's abbreviation list ships in full. On screen, each abbreviation is marked with a dotted brand-signal underline at its first appearance and reveals the expansion alone on hover, since the abbreviation itself is already being read. Marking every appearance turns the copy into a field of dotted lines.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:2px solid #212121;padding-bottom:10px\">\n        <h2 style=\"margin:0;font-family:var(--lly-font-bold);font-weight:700;font-size:26px\">9 · Contrast and compliance furniture<\u002Fh2>\n        <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161\">Measured pairings, and the two things every asset carries before it ships.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:20px\">\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:24px 26px;display:flex;flex-direction:column;gap:12px\">\n          <p style=\"margin:0 0 4px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">Approved pairings<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:1fr 76px 62px;gap:12px;align-items:center\">\n            <span style=\"padding:9px 12px;border-radius:8px;background:#fff;border:1px solid rgba(33,33,33,.14);color:#212121;font-size:var(--lly-size-small)\">Ink on white<\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#616161\">16.1:1<\u002Fspan>\n            <span style=\"font-family:var(--lly-font-bold);font-size:10px;letter-spacing:.06em;color:#144B2D\">AAA<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 76px 62px;gap:12px;align-items:center\">\n            <span style=\"padding:9px 12px;border-radius:8px;background:var(--lly-panel);color:#212121;font-size:var(--lly-size-small)\">Ink on framing panel<\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#616161\">14.3:1<\u002Fspan>\n            <span style=\"font-family:var(--lly-font-bold);font-size:10px;letter-spacing:.06em;color:#144B2D\">AAA<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 76px 62px;gap:12px;align-items:center\">\n            <span style=\"padding:9px 12px;border-radius:8px;background:var(--lly-navy);color:#fff;font-size:var(--lly-size-small)\">White on continuous navy<\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#616161\">10.7:1<\u002Fspan>\n            <span style=\"font-family:var(--lly-font-bold);font-size:10px;letter-spacing:.06em;color:#144B2D\">AAA<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 76px 62px;gap:12px;align-items:center\">\n            <span style=\"padding:9px 12px;border-radius:8px;background:var(--lly-forest);color:#fff;font-size:var(--lly-size-small)\">White on time-limited forest<\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#616161\">10.1:1<\u002Fspan>\n            <span style=\"font-family:var(--lly-font-bold);font-size:10px;letter-spacing:.06em;color:#144B2D\">AAA<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 76px 62px;gap:12px;align-items:center\">\n            <span style=\"padding:9px 12px;border-radius:8px;background:var(--lly-sky);color:#212121;font-size:var(--lly-size-small)\">Ink on comparison fill<\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#616161\">8.4:1<\u002Fspan>\n            <span style=\"font-family:var(--lly-font-bold);font-size:10px;letter-spacing:.06em;color:#144B2D\">AAA<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 76px 62px;gap:12px;align-items:center\">\n            <span style=\"padding:9px 12px;border-radius:8px;background:#fff;border:1px solid rgba(33,33,33,.14);color:#E1251B;font-size:var(--lly-size-small);font-family:var(--lly-font-bold)\">Brand signal on white<\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#616161\">4.7:1<\u002Fspan>\n            <span style=\"font-family:var(--lly-font-bold);font-size:10px;letter-spacing:.06em;color:#144B2D\">AA<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 76px 62px;gap:12px;align-items:center\">\n            <span style=\"padding:9px 12px;border-radius:8px;background:var(--lly-panel);color:#E1251B;font-size:var(--lly-size-small);font-family:var(--lly-font-bold)\">Brand signal on framing panel<\u002Fspan>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#616161\">4.2:1<\u002Fspan>\n            <span style=\"font-family:var(--lly-font-bold);font-size:10px;letter-spacing:.06em;color:#8D6708\">Large only<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:6px 0 0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.5\">Brand signal on the framing panel is a heading treatment, not a body one: bold at section size or larger. Brand-signal body copy sits on white.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:22px 24px\">\n            <p style=\"margin:0 0 8px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">Job code<\u002Fp>\n            <p style=\"margin:0 0 12px;font-size:var(--lly-size-small);line-height:1.55\">Every asset carries its job code at footnote size, in ink, bottom left of the final screen and in the print output. It is a slot in the system, not an afterthought: assets are built with the slot present and empty rather than added later.<\u002Fp>\n            <p style=\"margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#616161\">PP-XX-XX-0000 · Month Year<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1.5px dashed #E1251B;border-radius:var(--lly-radius);padding:22px 24px\">\n            <p style=\"margin:0 0 8px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body);color:#E1251B\">Placeholder marking<\u002Fp>\n            <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.55\">Interface copy that MLR has not yet cleared is marked in the build, so a reviewer can hover any line and see whether it came from the source. The convention is one attribute on the element carrying the words, and the review pass is: everything unmarked is verbatim, everything marked needs a decision.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:2px solid #212121;padding-bottom:10px\">\n        <h2 style=\"margin:0;font-family:var(--lly-font-bold);font-weight:700;font-size:26px\">10 · Imagery and iconography<\u002Fh2>\n        <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161\">Drawn from the client's earlier simulation. Pending confirmation against the file.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:22px 24px;display:flex;flex-direction:column;gap:12px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">White line-art on a red field<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\">People are drawn, not photographed: a single white hairline on a solid brand-signal panel, squared off, with a soft tonal sweep behind the figure. Faces are minimal, a few strokes at most, so a patient case does not read as one identifiable person.<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\">The panel is always brand signal, and the line is always white. No photography, no second illustration style, and no stock. Illustration is requested from the client and cleared with the copy.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:22px 24px;display:flex;flex-direction:column;gap:12px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">Clinical setting, held back<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\">Environments are recognisably clinical and deliberately quiet: consultation room, scan suite, ward corridor. Neutral, low-contrast, and always behind or beside the content rather than under it.<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\">Imagery is requested from the client and cleared with the copy. It is never generated, and never used to fill a screen that has too little to say.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:22px 24px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">Open outline icons<\u002Fp>\n          <div style=\"display:flex;gap:16px;align-items:center;color:#212121\">\n            <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M8 8h8M8 12h8M8 16h5\"><\u002Fpath><\u002Fsvg>\n            <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M16.5 16.5 21 21\"><\u002Fpath><\u002Fsvg>\n            <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 20V9M9 20V4M15 20v-8M21 20v-5\"><\u002Fpath><\u002Fsvg>\n            <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\">Single stroke weight, open forms, no fills, rounded joins, drawn on the same grid at one size and scaled. They sit in brand signal on white, or in white on brand signal, and nowhere else.<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-footnote);color:#616161;line-height:1.5\">Shown as the drawing rule, not as approved artwork. Where the source supplies an icon, the supplied one ships.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1.5px solid #212121;border-radius:var(--lly-radius);padding:22px 24px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"margin:0;font-family:var(--lly-font-bold);font-size:var(--lly-size-body)\">The border as a framing device<\u002Fp>\n          <div style=\"border:1.5px solid #E1251B;border-radius:var(--lly-radius);padding:14px 16px\">\n            <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.5\">A brand-signal outline marks a block as a distinct step in the journey rather than a card among cards.<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.6\">One border weight, one radius, brand signal only. Used on the blocks that carry the reader forward, so it means something; put on everything, it means nothing. Ink outlines stay the default for ordinary content.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n        <div style=\"background:var(--lly-panel);border-radius:var(--lly-radius);padding:20px 24px\">\n          <p style=\"margin:0 0 6px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body);color:#E1251B\">Content accent and navigation accent are not the same colour<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.55\">When the chrome and the content share one accent, the eye cannot tell a live control from an emphasised statement. The earlier simulation solves this with a deeper red on the navigation. The rule is the separation, not the hue: whichever pair is chosen, navigation sits a step darker than the content accent so the two never read as one system.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1.5px dashed #E1251B;border-radius:var(--lly-radius);padding:20px 24px\">\n          <p style=\"margin:0 0 6px;font-family:var(--lly-font-bold);font-size:var(--lly-size-body);color:#E1251B\">Settled: ink on the chrome<\u002Fp>\n          <p style=\"margin:0;font-size:var(--lly-size-small);line-height:1.55\">Navigation chrome takes ink and brand signal is reserved for content emphasis, which achieves the separation without adding a hue. The earlier asset's burgundy is available to define later if the client wants the visual tie, but it would be a colour this guideline introduces rather than one it inherited.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"
