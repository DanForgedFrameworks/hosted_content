<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TM9035 VISION — per-scene embeds (review gallery)</title>
<style>
  :root{ --teal:#0098be; --teal-strong:#007a98; --navy:#222f55; --line:#d7e3ee; --mist:#f3f8fc; }
  *{ box-sizing:border-box; } body{ margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--navy); background:var(--mist); }
  header{ padding:28px 32px 8px; } h1{ margin:0 0 4px; font-size:24px; } p.sub{ margin:0; color:#5a6b82; font-size:15px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; padding:20px 32px 40px; }
  a.card{ display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit; background:#fff; border:1.5px solid var(--line); border-left:5px solid var(--teal); border-radius:14px; padding:15px 18px; box-shadow:0 3px 10px rgba(34,47,85,.06); transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  a.card:hover{ transform:translateY(-2px); border-color:var(--teal); box-shadow:0 8px 20px rgba(0,152,190,.16); }
  .n{ flex:0 0 auto; width:42px; height:42px; border-radius:50%; background:var(--teal); color:#fff; display:grid; place-items:center; font-weight:700; font-size:17px; }
  .t{ font-weight:600; line-height:1.25; } .t small{ display:block; color:#5a6b82; font-weight:500; font-size:13px; }
</style></head><body>
<header><h1>TM9035 VISION — per-scene embeds</h1><p class="sub">Review gallery · each opens the standalone single-scene HTML full-size (deck chrome removed). Click any card.</p></header>
<div class="grid" id="grid"></div>
<script>
  var S=[["cover","Cover"],["howto","How to use"],["lo","Learning objectives"],["toc","Table of contents"],
    ["s1","S1 · NSCLC & the MET driver"],["s2","S2 · Introducing tepotinib"],["s3","S3 · The VISION trial"],
    ["s4","S4 · Long-term efficacy"],["s5","S5 · Long-term safety"],["s6","S6 · Consistency across subgroups"],
    ["s7","S7 · Summary & reflection"],["s8","S8 · Call to action"]];
  var g=document.getElementById('grid');
  S.forEach(function(x,i){ var a=document.createElement('a'); a.className='card'; a.href=x[0]+'/'; a.target='_blank'; a.rel='noopener';
    a.innerHTML='<span class="n">'+(i+1)+'</span><span class="t">'+x[1]+'<small>'+x[0]+'/</small></span>'; g.appendChild(a); });
</script>
</body></html>
