<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>References &amp; citations</title>
<style>
/* Bundled Poppins — self-contained, no external font CDN (embed-safe) */
@font-face { font-family:"Poppins"; src:url("assets/poppins-400.ttf") format("truetype"); font-weight:400; font-style:normal; font-display:swap; }
@font-face { font-family:"Poppins"; src:url("assets/poppins-600.ttf") format("truetype"); font-weight:600; font-style:normal; font-display:swap; }
@font-face { font-family:"Poppins"; src:url("assets/poppins-700.ttf") format("truetype"); font-weight:700; font-style:normal; font-display:swap; }
</style>
<style>
/* ============================================================
   TOUCH MEDICAL — CITATION PILL
   Self-contained. No external dependencies (safe for Visme embed).

   >>> BRAND SWAP HAPPENS HERE <<<
   Everything Touch-Medical-specific is a CSS variable below.
   When the brand assets arrive, change ONLY these values.
   ============================================================ */
:root{
  /* Brand colours (Touch Medical) */
  --tm-accent:        #0098be;   /* Touch Medical border/accent blue            */
  --tm-accent-strong: #007a98;   /* darker accent for hover/active              */
  --tm-on-accent:     #ffffff;   /* text/icon colour ON the accent              */

  /* Neutrals */
  --tm-ink:    #222f55;          /* Touch Medical navy — main text */
  --tm-muted:  #56608a;          /* secondary text       */
  --tm-faint:  #8a91b0;          /* tertiary / labels    */
  --tm-line:   #e3e8ee;          /* hairlines / borders  */
  --tm-panel:  #ffffff;          /* expanded panel bg    */
  --tm-tint:   #f4f7f9;          /* card / row tint      */
  --tm-backdrop: rgba(16,26,38,.55); /* dim behind panel */

  /* Typography (Touch Medical — Poppins, bundled in assets/) */
  --tm-font: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  /* Shape */
  --tm-radius:   14px;
  --tm-radius-sm: 9px;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; background:transparent; height:100%; }
body{
  font-family:var(--tm-font);
  color:var(--tm-ink);
  overflow:hidden;                 /* fixed-frame embed: no scroll on desktop */
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ---------- THE PILL (the tiny embeddable trigger) ---------- */
.tm-pill{
  position:fixed;            /* anchored to its embed frame */
  right:14px;
  bottom:14px;
  display:inline-flex;
  align-items:center;
  gap:.42em;
  font-family:var(--tm-font);
  font-size:13px;
  font-weight:600;
  line-height:1;
  color:var(--tm-on-accent);
  background:var(--tm-accent);
  border:0;
  padding:7px 13px 7px 10px;
  border-radius:999px;
  cursor:pointer;
  letter-spacing:.01em;
  box-shadow:0 1px 2px rgba(16,26,38,.18);
  transition:background .16s ease, transform .12s ease, box-shadow .16s ease;
  -webkit-tap-highlight-color:transparent;
}
.tm-pill:hover,
.tm-pill:focus-visible{
  background:var(--tm-accent-strong);
  box-shadow:0 3px 9px rgba(16,26,38,.22);
  outline:none;
}
.tm-pill:focus-visible{ outline:2px solid var(--tm-accent); outline-offset:2px; }
.tm-pill:active{ transform:translateY(1px); }
.tm-pill__glyph{
  width:16px;height:16px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:rgba(255,255,255,.22);
  font-size:11px;font-weight:700;font-style:italic;
}
.tm-pill__count{
  font-variant-numeric:tabular-nums;
  opacity:.85;
  font-weight:600;
}

/* ---------- THE OVERLAY (expanded citation panel) ---------- */
.tm-overlay{
  position:fixed; inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:var(--tm-backdrop);
  -webkit-backdrop-filter:blur(2px);
  backdrop-filter:blur(2px);
  padding:clamp(10px,2vw,26px);
  overflow:hidden;               /* fits the embed box: no scroll */
  z-index:2147483600;
}
.tm-overlay.is-open{ display:flex; }

.tm-panel{
  width:min(1280px,100%); max-height:100%;
  margin:auto;
  background:var(--tm-panel);
  border-radius:var(--tm-radius);
  box-shadow:0 24px 60px rgba(16,26,38,.32);
  overflow:hidden;
  display:flex; flex-direction:column;     /* height-first frame */
  animation:tm-rise .22s ease both;
}
@keyframes tm-rise{ from{ opacity:0; transform:translateY(10px) scale(.99);} to{opacity:1;transform:none;} }

.tm-panel__head{
  flex:0 0 auto;
  display:flex; align-items:flex-start; gap:16px;
  padding:14px 22px 12px;
  border-bottom:1px solid var(--tm-line);
}
.tm-panel__titles{ flex:1 1 auto; min-width:0; }
.tm-panel__eyebrow{
  font-size:10.5px; font-weight:700; letter-spacing:.10em; text-transform:uppercase;
  color:var(--tm-accent); margin:0 0 3px;
}
.tm-panel__title{ font-size:16px; font-weight:700; margin:0; color:var(--tm-ink); }
.tm-panel__sub{ font-size:12px; color:var(--tm-muted); margin:3px 0 0; }

.tm-close{
  flex:0 0 auto;
  width:36px;height:36px;
  border:1px solid var(--tm-line);
  background:#fff; color:var(--tm-muted);
  border-radius:9px; cursor:pointer;
  font-size:18px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.tm-close:hover,.tm-close:focus-visible{
  background:var(--tm-tint); color:var(--tm-ink); border-color:var(--tm-faint); outline:none;
}

.tm-panel__body{
  flex:1 1 auto; min-height:0; overflow:hidden;
  padding:14px 22px 16px;
}
.tm-stmts{
  display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
  align-content:start;
}

/* ---------- One statement card ---------- */
.tm-stmt{
  border:1px solid var(--tm-line); border-radius:12px;
  background:var(--tm-panel);
  padding:12px 13px;
  display:flex; flex-direction:column; gap:7px;
  min-height:0;
}
.tm-stmt__head{ display:flex; align-items:baseline; gap:8px; margin:0; }
.tm-stmt__num{
  flex:0 0 auto;
  font-size:11px; font-weight:700;
  color:var(--tm-accent);
  background:var(--tm-tint);
  border:1px solid var(--tm-line);
  border-radius:6px;
  padding:2px 7px;
  letter-spacing:.04em; white-space:nowrap;
}
.tm-stmt__text{ margin:0; font-size:13.5px; line-height:1.45; color:var(--tm-ink); }

.tm-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
.tm-chip{
  display:inline-flex; align-items:center; gap:4px;
  font-family:var(--tm-font); font-size:11px; font-weight:600;
  color:var(--tm-accent); background:var(--tm-tint);
  border:1px solid color-mix(in srgb,var(--tm-accent) 28%, var(--tm-line));
  border-radius:999px; padding:4px 9px; cursor:pointer;
  transition:background .15s ease, border-color .15s ease, color .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.tm-chip:hover,.tm-chip:focus-visible{
  background:var(--tm-accent); color:var(--tm-on-accent); border-color:var(--tm-accent); outline:none;
}

/* ---------- D16 external-link interstitial (Tiro launch behaviour, TM skin) ---------- */
.tm-inter{
  position:fixed; inset:0; z-index:2147483601;
  display:none; align-items:center; justify-content:center;
  padding:clamp(12px,4vw,40px);
  background:rgba(16,26,38,.68);
}
.tm-inter.is-open{ display:flex; }
.tm-inter__panel{
  width:min(460px,100%); max-height:calc(100% - 24px); overflow:auto;
  background:var(--tm-panel); border-radius:var(--tm-radius);
  box-shadow:0 24px 60px rgba(16,26,38,.4);
  padding:22px; animation:tm-rise .2s ease both;
}
.tm-inter__title{ font-size:16px; font-weight:700; margin:0 0 8px; color:var(--tm-ink); }
.tm-inter__p{ font-size:13px; line-height:1.5; color:var(--tm-muted); margin:0 0 10px; }
.tm-inter__p strong{ color:var(--tm-ink); font-weight:600; }
.tm-inter__domain{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px;
  color:var(--tm-ink); margin:0 0 8px; overflow-wrap:anywhere;
}
.tm-inter__url{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11.5px; line-height:1.45;
  color:var(--tm-muted); background:var(--tm-tint); border:1px solid var(--tm-line);
  border-radius:8px; padding:9px 11px; word-break:break-all;
}
.tm-inter__status{ margin-top:12px; display:flex; align-items:center; gap:9px; min-height:22px; font-size:12px; font-style:italic; color:var(--tm-muted); }
.tm-prep{ display:inline-flex; gap:5px; }
.tm-prep i{ width:8px; height:8px; border-radius:50%; background:var(--tm-accent); display:inline-block; animation:tm-prep-pulse 1s infinite ease-in-out; }
.tm-prep i:nth-child(2){ animation-delay:.15s; }
.tm-prep i:nth-child(3){ animation-delay:.3s; }
@keyframes tm-prep-pulse{ 0%,100%{ transform:scale(.6); opacity:.4; } 50%{ transform:scale(1); opacity:1; } }
.tm-inter__actions{ display:flex; flex-wrap:wrap; gap:9px; margin-top:16px; }
.tm-inter__btn{
  min-height:44px; padding:10px 18px;
  border:2px solid var(--tm-accent); border-radius:10px;
  background:var(--tm-accent); color:var(--tm-on-accent);
  font-family:var(--tm-font); font-weight:600; font-size:13px; cursor:pointer;
}
.tm-inter__btn.secondary{ background:var(--tm-panel); color:var(--tm-accent); }
.tm-inter__btn:disabled{ background:#c3c8d2; border-color:#c3c8d2; color:#fff; cursor:not-allowed; }
.tm-inter__btn:hover:not(:disabled){ filter:brightness(.96); }

/* ---------- Responsive columns ---------- */
@media (max-width:1024px){ .tm-stmts{ grid-template-columns:repeat(2,1fr); } }

/* ---------- Phone: drop the fixed-frame rule, allow scrolling ---------- */
@media (max-width:760px){
  html,body{ height:auto; }
  body{ overflow:auto; }
  .tm-overlay{ overflow:auto; align-items:flex-start; }
  .tm-panel{ max-height:none; }
  .tm-panel__body{ overflow:visible; }
  .tm-stmts{ grid-template-columns:1fr; }
}
@media (max-width:520px){
  .tm-panel__head{ padding:14px 16px 11px; }
  .tm-panel__body{ padding:12px 16px 16px; }
  .tm-stmt__text{ font-size:14px; }
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  .tm-pill,.tm-close,.tm-chip{ transition:none; }
  .tm-panel,.tm-inter__panel{ animation:none; }
  .tm-prep i{ animation:none; }
}
</style>
</head>
<body>

<!-- ============================================================
     THE EMBEDDABLE PILL
     This is all that shows until clicked/hovered.
     Edit the label text in .tm-pill__label freely
     (e.g. "References", "Sources", "Citations", or just "?").
     ============================================================ -->
<button class="tm-pill" id="tmPill" type="button"
        aria-haspopup="dialog" aria-expanded="false" aria-controls="tmOverlay">
  <span class="tm-pill__glyph" aria-hidden="true">i</span>
  <span class="tm-pill__label">References</span>
  <span class="tm-pill__count" id="tmCount" aria-hidden="true"></span>
</button>

<!-- THE EXPANDED PANEL (built from data below) -->
<div class="tm-overlay" id="tmOverlay" role="dialog" aria-modal="true"
     aria-labelledby="tmTitle" hidden>
  <div class="tm-panel" role="document">
    <header class="tm-panel__head">
      <div class="tm-panel__titles">
        <p class="tm-panel__eyebrow">Evidence &amp; sources</p>
        <h1 class="tm-panel__title" id="tmTitle">References &amp; citations</h1>
        <p class="tm-panel__sub">Supporting evidence for the statements in this module.</p>
      </div>
      <button class="tm-close" id="tmClose" type="button" aria-label="Close references">&times;</button>
    </header>
    <div class="tm-panel__body" id="tmBody"><!-- statements injected here --></div>
  </div>
</div>

<!-- D16 EXTERNAL-LINK INTERSTITIAL (Tiro launch behaviour, Touch Medical skin) -->
<div class="tm-inter" id="tmInter" role="dialog" aria-modal="true"
     aria-labelledby="tmInterTitle" aria-describedby="tmInterReason" hidden>
  <div class="tm-inter__panel" role="document">
    <h2 class="tm-inter__title" id="tmInterTitle">You are leaving this activity</h2>
    <p class="tm-inter__p" id="tmInterReason"></p>
    <p class="tm-inter__p"><strong>Source:</strong> <span id="tmInterDest"></span><br><strong>Organisation:</strong> <span id="tmInterOrg"></span></p>
    <p class="tm-inter__domain" id="tmInterDomain"></p>
    <p class="tm-inter__p">The source opens in a new tab. Check the address is expected before continuing.</p>
    <div class="tm-inter__url" id="tmInterUrl"></div>
    <div class="tm-inter__status" aria-live="polite"><span class="tm-prep" aria-hidden="true"><i></i><i></i><i></i></span><span id="tmInterStatus">Preparing the link&hellip;</span></div>
    <div class="tm-inter__actions">
      <button class="tm-inter__btn" id="tmInterOpen" type="button" disabled>Open source</button>
      <button class="tm-inter__btn secondary" id="tmInterCopy" type="button">Copy link</button>
      <button class="tm-inter__btn secondary" id="tmInterStay" type="button">Stay here</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONTENT  —  edit here only.
   Each statement: { text, cites:[ {label, url} | {label, pending:true} ] }
   - Give a citation a `url` to make it a clickable link.
   - Use `pending:true` while a URL/last-accessed date is still outstanding.
   ============================================================ */
const STATEMENTS = [
  {

    cites: [

        url: "https://doi.org/10.1016/j.jtho.2016.10.014" },
      { short: "Remon 2023", ref: "Remon J, et al. 2023 J Thorac Oncol 18(4):419–435. doi: 10.1016/j.jtho.2022.10.015",
        url: "https://doi.org/10.1016/j.jtho.2022.10.015" },
      { short: "Tong 2016", ref: "Tong JH, et al. 2016 Clin Cancer Res 22(12):3048–3056. doi: 10.1158/1078-0432.CCR-15-2061",

/* ============================================================
   ENGINE — no edits needed below.
   ============================================================ */
(function(){
  "use strict";
  const pill    = document.getElementById('tmPill');
  const overlay = document.getElementById('tmOverlay');
  const body    = document.getElementById('tmBody');
  const closeBtn= document.getElementById('tmClose');
  const countEl = document.getElementById('tmCount');

  // interstitial elements
  const inter    = document.getElementById('tmInter');
  const iDest    = document.getElementById('tmInterDest');
  const iOrg     = document.getElementById('tmInterOrg');
  const iDomain  = document.getElementById('tmInterDomain');
  const iUrl     = document.getElementById('tmInterUrl');
  const iReason  = document.getElementById('tmInterReason');
  const iStatus  = document.getElementById('tmInterStatus');
  const iDots    = inter.querySelector('.tm-prep');
  const iOpen    = document.getElementById('tmInterOpen');
  const iCopy    = document.getElementById('tmInterCopy');
  const iStay    = document.getElementById('tmInterStay');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // Friendly publisher name for the interstitial "Organisation" line, keyed on host.
  function orgFromHost(host){
    const map = {
      'doi.org':'Publisher (resolved via doi.org)',
      'www.novartis.com':'Novartis',
      'novartis.com':'Novartis',
      'www.emdserono.com':'EMD Serono',
      'emdserono.com':'EMD Serono',
      'accessdata.fda.gov':'U.S. Food & Drug Administration',
      'www.accessdata.fda.gov':'U.S. Food & Drug Administration',
      'www.ema.europa.eu':'European Medicines Agency',
      'ema.europa.eu':'European Medicines Agency',
      'www.esmo.org':'European Society for Medical Oncology',
      'esmo.org':'European Society for Medical Oncology',
      'www.merckgroup.com':'Merck KGaA'
    };
    return map[host] || host;
  }

  // ---- render statements ----
  // Each citation is a compact chip; full reference + URL + Open/Copy live in the launch dialog.
  function chipHTML(c){
    const label = c.short || c.ref;
    return '<button class="tm-chip" type="button" data-url="'+esc(c.url)+'" data-ref="'+esc(c.ref)+'" '+
           'aria-label="Open source: '+esc(c.ref)+'">'+esc(label)+' <span aria-hidden="true">↗</span></button>';
  }

  body.innerHTML = '<div class="tm-stmts">' + STATEMENTS.map((s,i)=>{
    const chips = s.cites.map(chipHTML).join('');
    return '<section class="tm-stmt">'+
      '<div class="tm-stmt__head">'+
        '<span class="tm-stmt__num">'+(i+1)+'</span>'+
        '<p class="tm-stmt__text">'+esc(s.text)+'</p>'+
      '</div>'+
      '<div class="tm-chips">'+chips+'</div>'+
    '</section>';
  }).join('') + '</div>';

  countEl.textContent = STATEMENTS.length;

  /* ---------- panel open / close ----------
     The panel simply expands to fill its embed frame. No browser fullscreen. */
  let lastFocus = null;

  function open(){
    lastFocus = document.activeElement;
    overlay.hidden = false;
    overlay.classList.add('is-open');
    pill.setAttribute('aria-expanded','true');
    setTimeout(()=> closeBtn.focus(), 30);
  }
  function close(){
    if(inter.classList.contains('is-open')) closeInter();
    overlay.classList.remove('is-open');
    overlay.hidden = true;
    pill.setAttribute('aria-expanded','false');
    if(lastFocus && lastFocus.focus){ try{ lastFocus.focus(); }catch(e){} }
  }

  /* ---------- D16 external-link interstitial (Tiro "Launch" preparing-delay) ---------- */
  let pendingURL = null, interTrigger = null, launchTimer = null;

  function openInter(url, ref, trigger){
    pendingURL = url;
    interTrigger = trigger;
    let host = url;
    try{ host = new URL(url).hostname; }catch(e){}
    iDest.textContent   = ref;
    iOrg.textContent    = orgFromHost(host);
    iDomain.textContent = host;
    iUrl.textContent    = url;
    iReason.textContent = 'This link opens an external source in a new tab.';
    if(iDots) iDots.style.display = '';
    iStatus.textContent = 'Preparing the link…';
    iOpen.disabled = true;
    inter.hidden = false;
    inter.classList.add('is-open');
    iStay.focus();                                   // focus held on "Stay here" while preparing
    if(launchTimer) clearTimeout(launchTimer);
    launchTimer = setTimeout(()=>{
      if(iDots) iDots.style.display = 'none';
      iStatus.textContent = 'Ready to open.';
      iOpen.disabled = false;
      iOpen.focus();                                 // focus moves to Open when ready
    }, reduceMotion ? 250 : 1300);
  }
  function closeInter(){
    if(launchTimer) clearTimeout(launchTimer);
    inter.classList.remove('is-open');
    inter.hidden = true;
    if(interTrigger && interTrigger.focus){ try{ interTrigger.focus(); }catch(e){} }
  }

  iOpen.addEventListener('click', ()=>{
    if(!pendingURL) return;
    window.open(pendingURL, '_blank', 'noopener,noreferrer');
    iStatus.textContent = 'Link opened in a new tab. Nothing opened? Copy the link and open it manually.';
  });
  iCopy.addEventListener('click', ()=>{
    if(!pendingURL) return;
    const ta = document.createElement('textarea');
    ta.value = pendingURL; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    let ok=false;
    try{ ok = document.execCommand('copy'); }catch(e){ ok=false; }
    document.body.removeChild(ta);
    iStatus.textContent = ok ? 'Link copied. Paste it into a fresh browser tab.'
                             : 'Copying is unavailable. Select and copy the visible URL manually.';
  });
  iStay.addEventListener('click', closeInter);
  inter.addEventListener('click', e =>{ if(e.target === inter) closeInter(); });

  // citation chips (event delegation) → launch interstitial
  body.addEventListener('click', e =>{
    const btn = e.target.closest('.tm-chip');
    if(!btn) return;
    openInter(btn.getAttribute('data-url'), btn.getAttribute('data-ref'), btn);
  });

  /* ---------- keyboard: interstitial takes precedence over the panel ---------- */
  function trap(e, container){
    const f = container.querySelectorAll('a[href],button:not([disabled])');
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
  document.addEventListener('keydown', e =>{
    if(inter.classList.contains('is-open')){
      if(e.key === 'Escape'){ e.preventDefault(); closeInter(); return; }
      if(e.key === 'Tab'){ trap(e, inter); }
      return;
    }
    if(overlay.classList.contains('is-open')){
      if(e.key === 'Escape'){ e.preventDefault(); close(); return; }
      if(e.key === 'Tab'){ trap(e, overlay); }
    }
  }, true);

  /* ---------- wiring ----------
     Click/tap only: fullscreen needs a genuine user gesture, which a hover
     timer can't reliably provide. */
  pill.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', e =>{ if(e.target === overlay) close(); });
})();
</script>
</body>
</html>
