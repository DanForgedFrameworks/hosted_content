<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Introduction to METex14 Skipping NSCLC and Tepotinib</title>
  <style>
    @font-face { font-family: "Poppins"; src: url("assets/poppins-400.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Poppins"; src: url("assets/poppins-600.ttf") format("truetype"); font-weight: 600; font-style: normal; font-display: swap; }
    @font-face { font-family: "Poppins"; src: url("assets/poppins-700.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: swap; }
    :root { --teal: #0098be; --navy: #222f55; --pale: #d9eff8; --mist: #f8f8f8; --pink: #e2abb5; --green: #90cbae; --good: #287d5c; --bad: #b64457; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f2f2f2; color: var(--navy); font-family: "Poppins", Arial, sans-serif; }
    .slide { width: min(100% - 40px, 1180px); margin: 20px auto; overflow: hidden; background: #fff; box-shadow: 0 7px 24px rgba(34,47,85,0.20); }
    .question-band { background: var(--pale); padding: clamp(14px, 2.2vw, 24px) clamp(14px, 3vw, 28px) 14px; display: flex; justify-content: center; }
    .question { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; align-items: center; width: min(100%, 760px); padding: 9px 17px; border: 3px solid var(--teal); border-radius: 18px; background: rgba(255,255,255,0.22); color: var(--teal); }
    .question-icon { width: 54px; height: 54px; display: grid; place-items: center; border: 3px solid var(--teal); border-radius: 50%; font-size: 2.2rem; font-weight: 600; line-height: 1; }
    .question p { margin: 0; font-size: clamp(1rem, 2.1vw, 1.45rem); line-height: 1.25; font-weight: 700; text-align: center; }
    .answers-wrap { display: flex; align-items: center; padding: clamp(34px, 5vw, 58px) clamp(16px, 2.5vw, 28px) clamp(38px, 5vw, 58px); background: var(--pale); }
    .answers { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(12px, 2vw, 22px); }
    .answer { min-height: clamp(130px, 18vw, 180px); border: 0; border-radius: 18px; background: var(--pink); color: #080808; font: inherit; font-size: clamp(1.25rem, 2.8vw, 1.9rem); font-weight: 700; cursor: pointer; box-shadow: 0 8px 18px rgba(34,47,85,0.12); transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease; }
    .answer:hover:not(:disabled) { transform: translateY(-6px); box-shadow: 0 14px 23px rgba(34,47,85,0.20); }
    .answer:active:not(:disabled) { transform: translateY(1px) scale(0.985); }
    .answer:focus-visible { outline: 4px solid var(--navy); outline-offset: 4px; }
    .answer.is-selected { outline: 4px solid var(--navy); outline-offset: -8px; }
    .answer.is-correct { background: var(--green); animation: celebrate 620ms cubic-bezier(.22, 1.35, .36, 1) both; }
    .answer.is-incorrect { background: var(--pink); animation: shake 570ms ease both; }
    .answer:disabled { cursor: default; }
    .completion { display: none; padding: clamp(22px, 3vw, 32px) clamp(18px, 4vw, 90px); background: #fff; }
    .completion.visible { display: grid; place-items: center; }
    .feedback { width: min(100%, 900px); border: 3px solid var(--teal); border-radius: 18px; padding: 10px 22px; text-align: center; opacity: 0; transform: translateY(10px); transition: opacity 350ms ease, transform 350ms ease; }
    .feedback.visible { opacity: 1; transform: translateY(0); }
    .feedback-title { margin: 0 0 4px; color: var(--navy); font-size: 1.08rem; font-weight: 700; }
    .feedback p { margin: 0; color: #151515; font-size: clamp(.9rem, 1.6vw, 1.05rem); line-height: 1.38; }
    .citation-control { position: relative; display: inline-flex; align-items: baseline; }
    .citation-trigger { padding: 0 2px; border: 0; border-bottom: 1px dashed var(--teal); background: transparent; color: var(--teal); font: inherit; font-size: .78em; font-weight: 700; cursor: pointer; }
    .citation-trigger:focus-visible, .reference-link:focus-visible, .external-actions button:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
    .citation-panel { position: absolute; z-index: 5; right: 0; bottom: calc(100% + 10px); width: min(720px, calc(100vw - 36px)); max-height: min(360px, 55vh); overflow: auto; padding: 15px 18px; border: 2px solid var(--teal); border-radius: 14px; background: #fff; box-shadow: 0 14px 28px rgba(34,47,85,.22); text-align: left; opacity: 0; transform: translateY(6px); visibility: hidden; transition: opacity 180ms ease, transform 180ms ease, visibility 180ms ease; }
    .citation-control:hover .citation-panel, .citation-control:focus-within .citation-panel, .citation-control.open .citation-panel { opacity: 1; transform: translateY(0); visibility: visible; }
    .citation-panel h2 { margin: 0 0 8px; color: var(--navy); font-size: .95rem; }
    .citation-list { margin: 0; padding-left: 20px; color: #151515; font-size: .78rem; line-height: 1.45; }
    .citation-list li + li { margin-top: 8px; }
    .reference-link { border: 0; padding: 0; background: transparent; color: var(--teal); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
    .external-dialog { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(34,47,85,.70); }
    .external-dialog.visible { display: flex; }
    .external-dialog-card { width: min(440px, 100%); padding: 24px; border-radius: 16px; background: #fff; box-shadow: 0 20px 44px rgba(0,0,0,.22); }
    .external-dialog-card h2 { margin: 0 0 10px; color: var(--navy); font-size: 1.2rem; }
    .external-dialog-card p { margin: 0; color: #151515; line-height: 1.5; }
    .external-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .external-actions button { min-height: 44px; border-radius: 10px; padding: 9px 15px; font: inherit; font-weight: 700; cursor: pointer; }
    .stay-button { border: 1px solid var(--teal); background: #fff; color: var(--teal); }
    .open-button { border: 1px solid var(--teal); background: var(--teal); color: #fff; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes celebrate { 0% { transform: scale(1); } 45% { transform: scale(1.075) translateY(-8px); box-shadow: 0 18px 30px rgba(40,125,92,.34); } 100% { transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
    @media (max-width: 680px) {
      .slide { width: 100%; margin: 0; box-shadow: none; }
      .question { grid-template-columns: 42px minmax(0, 1fr); border-radius: 15px; padding: 9px 12px; }
      .question-icon { width: 42px; height: 42px; font-size: 1.7rem; }
      .answers-wrap { padding: 18px 16px; }
      .answers { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .answer { min-height: 118px; font-size: 1.38rem; }
      .completion { padding: 20px 16px; }
      .feedback { padding: 14px; }
      .citation-panel { position: fixed; right: 18px; bottom: 18px; width: calc(100vw - 36px); max-height: 58vh; }
      .external-actions { flex-direction: column-reverse; }
      .external-actions button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="slide" aria-label="MET exon 14 skipping knowledge check">
    <section class="question-band" aria-labelledby="question-text">
      <div class="question"><span class="question-icon" aria-hidden="true">?</span><p id="question-text">What proportion of patients with NSCLC have <em>MET</em>ex14 skipping mutations?</p></div>
    </section>
    <section class="answers-wrap" aria-label="Answer options">
      <div class="answers" role="group" aria-describedby="selection-status">
        <button class="answer" type="button" data-correct="false">&lt;1%</button>
        <button class="answer" type="button" data-correct="true">2-4%</button>
        <button class="answer" type="button" data-correct="false">5-10%</button>
        <button class="answer" type="button" data-correct="false">15%</button>
      </div>
    </section>
    <section class="completion" id="completion" aria-live="polite" aria-atomic="true">
      <div class="feedback" id="feedback">
        <p class="feedback-title" id="feedback-title"></p>
        <p id="feedback-copy"></p>
      </div>
      <p class="sr-only" id="selection-status"></p>
    </section>
  </main>
  <div class="external-dialog" id="external-dialog" aria-hidden="true">
    <div class="external-dialog-card" role="dialog" aria-modal="true" aria-labelledby="external-title">
      <h2 id="external-title">Open reference?</h2>
      <p>This will open the publication's DOI landing page in a new tab.</p>
      <div class="external-actions"><button class="stay-button" id="stay-button" type="button">Stay in this activity</button><button class="open-button" id="open-button" type="button">Open reference</button></div>
    </div>
  </div>
  <script>
    (function () {
      const answers = Array.from(document.querySelectorAll('.answer'));
      const feedback = document.getElementById('feedback');
      const feedbackTitle = document.getElementById('feedback-title');
      const feedbackCopy = document.getElementById('feedback-copy');
      const status = document.getElementById('selection-status');
      const completion = document.getElementById('completion');
      const externalDialog = document.getElementById('external-dialog');
      const stayButton = document.getElementById('stay-button');
      const openButton = document.getElementById('open-button');
      let pendingUrl = '';
      let lastCitationFocus = null;
      let complete = false;

      function completeQuiz(button) {
        if (complete) return;
        complete = true;
        const correct = button.dataset.correct === 'true';
        answers.forEach(answer => { answer.disabled = true; answer.setAttribute('aria-disabled', 'true'); });
        button.classList.add('is-selected', correct ? 'is-correct' : 'is-incorrect');
        if (correct) {
          feedbackTitle.textContent = 'Correct';
          feedbackCopy.innerHTML = '2-4% patients with NSCLC have <em>MET</em>ex14 skipping, which sensitizes tumors to targeted therapy with a MET TKI and is an independent prognostic factor of poor survival.' + citationMarkup();
          status.textContent = 'Correct. The completion feedback is now available.';
        } else {
          feedbackTitle.textContent = 'Not quite';
          feedbackCopy.innerHTML = 'The correct answer is <strong>2-4%</strong>. 2-4% patients with NSCLC have <em>MET</em>ex14 skipping, which sensitizes tumors to targeted therapy with a MET TKI and is an independent prognostic factor of poor survival.' + citationMarkup();
          status.textContent = 'Not quite. The completion feedback identifies the correct answer.';
        }
        completion.classList.add('visible');
        window.setTimeout(() => feedback.classList.add('visible'), window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 520);
      }

      function citationMarkup() {
        return `<span class="citation-control"><button class="citation-trigger" type="button" aria-expanded="false" aria-controls="citation-panel">5-8</button><span class="citation-panel" id="citation-panel" role="region" aria-label="References 5 to 8"><h2>References 5-8</h2><ol class="citation-list" start="5"><li>Paik PK, Drilon A, Fan PD, Yu H, Rekhtman N, Ginsberg MS, et al. Response to MET inhibitors in patients with stage IV lung adenocarcinomas harboring MET mutations causing exon 14 skipping. <em>Cancer Discovery</em>. 2015;5(8):842-9. <button class="reference-link" type="button" data-url="https://doi.org/10.1158/2159-8290.cd-14-1467">View source</button></li><li>Reungwetwattana T, Liang Y, Zhu V, Ou SI. The race to target MET exon 14 skipping alterations in non-small cell lung cancer: The Why, the How, the Who, the Unknown, and the Inevitable. <em>Lung Cancer</em>. 2017;103:27-37. <button class="reference-link" type="button" data-url="https://doi.org/10.1016/j.lungcan.2016.11.011">View source</button></li><li>Rosell R, Karachaliou N. Large-scale screening for somatic mutations in lung cancer. <em>Lancet</em>. 2016;387(10026):1354-6. <button class="reference-link" type="button" data-url="https://doi.org/10.1016/S0140-6736(15)01125-3">View source</button></li><li>Salgia R, Stuttler M, Scheele J, Stroh C, Felip E. The promise of selective MET inhibitors in non-small cell lung cancer with MET exon 14 skipping. <em>Cancer Treatment Reviews</em>. 2020;87:102022. <button class="reference-link" type="button" data-url="https://doi.org/10.1016/j.ctrv.2020.102022">View source</button></li></ol></span></span>`;
      }

      feedback.addEventListener('click', event => {
        const trigger = event.target.closest('.citation-trigger');
        if (trigger) {
          const control = trigger.closest('.citation-control');
          const open = control.classList.toggle('open');
          trigger.setAttribute('aria-expanded', String(open));
          return;
        }
        const link = event.target.closest('.reference-link');
        if (link) {
          pendingUrl = link.dataset.url;
          lastCitationFocus = link;
          externalDialog.classList.add('visible');
          externalDialog.setAttribute('aria-hidden', 'false');
          stayButton.focus();
        }
      });

      function closeExternalDialog() {
        externalDialog.classList.remove('visible');
        externalDialog.setAttribute('aria-hidden', 'true');
        if (lastCitationFocus) lastCitationFocus.focus();
      }
      stayButton.addEventListener('click', closeExternalDialog);
      openButton.addEventListener('click', () => { if (pendingUrl) window.open(pendingUrl, '_blank', 'noopener'); closeExternalDialog(); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape') { if (externalDialog.classList.contains('visible')) closeExternalDialog(); const control = document.querySelector('.citation-control.open'); if (control) { control.classList.remove('open'); const trigger = control.querySelector('.citation-trigger'); if (trigger) trigger.setAttribute('aria-expanded', 'false'); } } });

      answers.forEach(answer => {
        answer.addEventListener('click', () => completeQuiz(answer));
        answer.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); completeQuiz(answer); }
        });
      });
    }());
  </script>
</body>
</html>
