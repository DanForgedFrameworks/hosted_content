(function(){

  const ICON = {

    [CAT3]:'<svg class="dy dy-board" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/><path class="bl" style="--d:0" stroke-width="1.7" d="M7 7.2h6"/><path class="bl" style="--d:1" stroke-width="1.7" d="M7 10.8h10"/></svg>'
  };
  const OPEN_ICON = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// R4: gene stem italic at render time only (contract §10); data, search and copy stay plain.
// "MET biology" is left roman - an ambiguous form that needs a per-case ruling.
function italGene(s){ return String(s).replace(/\bMET(?=ex14)/g, '<em>MET</em>'); }
  // Italicise the journal token inside the (already-escaped) citation, per house style.
  function citeHTML(r,useShort){

    if(useShort && r.short){
      let t=esc(r.short);
      if(r.journal){ const jj=esc(r.journal); t=t.replace(jj,'<em>'+jj+'</em>'); }
      return t;
    }
 let s=esc(r.cite); if(r.journal){ const j=esc(r.journal); s=s.replace(j,'<em>'+j+'</em>'); } return s; }

  let viewMode = 'grouped';   // 'grouped' | 'numbered'
  let inCat = null;

  /* ---------- clipboard ---------- */
  function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); return ok; }
  function copyText(t){ if(navigator.clipboard && navigator.clipboard.writeText){ return navigator.clipboard.writeText(t).then(()=>true).catch(()=>fallbackCopy(t)); } return Promise.resolve(fallbackCopy(t)); }

  /* ---------- render helpers ---------- */

  function refRange(ns){
    const s=[...ns].sort((a,b)=>a-b), out=[]; let i=0;

    const rows=REFERENCES.map(function(r){ return '<li><span class="rn">'+r.n+'.</span><span class="rc">'+citeHTML(r)+'</span></li>'; }).join('');

      +'body{font-family:Georgia,"Times New Roman",serif;color:#111;max-width:760px;margin:26px auto;padding:0 22px;line-height:1.5;}'

      +'.rn{font-weight:700;min-width:26px;text-align:right;color:#222f55;}em{font-style:italic;}'
      +'@media print{body{margin:0;}}'

      +'<scr'+'ipt>window.onload=function(){setTimeout(function(){try{window.print();}catch(e){}},300);};</scr'+'ipt>'
      +'</body></html>';
