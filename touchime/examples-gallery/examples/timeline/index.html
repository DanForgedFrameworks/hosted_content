<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example: ordered timeline</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2d3d;--muted:#5b6b78;--paper:#fff;--surface:#f6f8fa;--line:#dde3e8;--accent:#1f6f8b;--accent-hover:#185a71;--accent-soft:#e6f2f6;--on-accent:#fff;--ok:#1f7a4d;--ok-soft:#e5f4ec;--bad:#b3261e;--bad-soft:#fbeae8;--warn:#9a5a00;--warn-soft:#fbf0dd;--radius:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;font-size:1.0625rem;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:1.75rem;line-height:1.2;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 22px;max-width:62ch}
.progress{display:flex;align-items:center;gap:12px;margin:0 0 18px;color:var(--muted);font-size:.95rem}
.bar{flex:1;max-width:260px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s ease}
.spine{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 22px;padding:0;list-style:none}
.spine::before{content:"";position:absolute;left:10%;right:10%;top:22px;height:4px;background:var(--line);border-radius:4px}
.spine li{position:relative;text-align:center}
.st{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;min-height:44px;cursor:pointer;padding:0 2px;font-size:.9rem;line-height:1.3;color:var(--ink)}
.st .dot{position:relative;z-index:1;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--paper);border:3px solid var(--line);font-weight:700;color:var(--muted);transition:background .25s,border-color .25s,color .25s}
.st.seen .dot{border-color:var(--accent);color:var(--accent)}
.st.current .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.st[aria-disabled="true"]{cursor:not-allowed;color:var(--muted)}
.st:focus-visible,.btn:focus-visible,.panel:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:var(--radius)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px;min-height:200px}
.panel .eyebrow{margin:0 0 4px;color:var(--accent);font-weight:700;font-size:.9rem}
.panel h2{margin:0 0 12px;font-size:1.4rem;line-height:1.25}
.keycard{margin:0;padding:16px 18px;background:var(--accent-soft);border-left:5px solid var(--accent);border-radius:var(--radius)}
.panel.enter{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.btn{min-height:44px;min-width:44px;padding:10px 20px;border-radius:var(--radius);border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;cursor:pointer}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:var(--paper);color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.count{color:var(--muted);font-size:.95rem}
.done{margin-top:18px;padding:16px 18px;background:var(--ok-soft);border:1px solid var(--ok);border-radius:var(--radius);color:#14452c}
.done[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
 .wrap{padding:20px 14px 40px}
 .spine{grid-template-columns:1fr;gap:4px}
 .spine::before{left:21px;right:auto;top:22px;bottom:22px;width:4px;height:auto}
 .st{flex-direction:row;text-align:left;gap:14px}
 .panel{padding:18px}
}
@media (prefers-reduced-motion:reduce){.panel.enter{animation:none}.bar i,.st .dot{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1>A testing pathway, step by step</h1>
  <p class="lead">Work through the five steps in order. Each step unlocks the next, and you can go back to any step you have already opened.</p>
  <div class="progress"><span id="ptext">Step 1 of 5</span><span class="bar" aria-hidden="true"><i id="pbar"></i></span></div>
  <ol class="spine" id="spine"></ol>
  <section class="panel" id="panel" tabindex="-1" aria-live="off"></section>
  <nav class="nav" aria-label="Move between steps">
    <button class="btn ghost" id="prev" type="button">Previous</button>
    <span class="count" id="count"></span>
    <button class="btn" id="next" type="button">Next</button>
  </nav>
  <p class="done" id="done" hidden>You have reached the end of the pathway. Select any step above to read it again.</p>
  <p class="sr" id="sr" aria-live="polite"></p>
</main>
<script>
"use strict";
var STEPS=[
 {short:"Who to test?",title:"Step 1: Who to test?",text:"Every patient with advanced nonsquamous lung cancer should have EGFR testing at diagnosis, as part of broad biomarker testing."},
 {short:"Which test?",title:"Step 2: Which test?",text:"Tissue is the standard sample. It confirms the type of lung cancer, can be used to test for other markers and shows changes such as transformation to small cell."},
 {short:"What does the result mean?",title:"Step 3: What does the result mean?",text:"Exon 19 deletions and the exon 21 L858R point mutation are the common EGFR mutations, and together make up most EGFR mutations. Both respond to EGFR-targeted treatment."},
 {short:"Blood and tissue disagree?",title:"Step 4: What if blood and tissue results disagree?",text:"Before acting, check how reliable each sample is. If the results still do not fit, discuss them at the multidisciplinary team meeting or molecular tumor board."},
 {short:"Progression",title:"Step 5: Progression",text:"When the disease progresses, retest to find the cause of resistance, because it shapes the next treatment choice."}
];
var cur=0,reached=0;
var spine=document.getElementById('spine'),panel=document.getElementById('panel');
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
STEPS.forEach(function(s,i){
 var li=document.createElement('li');
 var b=document.createElement('button');b.type='button';b.className='st';b.dataset.i=i;
 b.innerHTML='<span class="dot" aria-hidden="true">'+(i+1)+'</span><span>'+s.short+'</span>';
 b.addEventListener('click',function(){go(i,true)});
 li.appendChild(b);spine.appendChild(li);
});
function go(i,focus){
 if(i>reached)return;
 cur=i;
 var s=STEPS[i];
 panel.className='panel'+(reduce?'':' enter');
 void panel.offsetWidth;
 panel.innerHTML='<p class="eyebrow">Step '+(i+1)+' of 5</p><h2></h2><p class="keycard"></p>';
 panel.querySelector('h2').textContent=s.title;
 panel.querySelector('.keycard').textContent=s.text;
 panel.setAttribute('aria-label',s.title);
 render();
 document.getElementById('sr').textContent=s.title;
 if(focus)panel.focus({preventScroll:true});
}
function render(){
 [].forEach.call(spine.querySelectorAll('.st'),function(b,i){
  b.classList.toggle('current',i===cur);
  b.classList.toggle('seen',i<=reached&&i!==cur);
  b.setAttribute('aria-disabled',i>reached?'true':'false');
  if(i===cur)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');
  b.title=i>reached?'Locked until the previous step is opened':'';
 });
 document.getElementById('ptext').textContent='Step '+(cur+1)+' of 5';
 document.getElementById('pbar').style.width=((reached+1)/5*100)+'%';
 document.getElementById('count').textContent=(cur+1)+' / 5';
 document.getElementById('prev').disabled=cur===0;
 var n=document.getElementById('next');n.disabled=cur===4;
 document.getElementById('done').hidden=!(reached===4&&cur===4);
}
document.getElementById('prev').addEventListener('click',function(){go(cur-1,true)});
document.getElementById('next').addEventListener('click',function(){
 if(cur<4){reached=Math.max(reached,cur+1);go(cur+1,true)}
});
go(0,false);
</script>
</body>
</html>
