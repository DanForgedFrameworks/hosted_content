<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myth or fact</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2d3d; --muted:#5b6b78; --paper:#ffffff; --surface:#f6f8fa; --line:#dde3e8;
  --accent:#1f6f8b; --accent-hover:#185a71; --accent-soft:#e6f2f6; --on-accent:#ffffff;
  --ok:#1f7a4d; --ok-soft:#e5f4ec; --bad:#b3261e; --bad-soft:#fbeae8; --warn:#9a5a00; --warn-soft:#fbf0dd;
  --radius:10px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--surface);line-height:1.5;font-size:18px}
.wrap{max-width:1100px;margin:0 auto;padding:32px 20px 48px}
.eyebrow{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;margin:0 0 8px}
h1{font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.2;margin:0 0 12px}
.lead{color:var(--muted);max-width:780px;margin:0 0 24px}
.dots{display:flex;gap:8px;margin:0 0 20px}
.dots span{position:relative;overflow:hidden;width:28px;height:6px;border-radius:3px;background:var(--line);transition:transform .4s cubic-bezier(.2,1.4,.4,1)}
.dots span::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.3,1)}
.dots span.on::after{transform:none}
.dots span.cur{transform:scaleY(1.6)}
.pair{display:grid;grid-template-columns:1fr 64px 1fr;gap:12px;align-items:stretch;margin-bottom:24px}
.pair .myth{animation:rise .5s cubic-bezier(.2,.8,.3,1) both}
.pair .vs{animation:fadeIn .4s ease .2s both}
.pair .fact{animation:rise .5s cubic-bezier(.2,.8,.3,1) .12s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.col{display:flex;flex-direction:column;border-radius:var(--radius);padding:20px;border:2px solid var(--line);background:var(--paper)}
.myth{background:var(--bad-soft);border-color:#e7b8b4}
.fact{position:relative;overflow:hidden;cursor:pointer;font:inherit;color:var(--ink);text-align:left;width:100%;border:2px dashed var(--accent);background:var(--accent-soft);transition:background .4s,border-color .4s,box-shadow .4s}
.fact:hover{box-shadow:0 6px 18px rgba(31,45,61,.15)}
.fact:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.fact.shown{cursor:default;border:2px solid var(--ok);background:var(--ok-soft);animation:settle .6s cubic-bezier(.2,1.3,.4,1)}
.fact::after{content:"";position:absolute;left:0;top:0;bottom:0;width:60%;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 100%);transform:translateX(-120%);opacity:0}
.fact.shown::after{animation:sweep .9s ease-out .05s both}
@keyframes sweep{0%{transform:translateX(-120%);opacity:1}100%{transform:translateX(220%);opacity:1}}
@keyframes settle{0%{transform:scale(.985)}55%{transform:scale(1.02)}100%{transform:scale(1)}}
.fact.shown:hover{box-shadow:none}
.tag{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:#fff;border-radius:8px;padding:6px 12px;margin-bottom:12px;background:var(--bad)}
.fact .tag{background:var(--accent)} .fact.shown .tag{background:var(--ok)}
.txt{margin:0;font-size:1.15rem}
.fact .txt{filter:blur(10px);opacity:.25;transform:scale(.97);transition:filter .6s ease .1s,opacity .6s ease .1s,transform .6s cubic-bezier(.2,1.3,.4,1) .1s;user-select:none}
.fact.shown .txt{filter:none;opacity:1;transform:none;user-select:text}
.vs{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem;color:var(--muted)}
.insight{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:var(--radius);padding:18px 22px;margin:0 0 24px;max-width:900px;animation:slideIn .5s cubic-bezier(.2,.8,.3,1) .25s both}
.insight strong{display:block;color:var(--accent-hover);text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;margin-bottom:6px}
.insight p{margin:0}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--radius);min-height:48px;min-width:44px;padding:12px 28px;cursor:pointer}
.btn:hover{background:var(--accent-hover)}
.btn.ghost{background:var(--paper);color:var(--accent);border:2px solid var(--accent)}
.sum{animation:rise .5s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0) * 110ms + 150ms);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin:0 0 12px;max-width:900px}
.sum p{margin:0 0 6px} .sum b{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.sum .m b{color:var(--bad)} .sum .f b{color:var(--ok)}
#end-title.pop{animation:titlePop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes titlePop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.spark{position:absolute;pointer-events:none;color:#e8a33d;font-size:1.4rem;line-height:1;animation:spark .9s ease-out both}
@keyframes spark{0%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1;transform:scale(1.2) rotate(40deg)}100%{opacity:0;transform:scale(.6) rotate(90deg) translateY(-14px)}}
[hidden]{display:none!important}
@media (max-width:760px){
  body{font-size:17px}
  .wrap{padding:20px 14px 36px}
  .pair{grid-template-columns:1fr;gap:8px}
  .vs{height:36px}
  .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main class="wrap">
<section id="play">
  <div class="dots" id="dots" aria-hidden="true"></div>
  <p class="eyebrow" id="eyebrow"></p>
  <h1>Myth or fact</h1>
  <p class="lead">Read the myth. Then select the box on the right to reveal the fact.</p>
  <div class="pair" id="pair"></div>
  <div class="insight" id="insight" role="status" hidden></div>
  <button class="btn" id="next" hidden></button>
</section>

<section id="end" hidden>
  <p class="eyebrow">Finished</p>
  <h1 id="end-title" tabindex="-1">All three myths checked</h1>
  <p class="lead">Here is each myth with the fact that replaces it.</p>
  <div id="sums"></div>
  <button class="btn ghost" id="again">Start again</button>
</section>
</main>

<script>
const ITEMS = [
  { myth:"Squamous features on a small biopsy mean there is no targetable change.",
    fact:"Squamous features on a small biopsy do not rule out a targetable change, especially in someone who has never smoked.",
    insight:"Starting immunotherapy first risks severe side effects if an EGFR mutation is found later." },
  { myth:"A high PD-L1 level means immunotherapy alone is the right first-line choice in EGFR-mutant disease.",
    fact:"High PD-L1 does not predict a response to immunotherapy in EGFR-mutant disease.",
    insight:"In a phase II trial, immunotherapy alone was stopped early for lack of benefit, even with high PD-L1." },
  { myth:"A negative tissue result means the tumor is not EGFR-mutant.",
    fact:"A positive ctDNA result for an EGFR mutation can guide treatment, and a tissue sample with 10% tumor cells can miss a mutation.",
    insight:"Before acting, check how reliable each sample is. If the results still do not fit, discuss them at the multidisciplinary team meeting." }
];
const $ = id => document.getElementById(id);
const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const PAL = ["#1f6f8b","#1f7a4d","#e8a33d"];
function confetti(x,y,n){
  if(RM) return;
  const cv=document.createElement("canvas"); cv.setAttribute("aria-hidden","true");
  cv.style.cssText="position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50";
  cv.width=innerWidth; cv.height=innerHeight; document.body.appendChild(cv);
  const g=cv.getContext("2d"), t0=performance.now();
  const ps=Array.from({length:n||36},()=>{const a=Math.random()*Math.PI*2,v=3+Math.random()*6;return{x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,w:5+Math.random()*5,h:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:PAL[Math.floor(Math.random()*3)]};});
  (function f(t){const k=t-t0; g.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.globalAlpha=Math.max(0,1-k/1100);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore();});
    if(k<1100) requestAnimationFrame(f); else cv.remove();})(t0);
}
function countUp(el,to,done){
  if(RM||to===0){ el.textContent=to; if(done) done(); return; }
  const t0=performance.now(), D=700;
  (function f(t){const k=Math.min((t-t0)/D,1); el.textContent=Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(f); else if(done) done();})(t0);
}

let i = 0, revealed = false;

function render(){
  const it = ITEMS[i]; revealed = false;
  $("eyebrow").textContent = "Statement " + (i+1) + " of " + ITEMS.length;
  const dd = $("dots"); if(dd.children.length !== ITEMS.length) dd.innerHTML = ITEMS.map(()=>'<span></span>').join("");
  const setDots = ()=>[...dd.children].forEach((d,k)=>{ d.classList.toggle("on", k<=i); d.classList.toggle("cur", k===i); });
  if(RM) setDots(); else setTimeout(setDots, 100);
  const pair = $("pair"); pair.innerHTML = "";

  const m = document.createElement("div"); m.className = "col myth";
  const mt = document.createElement("span"); mt.className = "tag"; mt.textContent = "Myth";
  const mp = document.createElement("p"); mp.className = "txt"; mp.textContent = it.myth;
  m.append(mt, mp);

  const vs = document.createElement("div"); vs.className = "vs"; vs.setAttribute("aria-hidden","true"); vs.textContent = "vs";

  const f = document.createElement("button"); f.type = "button"; f.className = "col fact"; f.id = "fact";
  f.setAttribute("aria-expanded","false");
  const ft = document.createElement("span"); ft.className = "tag"; ft.id = "fact-tag"; ft.textContent = "Select to reveal the fact";
  const fp = document.createElement("p"); fp.className = "txt"; fp.id = "fact-txt"; fp.textContent = it.fact; fp.setAttribute("aria-hidden","true");
  f.append(ft, fp);
  f.addEventListener("click", reveal);

  pair.append(m, vs, f);
  $("insight").hidden = true; $("next").hidden = true;
}
function reveal(){
  if(revealed) return; revealed = true;
  const f = $("fact"); f.classList.add("shown"); f.setAttribute("aria-expanded","true");
  $("fact-tag").textContent = "Fact"; $("fact-txt").setAttribute("aria-hidden","false");
  const it = ITEMS[i];
  const ins = $("insight"); ins.innerHTML = "";
  const s = document.createElement("strong"); s.textContent = "Why it matters";
  const p = document.createElement("p"); p.textContent = it.insight;
  ins.append(s, p); ins.hidden = false;
  const n = $("next"); n.textContent = (i === ITEMS.length-1) ? "See the summary" : "Next statement"; n.hidden = false;
  n.focus({preventScroll:false});
}
$("next").addEventListener("click", ()=>{
  if(i < ITEMS.length-1){ i++; render(); window.scrollTo(0,0); }
  else{
    const box = $("sums"); box.innerHTML = "";
    ITEMS.forEach(it=>{
      const d = document.createElement("div"); d.className = "sum";
      const a = document.createElement("p"); a.className = "m"; const ab = document.createElement("b"); ab.textContent = "Myth: "; a.append(ab, it.myth);
      const c = document.createElement("p"); c.className = "f"; const cb = document.createElement("b"); cb.textContent = "Fact: "; c.append(cb, it.fact);
      d.style.setProperty("--i", ITEMS.indexOf(it));
      d.append(a, c); box.appendChild(d);
    });
    $("play").hidden = true; $("end").hidden = false; $("end-title").focus({preventScroll:true}); window.scrollTo(0,0);
    const et = $("end-title"); et.classList.remove("pop"); void et.offsetWidth; et.classList.add("pop");
    if(!RM){
      const rc = et.getBoundingClientRect(); confetti(rc.left + Math.min(rc.width/2, 260), rc.top + 20, 48);
      [[8,-6],[32,-10],[56,0],[20,26]].forEach((o,k)=>{ const sp = document.createElement("span"); sp.className = "spark"; sp.setAttribute("aria-hidden","true"); sp.textContent = "\u2726"; sp.style.left = (o[0]*k+ (k*60)) + "px"; sp.style.top = (o[1]+4) + "px"; sp.style.animationDelay = (k*120) + "ms"; et.style.position = "relative"; et.appendChild(sp); setTimeout(()=>sp.remove(), 1400); });
    }
  }
});
$("again").addEventListener("click", ()=>{ i = 0; $("end").hidden = true; $("play").hidden = false; render(); window.scrollTo(0,0); });
render();
</script>
</body>
</html>
