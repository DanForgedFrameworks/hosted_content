<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rise 360 Review Portal</title>
    <style>
        /* Core Box Sizing & Variables */
        * { box-sizing: border-box; }
        :root {
            --deep-purple: #370c65; 
            --light-purple: #691eda; 
            --pastel-purple-bg: #f2effc;
            --pastel-purple-border: #ece6f9; 
            --coral-accent: #f08838; 
            --status-prep: #d97706; 
            --status-pub: #059669;  
            --white: #ffffff; 
            --text-main: #2d3436; 
            --text-muted: #57606f;
            --radius-lg: 24px; 
            --radius-sm: 12px;
            --directional-shadow: 12px 12px 25px rgba(55, 12, 101, 0.12);
            --heavy-shadow: 18px 18px 35px rgba(55, 12, 101, 0.2);
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            color: var(--text-main); 
            background-color: transparent;
        }

        #library-wrapper { 
            width: 100%; 
            min-height: 100vh;
            background-color: #f8fafc;
            padding: 40px 20px; 
            position: relative;
            z-index: 1;
            overflow: hidden; 
        }

        .digital-bg {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(var(--light-purple) 2px, transparent 2px);
            background-size: 45px 45px;
            opacity: 0.08;
            z-index: -1;
            animation: pan-digital-grid 50s linear infinite;
        }

        @keyframes pan-digital-grid {
            0% { transform: translate(0, 0); }
            100% { transform: translate(45px, 45px); }
        }

        .main-header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--deep-purple); margin: 0 0 5px 0; font-size: 2.2rem; font-weight: 800; }
        .subtitle { color: var(--text-muted); font-size: 1.1rem; }

        .controls-container {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            gap: 20px;
            align-items: center;
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        #backBtn {
            display: none;
            background: var(--deep-purple);
            color: var(--white);
            border: none;
            padding: 18px 25px;
            border-radius: var(--radius-lg);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--directional-shadow);
            transition: background 0.3s, transform 0.2s;
            white-space: nowrap;
        }

        #backBtn:hover {
            background: var(--light-purple);
            transform: translateY(-2px);
        }
        
        input[type="text"] { 
            width: 100%; 
            padding: 18px 25px; 
            font-size: 18px; 
            box-sizing: border-box; 
            border: 2px solid var(--pastel-purple-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--directional-shadow);
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
        }
        input[type="text"]:focus { 
            border-color: var(--light-purple); 
            box-shadow: var(--heavy-shadow);
        }

        .view-title {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            color: var(--deep-purple);
            font-size: 1.5rem;
            font-weight: bold;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .trigger-card {
            background: var(--white);
            border: 2px solid var(--pastel-purple-border);
            border-radius: var(--radius-lg);
            padding: 30px 25px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s;
            box-shadow: var(--directional-shadow);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            align-items: center; 
            text-align: center;  
            position: relative; /* Essential for tooltips */
        }

        .trigger-card:hover { 
            transform: translate(-5px, -5px); 
            box-shadow: var(--heavy-shadow); 
            border-color: var(--light-purple); 
        }

        .trigger-icon {
            margin-bottom: 20px;
            padding: 20px;
            background: var(--pastel-purple-bg);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .trigger-title { 
            color: var(--deep-purple); 
            font-weight: 800; 
            font-size: 1.25rem; 
            margin: 0 0 20px 0; 
            line-height: 1.4;
        }

        .meta-container {
            width: 100%;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start; 
            text-align: left;
            border-top: 1px dashed var(--pastel-purple-border);
            padding-top: 15px;
        }

        .meta-row { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
            width: 100%;
        }

        .tag { 
            background: var(--pastel-purple-bg); 
            padding: 6px 10px; 
            border-radius: var(--radius-sm); 
            font-size: 12px; 
            font-weight: 700; 
            color: var(--deep-purple);
            border: 1px solid var(--pastel-purple-border);
        }
        
        .tag-programme { 
            background: var(--white); 
            color: var(--coral-accent); 
            border-color: rgba(240, 136, 56, 0.3);
            width: 100%;
            margin-bottom: 5px;
        }

        .tag-status-prep { background: #fef3c7; color: var(--status-prep); border-color: #fde68a; }
        .tag-status-pub { background: #d1fae5; color: var(--status-pub); border-color: #a7f3d0; }

        .date-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* Hover Tooltip Styling */
        .module-tooltip {
            position: absolute;
            bottom: calc(100% + 15px);
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: #1a202c;
            color: var(--white);
            padding: 15px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            width: max-content;
            max-width: 280px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            pointer-events: none;
            z-index: 1000;
            text-align: left;
        }

        .module-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -8px;
            border-width: 8px;
            border-style: solid;
            border-color: #1a202c transparent transparent transparent;
        }

        .trigger-card:hover .module-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .module-tooltip ul {
            margin: 8px 0 0 0;
            padding-left: 20px;
        }

        .module-tooltip li {
            margin-bottom: 6px;
            line-height: 1.3;
            color: #e2e8f0;
        }

        .empty-state {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.2rem;
            font-weight: 600;
        }

    </style>
</head>
<body>

<div id="library-wrapper">
    <div class="digital-bg"></div>
    
    <header class="main-header">
        <h1>Rise 360 Review Dashboard</h1>
        <p class="subtitle">Select a programme or search to access module review links.</p>
    </header>

    <div class="controls-container">
        <button id="backBtn" onclick="showProgrammes()">← Back</button>
        <input type="text" id="searchInput" placeholder="Search by programme, title, or code...">
    </div>

    <div id="viewTitle" class="view-title">Programme Overview</div>
    <div id="linksContainer" class="card-grid"></div>

</div>

<script>
    // SVG Icons map for different disciplines
    const icons = {
        "lab": `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--coral-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>`,
        "chem": `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--coral-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H15M10 3V10L5 19H19L14 10V3"></path></svg>`,
        "bio": `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--coral-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"></circle><path d="M12 2v4m0 12v4m10-10h-4M6 12H2m15.5-7.5l-2.8 2.8M7.3 16.7l-2.8 2.8m15.5 0l-2.8-2.8M7.3 7.3L4.5 4.5"></path></svg>`,
        "process": `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--coral-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>`,
        "polymer": `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--coral-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>`,
        "asbestos": `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--coral-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`,
        "math": `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--coral-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><line x1="16" y1="10" x2="16" y2="10.01"></line><line x1="12" y1="10" x2="12" y2="10.01"></line><line x1="8" y1="10" x2="8" y2="10.01"></line><line x1="12" y1="14" x2="12" y2="14.01"></line><line x1="8" y1="14" x2="8" y2="14.01"></line><line x1="12" y1="18" x2="12" y2="18.01"></line><line x1="8" y1="18" x2="8" y2="18.01"></line></svg>`,
        "materials": `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--coral-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>`
    };

    // Full Module Database structured under clear HE Levels
    const modulesData = [
        { 
            programme: "Level 6 HE: Applied Biosciences", 
            iconKey: "bio",
            title: "Infection and Immunity", 
            code: "TAB5202", 
            version: "v1",
            publishDate: "201025",
            updatedDate: "Dec 10, 2025",
            url: "https://360.articulate.com/review/content/700a1860-77bc-417c-bf1d-991068072d5d/review" 
        },
        { 
            programme: "Level 6 HE: Applied Chemical Sciences", 
            iconKey: "chem",
            title: "Frontier Topics in Chemistry", 
            code: "TAC6102", 
            version: "v1",
            publishDate: "280426",
            updatedDate: "May 1, 2026",
            url: "https://360.articulate.com/review/content/a12c8fb2-438a-43da-afb1-28850eabbe42/review" 
        },
        { 
            programme: "Level 6 HE: Applied HE Pathways", 
            iconKey: "math",
            title: "Mathematics & Data Analysis", 
            code: "TFM4101", 
            version: "v3",
            publishDate: "160326",
            updatedDate: "Apr 28, 2026",
            url: "https://360.articulate.com/review/content/865590da-ecb2-4370-af88-d54b07ed5235/review" 
        },
        { 
            programme: "Level 5: Laboratory Management", 
            iconKey: "lab",
            title: "Digital transformation & Innovation in Lab Management", 
            code: "TLM5106", 
            version: "v0",
            publishDate: "110226",
            updatedDate: "May 13, 2026",
            url: "https://360.articulate.com/review/content/04701a2d-9381-4345-ae4a-4126bf40af60/review" 
        },
        { 
            programme: "Level 5: Applied Material Sciences", 
            iconKey: "materials",
            title: "Laboratory Practice for Materials", 
            code: "TAM5103", 
            version: "v2",
            publishDate: "300925",
            updatedDate: "September 30, 2025",
            url: "https://360.articulate.com/review/content/9a159375-2662-42de-8eef-aa0d690cc49c/review" 
        },
        { 
            programme: "Level 3: Process Industry Manufacturing Technician", 
            iconKey: "process",
            title: "Process Safety: Navigating Risks with Confidence", 
            code: "TPIMT3101", 
            version: "v1",
            publishDate: null,
            updatedDate: "May 13, 2026",
            url: "https://360.articulate.com/review/content/6aef3c13-cd19-4afe-86e0-44d315eb3821/review" 
        },
        { 
            programme: "Level 3: Polymer Processing Technician", 
            iconKey: "polymer",
            title: "Polymer Science and Processing ITM", 
            code: "TPPT3201", 
            version: "v0.1",
            publishDate: null,
            updatedDate: "May 13, 2026",
            url: "https://360.articulate.com/review/content/16cf0ed8-ceda-4c81-9690-3161a60c2097/review" 
        },
        { 
            programme: "Level 3: Asbestos Analyst", 
            iconKey: "asbestos",
            title: "Working with Data in Asbestos", 
            code: "TAA3102", 
            version: "v0",
            publishDate: "240326",
            updatedDate: "May 11, 2026",
            url: "https://360.articulate.com/review/content/6af7ac5d-a42a-426a-abc1-7fc97438c1e8/review" 
        }
    ];

    // Extract unique programmes
    const uniqueProgrammes = [...new Set(modulesData.map(item => item.programme))].map(prog => {
        const sampleModule = modulesData.find(m => m.programme === prog);
        return {
            title: prog,
            iconKey: sampleModule.iconKey,
            count: modulesData.filter(m => m.programme === prog).length
        };
    });

    const searchInput = document.getElementById('searchInput');
    const linksContainer = document.getElementById('linksContainer');
    const backBtn = document.getElementById('backBtn');
    const viewTitle = document.getElementById('viewTitle');

    // Utility: Determine if Published or Pre-publish
    function getStatusTag(version) {
        if (!version) return '';
        if (version.toLowerCase().startsWith('v0')) {
            return `<span class="tag tag-status-prep">Pre-publish</span>`;
        }
        return `<span class="tag tag-status-pub">Published (LMS)</span>`;
    }

    // Render Programme Level
    function showProgrammes() {
        backBtn.style.display = 'none';
        searchInput.value = '';
        viewTitle.innerText = "Programme Overview";
        linksContainer.innerHTML = '';
        
        uniqueProgrammes.forEach(prog => {
            const card = document.createElement('div');
            card.className = 'trigger-card';
            card.onclick = () => showModulesForProgramme(prog.title);
            
            // Build the hover tooltip list
            const containedModules = modulesData.filter(m => m.programme === prog.title);
            const listHTML = containedModules.map(m => `<li><strong>${m.code}</strong><br>${m.title}</li>`).join('');

            card.innerHTML = `
                <div class="trigger-icon">${icons[prog.iconKey]}</div>
                <h2 class="trigger-title">${prog.title}</h2>
                <div class="meta-container">
                    <span class="tag tag-programme">${prog.count} Module${prog.count > 1 ? 's' : ''}</span>
                </div>
                <div class="module-tooltip">
                    <strong>Modules included:</strong>
                    <ul>${listHTML}</ul>
                </div>
            `;
            linksContainer.appendChild(card);
        });
    }

    // Render Module Level
    function renderModules(modulesToRender, specificProgramme = null) {
        linksContainer.innerHTML = '';
        
        if (modulesToRender.length === 0) {
            linksContainer.innerHTML = '<div class="empty-state">No matching modules found.</div>';
            return;
        }

        modulesToRender.forEach(link => {
            const card = document.createElement('a');
            card.className = 'trigger-card';
            card.href = link.url;
            card.target = "_blank";
            
            let publishDateStr = link.publishDate ? ` | Pub: ${link.publishDate}` : '';
            
            card.innerHTML = `
                <div class="trigger-icon">${icons[link.iconKey]}</div>
                <h2 class="trigger-title">${link.title}</h2>
                <div class="meta-container">
                    ${specificProgramme ? '' : `<span class="tag tag-programme">${link.programme}</span>`}
                    <div class="meta-row">
                        <span class="tag">Code: ${link.code}</span>
                        ${link.version ? `<span class="tag">Ver: ${link.version}</span>` : ''}
                        ${getStatusTag(link.version)}
                    </div>
                    <div class="date-text">Last Updated: ${link.updatedDate}${publishDateStr}</div>
                </div>
            `;
            linksContainer.appendChild(card);
        });
    }

    function showModulesForProgramme(programmeName) {
        backBtn.style.display = 'block';
        searchInput.value = '';
        viewTitle.innerText = `Modules: ${programmeName}`;
        const filtered = modulesData.filter(m => m.programme === programmeName);
        renderModules(filtered, programmeName);
    }

    // Search Logic
    searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        
        if (term === '') {
            showProgrammes();
            return;
        }

        backBtn.style.display = 'none';
        viewTitle.innerText = "Search Results";
        
        const filtered = modulesData.filter(l => 
            l.programme.toLowerCase().includes(term) ||
            l.title.toLowerCase().includes(term) ||
            l.code.toLowerCase().includes(term)
        );
        renderModules(filtered, null);
    });

    // Initialize
    showProgrammes();
</script>
</body>
</html>
