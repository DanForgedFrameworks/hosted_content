<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Learning Pathway</title>
  <meta name="color-scheme" content="dark" />

  <style>
    :root{
      /* Theme tokens are overridden at runtime from PROGRAMME.theme */
      --bg0: #060412;
      --bg1: #110524;
      --accentA: 232, 54, 240;
      --accentB: 56, 189, 248;
      --node:    147, 56, 248;

      /* Ambient wash tints. Overridden at runtime: theme.ambient if set, else the three
         accents (which reproduces the pre-2026-08-06 behaviour exactly). */
      --ambientA: 232, 54, 240;
      --ambientB: 56, 189, 248;
      --ambientC: 147, 56, 248;

      --text: #e5e7eb;
      --muted: #cbd5e1;

      --glass: rgba(12, 10, 26, 0.65);
      --glass2: rgba(12, 10, 26, 0.80);
      --glassBorder: rgba(255,255,255,0.12);
      --shadow: 0 18px 75px rgba(0,0,0,0.65);
      --radius: 18px;

      --activeFadeIn: 1100ms;
      --activeFadeOut: 380ms;
      --miniFadeIn: 900ms;
      --miniFadeOut: 420ms;
    }

    *{ box-sizing:border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }

    body{
      overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        /* AMBIENT WASHES. These default to the three accents, which is right for most
           palettes. Where the accent is strongly hued, two of the three washes carry the
           same hue and the mid-ground takes on a cast (lime -> olive, measured on the
           asbestos routes). `theme.ambient` overrides all three with one neutral. */
        radial-gradient(1200px 800px at 20% 10%, rgba(var(--ambientA),0.10), transparent 60%),
        radial-gradient(1100px 700px at 80% 20%, rgba(var(--ambientB),0.08), transparent 62%),
        radial-gradient(900px 650px at 60% 90%, rgba(var(--ambientC),0.12), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    canvas{ position: fixed; inset: 0; width: 100%; height: 100%; display:block; }
    .stage{ position: fixed; inset: 0; z-index: 3; pointer-events: none; }

    /* ===== Controls ===== */
    .controls-left{
      position: fixed; left: 18px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px; z-index: 10; pointer-events: auto;
    }
    .controls-right{
      position: fixed; right: 18px; top: 18px; z-index: 10; pointer-events: auto;
      display:flex; flex-direction:column; gap:10px; align-items:flex-end;
    }
    .btn-control{
      position: relative;
      background: rgba(12, 10, 26, 0.72);
      border: 1px solid rgba(255,255,255,0.16);
      color: #fff; padding: 10px 16px; border-radius: 10px; cursor: pointer;
      min-height: 44px;   /* 2026-08-05: measured 41px at 360/390/414 — under the 44px house floor.
                             Padding cannot guarantee a target size, only a floor can. */
      font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: 0.2px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.28); text-align: left;
      transition: transform 140ms cubic-bezier(.2,.8,.2,1), background 220ms ease,
                  border-color 220ms ease, box-shadow 220ms ease, color 220ms ease;
      will-change: transform;
    }
    .btn-control:hover{
      background: rgba(var(--node), 0.40);
      border-color: rgba(var(--accentA), 0.6);
      transform: translateX(4px);
      box-shadow: 0 8px 22px rgba(0,0,0,0.38), 0 0 0 1px rgba(var(--accentA),0.18);
    }
    .controls-right .btn-control:hover{ transform: translateY(-2px); }
    .btn-control:active{
      transform: translateX(2px) scale(0.97);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.45); transition-duration: 60ms;
    }
    .controls-right .btn-control:active{ transform: translateY(1px) scale(0.97); }
    .btn-control:focus-visible{ outline: 2px solid rgba(var(--accentB), 0.9); outline-offset: 2px; }
    .btn-control.is-active{
      background: linear-gradient(90deg, rgba(var(--accentA),0.35), rgba(var(--node),0.30));
      border-color: rgba(var(--accentA), 0.75);
      box-shadow: 0 0 0 1px rgba(var(--accentA),0.35), 0 8px 24px rgba(0,0,0,0.4);
    }
    .btn-control.is-active::before{
      content:""; position:absolute; left:6px; top:50%; transform:translateY(-50%);
      width:4px; height:55%; border-radius:4px;
      background: rgba(var(--accentA), 0.95); box-shadow: 0 0 12px rgba(var(--accentA),0.7);
    }
    /* ---- motion toggle: four redundant indicators, never colour alone ----
       Semantics follow the canonical pill (_behaviours/motion-toggle, CONSISTENCY-STANDARD
       §4.1): pip, crossed-out symbol, the word On/Off, and aria-pressed. Rendered in this
       engine's dark .btn-control chrome rather than copied verbatim — the canonical pill is
       a light-surface component that requires tokens-tiro.css, which this standalone file
       does not bundle. Recorded deviation, not drift.
       State is keyed off aria-pressed on the button, not a body class, so the button is the
       single source of truth. */
    .btn-motion{ display: inline-flex; align-items: center; gap: 8px; text-align: left; }
    .btn-motion .pip{ width: 10px; height: 10px; border-radius: 50%; background: #34d399; flex: none; }
    .btn-motion[aria-pressed="false"] .pip{ background: rgba(229,231,235,0.38); }   /* off: neutral, not red */
    .btn-motion .motion-ic{ display: inline-flex; flex: none; }
    .btn-motion .motion-ic svg{ width: 16px; height: 16px; display: block; }
    .btn-motion[aria-pressed="false"] .motion-ic{ opacity: 0.55; }
    .btn-motion[aria-pressed="false"]{ color: rgba(229,231,235,0.62); }

    .btn-resume{
      margin-top: 4px; background: rgba(var(--accentA), 0.18);
      border-color: rgba(var(--accentA), 0.45); text-align: center;
    }

    /* ===== Header ===== */
    .headerCard{
      position: absolute; left: 50%; top: calc(20px + env(safe-area-inset-top));
      transform: translateX(-50%) translateY(-8px);
      width: min(920px, calc(100% - 42px)); border-radius: var(--radius);
      background: var(--glass2); border: 1px solid var(--glassBorder);
      box-shadow: 0 18px 70px rgba(0,0,0,0.5);
      backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
      padding: 14px 22px; opacity: 0; text-align: center;
      transition: opacity 700ms ease, transform 700ms cubic-bezier(.2,.8,.2,1);
    }
    .headerCard.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
    .headerTitle{
      margin: 0; font-weight: 900; letter-spacing: 0.3px; font-size: clamp(20px, 2.5vw, 28px);
      background: linear-gradient(90deg, rgb(var(--accentA)), rgb(var(--accentB)));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .headerSub{ margin: 6px 0 0 0; color: rgba(226, 232, 240, 0.85); line-height: 1.45; font-size: clamp(13px, 1.6vw, 16px); font-weight: 500; }

    /* ===== Active (focused module) card ===== */
    .activeCard{
      position: absolute; width: min(560px, calc(100% - 52px)); border-radius: var(--radius);
      background: var(--glass); border: 1px solid var(--glassBorder); box-shadow: var(--shadow);
      backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
      padding: 20px 22px; opacity: 0; transform: translate(-50%, -50%) scale(0.985);
      text-align: center; overflow: hidden; z-index: 5;
      transition: opacity var(--activeFadeIn) ease, transform var(--activeFadeIn) ease,
                  left 600ms cubic-bezier(0.25, 1, 0.5, 1), top 600ms cubic-bezier(0.25, 1, 0.5, 1);
    }
    .activeCard.show{ opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .activeCard.fadeOut{
      opacity: 0; transform: translate(-50%, -50%) scale(0.985);
      transition: opacity var(--activeFadeOut) ease, transform var(--activeFadeOut) ease, left 600ms ease, top 600ms ease;
    }
    .activeCard::after{
      content:""; position:absolute; inset:0; pointer-events:none;
      border-top: 3px solid rgba(255,255,255,0.20); border-bottom: 3px solid rgba(255,255,255,0.20);
      border-radius: var(--radius);
      box-shadow: inset 0 1px 0 rgba(var(--accentA),0.15), inset 0 -1px 0 rgba(var(--accentA),0.15);
    }
    .row{ display:flex; flex-direction: column; gap: 12px; align-items:center; position: relative; z-index: 1; }
    .iconWrap{
      width: 52px; height: 52px; border-radius: 16px; background: rgba(2,6,23,0.55);
      border: 1px solid rgba(255,255,255,0.15); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
      display:grid; place-items:center; color: rgba(var(--accentA),0.95);
    }
    .title{ margin: 0; font-size: clamp(19px, 2.2vw, 24px); letter-spacing: 0.2px; line-height: 1.2; }
    .meta{ margin: 0; color: rgba(203,213,225,0.9); line-height: 1.5; font-size: 15px; max-width: 62ch; }
    .tag{
      display:inline-flex; align-items:center; gap: 8px; margin-top: 6px; padding: 8px 14px; border-radius: 999px;
      background: rgba(2,6,23,0.6); border: 1px solid rgba(255,255,255,0.15); color: rgba(229,231,235,0.95);
      font-weight: 800; letter-spacing: 0.5px; font-size: 13px; width: fit-content;
    }
    .dot{ width: 10px; height: 10px; border-radius: 50%; background: rgba(var(--node),0.95); box-shadow: 0 0 16px rgba(var(--accentA),0.6); }

    /* ===== Pinned mini cards (per-level overview) ===== */
    .miniCard{
      position: absolute; width: 210px; border-radius: 14px; background: var(--glass2);
      border: 1px solid rgba(255,255,255,0.18); box-shadow: 0 18px 60px rgba(0,0,0,0.55);
      backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
      padding: 12px 14px; text-align: center; z-index: 4;
      opacity: 0; transform: translate(-50%, -50%) scale(0.94);
      transition: opacity var(--miniFadeIn) ease, transform var(--miniFadeIn) ease, left 520ms ease, top 520ms ease;
    }
    .miniCard.show{ opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .miniCard.fadeOut{
      opacity: 0; transform: translate(-50%, -50%) scale(0.94);
      transition: opacity var(--miniFadeOut) ease, transform var(--miniFadeOut) ease, left 520ms ease, top 520ms ease;
    }
    .miniTitle{ margin: 0; font-size: 14px; font-weight: 800; line-height: 1.25; letter-spacing: 0.2px; color: #fff; }

    /* ===== Summary panel (ALL / pathway view) ===== */
    .summaryPanel{
      position: absolute; left: 176px; right: 24px; top: 92px; bottom: 16px;
      display: flex; flex-direction: column; justify-content: center; gap: 12px;
      z-index: 6; opacity: 0; pointer-events: none; overflow-y: auto; padding: 4px;
      transition: opacity 600ms ease;
    }
    .summaryPanel.show{ opacity: 1; pointer-events: auto; }
    .sumRow{ display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap; }
    .sumRowLabel{
      flex: 0 0 auto; min-width: 84px; display: flex; align-items: center; justify-content: center;
      padding: 6px 12px; border-radius: 12px; font-weight: 900; font-size: 13px; letter-spacing: 0.4px; color: #fff;
      background: linear-gradient(135deg, rgba(var(--accentA),0.30), rgba(var(--node),0.22));
      border: 1px solid rgba(var(--accentA),0.45); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .sumChips{ display: flex; gap: 10px; flex: 1 1 280px; flex-wrap: wrap; }
    .chip{
      flex: 1 1 120px; min-width: 108px; border-radius: 12px; padding: 10px 12px;
      background: var(--glass2); border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      backdrop-filter: blur(12px) saturate(140%); -webkit-backdrop-filter: blur(12px) saturate(140%);
      text-align: left; opacity: 0; transform: translateY(8px) scale(0.98);
      transition: opacity 420ms ease, transform 420ms cubic-bezier(.2,.8,.2,1), border-color 200ms ease, box-shadow 200ms ease;
    }
    .summaryPanel.show .chip{ opacity: 1; transform: translateY(0) scale(1); }
    .chip:hover{
      border-color: rgba(var(--accentA),0.6);
      box-shadow: 0 14px 34px rgba(0,0,0,0.5), 0 0 0 1px rgba(var(--accentA),0.25);
      transform: translateY(-3px) scale(1.01);
    }
    .chipTag{ font-size: 11px; font-weight: 800; letter-spacing: 0.4px; color: rgba(var(--accentA),0.95); }
    .chipTitle{ margin: 3px 0 0 0; font-size: 13.5px; font-weight: 700; line-height: 1.22; color: #fff; }

    @media (max-width: 980px){
      .miniCard{ width: 180px; padding: 10px; } .miniTitle{ font-size: 13px; }
      .controls-left{ left: 10px; } .summaryPanel{ left: 158px; }
      .chip{ flex-basis: 120px; min-width: 110px; }
    }
    @media (max-width: 720px){
      .miniCard{ width: 160px; } .headerSub{ display:none; }
      .controls-left{ top: auto; bottom: 14px; flex-direction: row; flex-wrap: wrap; width: calc(100% - 20px); transform: none; justify-content: center; }
      .controls-right{ top: 12px; right: 12px; } .btn-resume{ margin-top: 0; }
      .summaryPanel{ left: 12px; right: 12px; top: 68px; bottom: 64px; } .chipTitle{ font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce){
      .activeCard, .miniCard, .headerCard, .chip, .summaryPanel, .btn-control{ transition-duration: 1ms !important; }
    }
  </style>
</head>

<body>
  <canvas id="net" aria-hidden="true"></canvas>
  <div id="a11y" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px;"></div>

  <div class="stage" id="stage">
    <div class="controls-left" id="controlsLeft" role="group" aria-label="Pathway summary views"></div>
    <div class="controls-right">
      <button class="btn-control" id="btnPause" onclick="togglePause()">Pause Tour</button>
      <button class="btn-control btn-motion" id="btnBgAnim" type="button" aria-pressed="true" onclick="toggleBgAnim()"><span class="pip" aria-hidden="true"></span><span class="motion-ic" id="motionIc" aria-hidden="true"></span>Background animation: <span id="motionState">On</span></button>
    </div>

    <div class="headerCard" id="headerCard" aria-hidden="true">
      <h1 class="headerTitle" id="hTitle"></h1>
      <p class="headerSub" id="hSub"></p>
    </div>

    <div class="activeCard" id="activeCard" aria-hidden="true">
      <div class="row">
        <div class="iconWrap" id="activeIcon"></div>
        <h2 class="title" id="activeTitle"></h2>
        <p class="meta" id="activeMeta"></p>
        <div class="tag"><span class="dot"></span><span id="activeTag"></span></div>
      </div>
    </div>

    <div id="miniCardContainer"></div>
    <div class="summaryPanel" id="summaryPanel" aria-hidden="true"></div>
  </div>

  <script>
    (() => {
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      /* ===== PROGRAMME data is injected here by the build step ===== */
      const PROGRAMME = {
  id: "tlm_commercial_v2",
  name: "Laboratory Manager",
  docTitle: "Learning Pathway | Laboratory Manager",
  intro: "Each module connects into a single pathway, ending with summative and live assessment.",
  allTitle: "Learning pathway for the Laboratory Manager",
  allSub: "Each module connects into a single pathway leading to summative and live assessment.",
  backdrop: "network",
  structure: "flat",
  /* Backdrop parallax factor. The field pans against the camera at this fraction, so by the
     end of the node path the background has traversed with the journey. */
  parallax: 0.18,
  /* ============================================================================
     COMMERCIAL ROUTE — VARIANT 2, created 2026-08-06.

     WHY TWO VARIANTS EXIST. The work coaches supplied the commercial route as
     "modules 1, 5 and 6" and named them: Health Safety and Risk Management,
     Operational Excellence in Lab Environments, Scientific Data Management & Analysis.
     Those NUMBERS do not match those TITLES in the validated tlm.js:

        coaches said  |  title supplied                          |  actual tlm.js position
        module 1      |  Health, Safety and Risk Management      |  1   (matches)
        module 5      |  Operational Excellence in Lab Envs      |  4   (does NOT match)
        module 6      |  Scientific Data Management & Analysis   |  5   (does NOT match)

     So the two readings select different content:
        tlm_commercial.js     (v1) — modules 1, 5, 6 BY NUMBER
                                     Health & Safety · Scientific Data Mgmt · Digital Transformation
        tlm_commercial_v2.js  (v2, this file) — the coaches' TITLES
                                     Health & Safety · Operational Excellence · Scientific Data Mgmt

     Both are published. v1 keeps the original slug so its live embed is untouched;
     this one publishes to tlm_animation_commercial_v2. Owner to decide which is correct
     and retire the other — do not silently converge them.

     WORDING NOTE: the coaches wrote "Operational Excellence in Lab Environments".
     The validated title is "Operational Excellence in Laboratory Environments". The
     validated wording is used here verbatim, per the content rule — flagged, not
     auto-corrected in the source.

     All three retained modules carry titles and meta VERBATIM from tlm.js. Do not
     reword them here, or the routes drift apart.
     ============================================================================ */
  theme: { bg0: "#04141a", bg1: "#062333", accentA: "45,212,191", accentB: "56,189,248", node: "20,184,166", star: "150,180,196" },
  /* PACING: a journey, not a dash to an endpoint. Matches v1 — travel is the journey
     lever (time in motion), hold is reading time. Do not buy journey feel with hold. */
  timing: {
    travel: 1500, hold: 2800, fadeOut: 350, gap: 220,
    camMoveAll: 1200, overviewAll: 5000, overviewFadeOutAll: 500, pause: 600,
    activeFadeIn: 500, activeFadeOut: 320, miniFadeIn: 450, miniFadeOut: 340
  },
  modules: [
    { tag:"Module 1", title:"Health, Safety and Risk Management in Scientific Environments", meta:"Identify hazards, assess risks, and apply safe systems of work to protect people, samples, and operations.", icon:"shield" },
    { tag:"Module 2", title:"Operational Excellence in Laboratory Environments", meta:"Maintain robust operations and consistent ways of working that support reliable outcomes.", icon:"quality" },
    { tag:"Module 3", title:"Scientific Data Management & Analysis", meta:"Ensure data integrity, analyse results, and communicate findings clearly for decisions and continuous improvement.", icon:"data" },
    /* AUTHORED COPY - not supplied by the owner, still unconfirmed. Written from the brief:
       "summative and live assessment ... similar but not done by EPAO but a member of Tiro".
       Identical to v1 so the two routes close the same way. */
    { tag:"Assessment", title:"Summative and Live Assessment", meta:"Consolidate your evidence, complete a summative assessment and take part in a live professional discussion, assessed by a Tiro assessor.", icon:"cap" }
  ]
};

      const modules = PROGRAMME.modules;
      const LAST = modules.length - 1;
      const isFlat = PROGRAMME.structure === 'flat';
      const levels = PROGRAMME.levels || [];

      document.title = PROGRAMME.docTitle || ('Learning Pathway | ' + PROGRAMME.name);

      /* ===== Apply theme ===== */
      const TH = PROGRAMME.theme;
      const rs = document.documentElement.style;
      rs.setProperty('--bg0', TH.bg0); rs.setProperty('--bg1', TH.bg1);
      rs.setProperty('--accentA', TH.accentA); rs.setProperty('--accentB', TH.accentB);
      rs.setProperty('--node', TH.node);
      /* One neutral for all three ambient washes when the palette needs the ground kept
         cool; otherwise each wash keeps its own accent, exactly as before. */
      rs.setProperty('--ambientA', TH.ambient || TH.accentA);
      rs.setProperty('--ambientB', TH.ambient || TH.accentB);
      rs.setProperty('--ambientC', TH.ambient || TH.node);
      const C = { a: TH.accentA, b: TH.accentB, n: TH.node, s: TH.star || '229,231,235' };

      /* Per-programme fade overrides. Absent -> the :root defaults stand. */
      const FADES = PROGRAMME.timing || {};
      ['activeFadeIn','activeFadeOut','miniFadeIn','miniFadeOut'].forEach(k => {
        if(FADES[k] != null) rs.setProperty('--' + k, FADES[k] + 'ms');
      });

      /* ===== State ===== */
      /* D13 — defaults ON. prefers-reduced-motion stops the MOVEMENT (see drawBackdrop), it
         does not hide the layer; canon reserves disappearing for the explicit toggle only.
         Briefly defaulted this to !prefersReducedMotion, which removed the motif outright for
         those users — an over-reach, and a second route to "no background at all". */
      let mode = 'auto', animBg = true, paused = false, lastCycle = -1;

      function levelOfIndex(i){ for(let k=0;k<levels.length;k++){ if(i>=levels[k].start && i<=levels[k].end) return k; } return 0; }

      window.setStaticView = function(view){
        mode = view; paused = false;
        activeCard.classList.remove('show', 'fadeOut');
        setMiniState("off"); hideSummary(); updateButtons();
      };
      window.resumeAuto = function(){
        mode = 'auto'; paused = false;
        setMiniState("off"); hideSummary();
        headerCard.classList.remove('show'); activeCard.classList.remove('show','fadeOut');
        lastCycle = -2; updateButtons();
      };
      window.togglePause = function(){
        if(mode !== 'auto') resumeAuto();
        paused = !paused;
        document.getElementById('btnPause').textContent = paused ? "Play Tour" : "Pause Tour";
        updateButtons();
      };
      /* ON  = heartbeat pulse. OFF = flat line + slash, "no signal" (D29).
         Icons lifted from the canonical motion toggle so the symbol means the same thing
         here as everywhere else. Dimming is done in CSS, never as inline opacity on the
         slash — the two compound and the slash becomes near-invisible. */
      const IC_ON  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>';
      const IC_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/><path d="m3 4 18 18"/></svg>';

      function applyMotionState(){
        const b = document.getElementById('btnBgAnim');
        if(!b) return;
        b.setAttribute('aria-pressed', String(animBg));   /* pressed = motion ON */
        const st = document.getElementById('motionState'); if(st) st.textContent = animBg ? 'On' : 'Off';
        const ic = document.getElementById('motionIc');   if(ic) ic.innerHTML = animBg ? IC_ON : IC_OFF;
      }
      window.toggleBgAnim = function(){
        animBg = !animBg;
        applyMotionState();
      };

      /* ===== Controls ===== */
      function buildControls(){
        let html = '';
        if(isFlat){
          html += `<button class="btn-control" data-mode="ALL" onclick="setStaticView('ALL')">Summarise Pathway</button>`;
        } else {
          levels.forEach((L,k) => { html += `<button class="btn-control" data-mode="LV${k}" onclick="setStaticView('LV${k}')">Summarise ${L.label}</button>`; });
          html += `<button class="btn-control" data-mode="ALL" onclick="setStaticView('ALL')">Summarise All ${levels.length>1?'Levels':'Modules'}</button>`;
        }
        html += `<button class="btn-control btn-resume" data-mode="auto" onclick="resumeAuto()">Resume Pathway</button>`;
        document.getElementById('controlsLeft').innerHTML = html;
      }
      function updateButtons(){
        document.querySelectorAll('.controls-left .btn-control').forEach(b => {
          const on = (b.dataset.mode === mode) && b.dataset.mode !== 'auto';
          b.classList.toggle('is-active', on);
          if(b.dataset.mode !== 'auto') b.setAttribute('aria-pressed', String(on));
        });
      }

      /* ===== Icons ===== */
      function svg(name){
        const common = `fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;
        switch(name){
          case "shield": return `<svg width="26" height="26" viewBox="0 0 24 24" ${common}><path d="M12 2l8 4v6c0 5-3.4 9.4-8 10-4.6-.6-8-5-8-10V6l8-4z"></path><path d="M9 12l2 2 4-5"></path></svg>`;
          case "plan": return `<svg width="26" height="26" viewBox="0 0 24 24" ${common}><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 7h8M8 11h8M8 15h5"></path><path d="M15 15l2 2 3-4"></path></svg>`;
          case "people": return `<svg width="26" height="26" viewBox="0 0 24 24" ${common}><path d="M16 11a4 4 0 1 0-8 0"></path><path d="M12 15c-4 0-7 2-7 5"></path><path d="M12 15c4 0 7 2 7 5"></path><path d="M18 8a3 3 0 1 1 0 6"></path></svg>`;
          case "quality": return `<svg width="26" height="26" viewBox="0 0 24 24" ${common}><path d="M6 3h12v6H6z"></path><path d="M8 9v12"></path><path d="M16 9v12"></path><path d="M6 21h12"></path><path d="M10 14l2 2 4-5"></path></svg>`;
          case "data": return `<svg width="26" height="26" viewBox="0 0 24 24" ${common}><path d="M4 19V5"></path><path d="M20 19V5"></path><path d="M4 19h16"></path><path d="M7 15l3-3 3 2 4-5"></path><path d="M17 9h2"></path></svg>`;
          case "digital": return `<svg width="26" height="26" viewBox="0 0 24 24" ${common}><rect x="4" y="4" width="16" height="12" rx="2"></rect><path d="M8 20h8"></path><path d="M12 16v4"></path><path d="M8 8h.01M12 8h.01M16 8h.01"></path></svg>`;
          case "cap": default: return `<svg width="26" height="26" viewBox="0 0 24 24" ${common}><path d="M22 10L12 5 2 10l10 5 10-5z"></path><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"></path><path d="M22 10v6"></path></svg>`;
        }
      }

      /* ===== Mini cards ===== */
      const miniContainer = document.getElementById('miniCardContainer');
      const minis = [];
      modules.forEach((m, i) => {
        const d = document.createElement('div'); d.className = 'miniCard'; d.id = 'm' + i;
        d.innerHTML = `<p class="miniTitle">${m.title}</p>`;
        miniContainer.appendChild(d); minis.push(d);
      });

      /* ===== Summary panel ===== */
      const summaryPanel = document.getElementById('summaryPanel');
      function rowHTML(label, s, e){
        let chips = '';
        for(let i=s;i<=e;i++){ const m = modules[i]; chips += `<div class="chip"><div class="chipTag">${m.tag}</div><p class="chipTitle">${m.title}</p></div>`; }
        return `<div class="sumRow">${label?`<div class="sumRowLabel">${label}</div>`:''}<div class="sumChips">${chips}</div></div>`;
      }
      function buildSummary(){
        let html = '';
        if(isFlat){ html = rowHTML(null, 0, LAST); }
        else { levels.forEach(L => { html += rowHTML(L.label, L.start, L.end); }); }
        summaryPanel.innerHTML = html;
      }
      function showSummary(){
        summaryPanel.classList.add('show');
        summaryPanel.querySelectorAll('.chip').forEach((c, i) => { c.style.transitionDelay = (prefersReducedMotion ? 0 : i * 35) + 'ms'; });
      }
      function hideSummary(){ summaryPanel.classList.remove('show'); }

      /* ===== Accessible text alternative ===== */
      (function buildA11y(){
        let html = `<h2>${PROGRAMME.name} learning pathway</h2><p>${PROGRAMME.intro||''}</p>`;
        const listItems = (s,e) => { let o='<ul>'; for(let i=s;i<=e;i++) o+=`<li><strong>${modules[i].tag} — ${modules[i].title}.</strong> ${modules[i].meta}</li>`; return o+'</ul>'; };
        if(isFlat){ html += listItems(0, LAST); }
        else { levels.forEach(L => { html += `<h3>${L.label}</h3>` + listItems(L.start, L.end); }); }
        document.getElementById('a11y').innerHTML = html;
      })();

      /* ===== DOM refs ===== */
      const headerCard = document.getElementById('headerCard');
      const hTitle = document.getElementById('hTitle');
      const hSub = document.getElementById('hSub');
      const activeCard = document.getElementById('activeCard');
      const activeIcon = document.getElementById('activeIcon');
      const activeTitle = document.getElementById('activeTitle');
      const activeMeta = document.getElementById('activeMeta');
      const activeTag = document.getElementById('activeTag');

      const canvas = document.getElementById('net');
      const ctx = canvas.getContext('2d', { alpha:true });

      let w=0,h=0,dpr=1;
      function resize(){
        dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        w = Math.floor(window.innerWidth); h = Math.floor(window.innerHeight);
        canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
        canvas.style.width = w+'px'; canvas.style.height = h+'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
        nodes = pathwayLayout();
      }
      function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
      function lerp(a,b,t){ return a + (b-a)*t; }
      function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; }

      /* ===== Backdrops ===== */
      let cells=[], molecules=[], lattice=[], sparks=[], stars=[], bgNodes=[], fibres=[];
      const formulas = ["H₂O","CO₂","C₆H₆","CH₄","NH₃","O₂","N₂","NaCl"];
      /* Backdrop parallax, opt-in per programme (2026-08-05).
         0 = the previous behaviour: drawBackdrop() ran BEFORE applyCamera(), so the field
         was painted in screen space and never moved with the camera — the pathway
         traversed, the background did not. >0 pans the field against the camera at that
         fraction, so the tour reads as a journey across a place.
         The field is grown by BG_PAD on every side and wraps at the padded bounds; without
         that, panning would drag an empty edge into frame. With BG_PARALLAX 0 the padding
         is 0 and every expression below reduces to the original. */
      const BG_PARALLAX = +(PROGRAMME.parallax || 0);
      const BG_PAD_FRAC = 0.22;
      let BG_PAD = 0;

      function initBackdrop(){
        cells=[]; molecules=[]; lattice=[]; sparks=[]; stars=[]; bgNodes=[]; fibres=[];
        BG_PAD = BG_PARALLAX > 0 ? Math.max(w,h)*BG_PAD_FRAC : 0;
        const bd = PROGRAMME.backdrop;
        if(bd==='bio'){
          const n = clamp(Math.round((w*h)/25000), 15, 30);
          for(let i=0;i<n;i++) cells.push({ x:Math.random()*w, y:Math.random()*h, r:Math.random()*40+20, vx:(Math.random()*2-1)*0.08, vy:(Math.random()*2-1)*0.08, phase:Math.random()*Math.PI*2, isVirus:Math.random()>0.6 });
        } else if(bd==='chem'){
          const n = clamp(Math.round((w*h)/30000), 10, 25);
          for(let i=0;i<n;i++) molecules.push({ x:Math.random()*w, y:Math.random()*h, r:Math.random()*25+15, vx:(Math.random()*2-1)*0.08, vy:(Math.random()*2-1)*0.08, rot:Math.random()*Math.PI*2, vrot:(Math.random()*2-1)*0.005, type:Math.random()>0.4?'hex':'text', text:formulas[Math.floor(Math.random()*formulas.length)] });
        } else if(bd==='materials'){
          const n = clamp(Math.round((w*h)/25000), 15, 30);
          for(let i=0;i<n;i++) lattice.push({ x:Math.random()*w, y:Math.random()*h, r:Math.random()*3+2, vx:(Math.random()*2-1)*0.1, vy:(Math.random()*2-1)*0.1 });
          for(let i=0;i<20;i++) sparks.push({ x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-0.5)*4, vy:Math.random()*3+1, life:Math.random() });
        } else if(bd==='network'){
          /* Spread over the PADDED field, and scale the counts by the same factor so the
             per-pixel density is exactly what it was before padding existed. */
          /* areaScale guards against a 0x0 init: (0*0)/(0*0) is NaN, Math.round(n*NaN) is NaN,
             and `i < NaN` is false, so the seeding loop silently produced ZERO particles. */
          const bw = w + BG_PAD*2, bh = h + BG_PAD*2;
          const areaScale = (w > 0 && h > 0) ? (bw*bh)/(w*h) : 1;
          const ns = Math.round(clamp(Math.round((w*h)/8500), 130, 260) * areaScale);
          for(let i=0;i<ns;i++) stars.push({ x:Math.random()*bw-BG_PAD, y:Math.random()*bh-BG_PAD, r:Math.random()*1.2+0.2, a:Math.random()*0.55+0.15, vx:(Math.random()*2-1)*0.06, vy:(Math.random()*2-1)*0.06 });
          const nn = Math.round(clamp(Math.round((w*h)/65000), 14, 22) * areaScale);
          for(let i=0;i<nn;i++) bgNodes.push({ x:Math.random()*bw-BG_PAD, y:Math.random()*bh-BG_PAD, vx:(Math.random()*2-1)*0.11, vy:(Math.random()*2-1)*0.11 });
        } else if(bd==='fibre'){
          /* Asbestos: drifting fibre bundles tumbling slowly, over a haze of dust motes.
             Same padded-field + area-scaled-count contract as `network`, so parallax works
             and per-pixel density holds at any viewport. Colour comes from theme.star
             (the particle-tint token) — no literals. */
          const bw = w + BG_PAD*2, bh = h + BG_PAD*2;
          const areaScale = (w > 0 && h > 0) ? (bw*bh)/(w*h) : 1;
          const nf = Math.round(clamp(Math.round((w*h)/28000), 16, 40) * areaScale);
          for(let i=0;i<nf;i++) fibres.push({
            x:Math.random()*bw-BG_PAD, y:Math.random()*bh-BG_PAD,
            len:Math.random()*80+45, bow:(Math.random()*2-1)*0.42,
            rot:Math.random()*Math.PI*2, vrot:(Math.random()*2-1)*0.0015,
            vx:(Math.random()*2-1)*0.07, vy:(Math.random()*2-1)*0.05,
            a:Math.random()*0.26+0.09, wgt:Math.random()*1.1+0.55
          });
          const nd = Math.round(clamp(Math.round((w*h)/15000), 55, 140) * areaScale);
          for(let i=0;i<nd;i++) stars.push({ x:Math.random()*bw-BG_PAD, y:Math.random()*bh-BG_PAD, r:Math.random()*1.0+0.2, a:Math.random()*0.32+0.08, vx:(Math.random()*2-1)*0.05, vy:(Math.random()*2-1)*0.04 });
        }
      }
      function drawBackdrop(nowT){
        /* OFF means GONE, not frozen (motion-toggle canon / D36). This used to fall through
           to the draw calls with `moving` false, which left the field sitting there as a
           still image — the control appeared to do nothing but stop the drift. */
        if(!animBg) return;
        const moving = !prefersReducedMotion;
        const bd = PROGRAMME.backdrop;
        if(BG_PARALLAX > 0){ ctx.save(); ctx.translate(-(cam.x - w*0.5)*BG_PARALLAX, -(cam.y - h*0.5)*BG_PARALLAX); }
        if(bd==='bio') drawBio(nowT, moving);
        else if(bd==='chem') drawChem(nowT, moving);
        else if(bd==='materials') drawMaterials(nowT, moving);
        else if(bd==='network') drawNetwork(moving);
        else if(bd==='fibre') drawFibre(moving);
        if(BG_PARALLAX > 0) ctx.restore();
      }
      function drawBio(nowT, moving){
        ctx.lineCap="round";
        for(let j=0;j<2;j++){
          ctx.beginPath();
          for(let x=-50;x<w+50;x+=40){ const y=h*(0.3+j*0.4)+Math.sin(x*0.003+nowT*0.0004+j)*100+Math.cos(x*0.007-nowT*0.0002)*40; if(x===-50)ctx.moveTo(x,y);else ctx.lineTo(x,y); }
          ctx.strokeStyle=`rgba(${C.n},0.04)`; ctx.lineWidth=60+j*20; ctx.stroke();
        }
        ctx.lineWidth=1.5;
        for(let x=-100;x<w+100;x+=35){ const t2=x*0.003+nowT*0.001; const y1=h*0.8+Math.sin(t2)*80, y2=h*0.8+Math.sin(t2+Math.PI)*80;
          ctx.strokeStyle=`rgba(${C.n},0.15)`; ctx.beginPath(); ctx.moveTo(x,y1); ctx.lineTo(x,y2); ctx.stroke();
          ctx.fillStyle=`rgba(${C.a},0.3)`; ctx.beginPath(); ctx.arc(x,y1,4,0,Math.PI*2); ctx.fill();
          ctx.fillStyle=`rgba(${C.b},0.3)`; ctx.beginPath(); ctx.arc(x,y2,4,0,Math.PI*2); ctx.fill();
        }
        for(const c of cells){
          if(moving){ c.x+=c.vx; c.y+=c.vy; }
          if(c.x<-100)c.x=w+100; if(c.x>w+100)c.x=-100; if(c.y<-100)c.y=h+100; if(c.y>h+100)c.y=-100;
          const pulse=Math.sin(nowT*0.001+c.phase)*0.2+0.8;
          ctx.fillStyle=`rgba(${C.b},${0.1*pulse})`; ctx.beginPath(); ctx.arc(c.x,c.y,c.r*0.35,0,Math.PI*2); ctx.fill();
          ctx.strokeStyle=`rgba(${C.a},${0.08*pulse})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.stroke();
          if(c.isVirus){ for(let a=0;a<Math.PI*2;a+=Math.PI/3){ const sx=c.x+Math.cos(a+nowT*0.0005)*c.r, sy=c.y+Math.sin(a+nowT*0.0005)*c.r, ex=c.x+Math.cos(a+nowT*0.0005)*(c.r*1.25), ey=c.y+Math.sin(a+nowT*0.0005)*(c.r*1.25); ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke(); } }
        }
      }
      function drawChem(nowT, moving){
        ctx.lineCap="round";
        for(let j=0;j<3;j++){
          ctx.beginPath();
          for(let x=-50;x<w+50;x+=40){ const y=h*(0.2+j*0.3)+Math.sin(x*0.002+nowT*0.0003+j)*80+Math.cos(x*0.005-nowT*0.0001)*30; if(x===-50)ctx.moveTo(x,y);else ctx.lineTo(x,y); }
          ctx.strokeStyle=`rgba(${C.n},0.05)`; ctx.lineWidth=40+j*10; ctx.stroke();
        }
        ctx.font="bold 18px monospace"; ctx.textAlign="center"; ctx.textBaseline="middle";
        for(let i=0;i<molecules.length;i++){
          const m=molecules[i];
          if(moving){ m.x+=m.vx; m.y+=m.vy; m.rot+=m.vrot; }
          if(m.x<-100)m.x=w+100; if(m.x>w+100)m.x=-100; if(m.y<-100)m.y=h+100; if(m.y>h+100)m.y=-100;
          ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(m.rot);
          if(m.type==='hex'){
            ctx.beginPath(); for(let a=0;a<=6;a++){ const ang=a*Math.PI/3, hx=Math.cos(ang)*m.r, hy=Math.sin(ang)*m.r; if(a===0)ctx.moveTo(hx,hy);else ctx.lineTo(hx,hy); }
            ctx.strokeStyle=`rgba(${C.b},0.2)`; ctx.lineWidth=2; ctx.stroke();
            ctx.beginPath(); ctx.arc(0,0,m.r*0.6,0,Math.PI*2); ctx.strokeStyle=`rgba(${C.a},0.15)`; ctx.stroke();
          } else { ctx.fillStyle=`rgba(${C.a},0.25)`; ctx.fillText(m.text,0,0); }
          for(let j=i+1;j<molecules.length;j++){ const m2=molecules[j], dx=m2.x-m.x, dy=m2.y-m.y, dist=Math.sqrt(dx*dx+dy*dy);
            if(dist<150){ ctx.restore(); ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(m2.x,m2.y); ctx.strokeStyle=`rgba(${C.n},${0.1*(1-dist/150)})`; ctx.lineWidth=1.5; ctx.stroke(); ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(m.rot); } }
          ctx.restore();
        }
      }
      function drawMaterials(nowT, moving){
        const beamY=(nowT*0.05)%(h+400)-200;
        ctx.beginPath(); ctx.moveTo(-100,beamY); ctx.lineTo(w+100,beamY+100); ctx.strokeStyle=`rgba(${C.n},0.05)`; ctx.lineWidth=80; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-100,beamY); ctx.lineTo(w+100,beamY+100); ctx.strokeStyle=`rgba(${C.a},0.15)`; ctx.lineWidth=4; ctx.stroke();
        for(let i=0;i<lattice.length;i++){ const nd=lattice[i];
          if(moving){ nd.x+=nd.vx; nd.y+=nd.vy; }
          if(nd.x<-50)nd.x=w+50; if(nd.x>w+50)nd.x=-50; if(nd.y<-50)nd.y=h+50; if(nd.y>h+50)nd.y=-50;
          ctx.fillStyle=`rgba(${C.a},0.2)`; ctx.beginPath(); ctx.arc(nd.x,nd.y,nd.r,0,Math.PI*2); ctx.fill();
          for(let j=i+1;j<lattice.length;j++){ const n2=lattice[j], dx=n2.x-nd.x, dy=n2.y-nd.y, dist=Math.sqrt(dx*dx+dy*dy);
            if(dist<180){ ctx.beginPath(); ctx.moveTo(nd.x,nd.y); ctx.lineTo(n2.x,n2.y); ctx.strokeStyle=`rgba(${C.n},${0.15*(1-dist/180)})`; ctx.lineWidth=1.5; ctx.stroke(); } }
        }
        for(let i=0;i<sparks.length;i++){ const s=sparks[i];
          if(moving){ s.x+=s.vx; s.y+=s.vy; s.life-=0.01; }
          if(s.life<=0||s.y>h||s.x<0||s.x>w){ s.x=Math.random()*w; s.y=Math.random()*h*0.5; s.vx=(Math.random()-0.5)*4; s.vy=Math.random()*3+1; s.life=1.0; }
          ctx.fillStyle=`rgba(255,255,200,${s.life})`; ctx.beginPath(); ctx.arc(s.x,s.y,1.5,0,Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*3,s.y-s.vy*3); ctx.strokeStyle=`rgba(${C.a},${s.life*0.5})`; ctx.lineWidth=1; ctx.stroke();
        }
      }
      function drawFibre(moving){
        /* Wrap at the PADDED bounds, exactly as drawNetwork does. */
        const L=-BG_PAD-140, R=w+BG_PAD+140, T=-BG_PAD-140, B=h+BG_PAD+140;
        /* dust haze first, so fibres read in front of it */
        for(const s of stars){
          if(moving){ s.x+=s.vx; s.y+=s.vy; }
          if(s.x<L)s.x=R; if(s.x>R)s.x=L; if(s.y<T)s.y=B; if(s.y>B)s.y=T;
          ctx.fillStyle=`rgba(${C.s},${s.a*0.7})`; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
        }
        ctx.lineCap="round";
        for(const f of fibres){
          if(moving){ f.x+=f.vx; f.y+=f.vy; f.rot+=f.vrot; }
          if(f.x<L)f.x=R; if(f.x>R)f.x=L; if(f.y<T)f.y=B; if(f.y>B)f.y=T;
          const hl=f.len*0.5, bow=f.len*f.bow*0.35;
          ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot);
          /* a single softly-bowed strand */
          ctx.beginPath(); ctx.moveTo(-hl,0); ctx.quadraticCurveTo(0,bow,hl,0);
          ctx.strokeStyle=`rgba(${C.s},${f.a})`; ctx.lineWidth=f.wgt; ctx.stroke();
          /* a shorter splayed strand alongside — asbestos separates into bundles */
          ctx.beginPath(); ctx.moveTo(-hl*0.62,f.wgt*1.6); ctx.quadraticCurveTo(0,bow*0.55,hl*0.72,f.wgt*0.6);
          ctx.strokeStyle=`rgba(${C.b},${f.a*0.55})`; ctx.lineWidth=f.wgt*0.7; ctx.stroke();
          ctx.restore();
        }
      }
      function drawNetwork(moving){
        /* Wrap at the PADDED bounds, not the viewport — with BG_PAD 0 these are the
           original -10 / w+10 and -40 / w+40 values. */
        const sL=-BG_PAD-10, sR=w+BG_PAD+10, sT=-BG_PAD-10, sB=h+BG_PAD+10;
        const nL=-BG_PAD-40, nR=w+BG_PAD+40, nT=-BG_PAD-40, nB=h+BG_PAD+40;
        for(const s of stars){ if(moving){ s.x+=s.vx; s.y+=s.vy; } if(s.x<sL)s.x=sR; if(s.x>sR)s.x=sL; if(s.y<sT)s.y=sB; if(s.y>sB)s.y=sT;
          ctx.fillStyle=`rgba(${C.s},${s.a})`; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); }
        for(const n of bgNodes){ if(moving){ n.x+=n.vx; n.y+=n.vy; } if(n.x<nL)n.x=nR; if(n.x>nR)n.x=nL; if(n.y<nT)n.y=nB; if(n.y>nB)n.y=nT; }
        for(let i=0;i<bgNodes.length;i++){ for(let j=i+1;j<bgNodes.length;j++){ const a=bgNodes[i], b=bgNodes[j], dist=Math.hypot(a.x-b.x,a.y-b.y);
          if(dist<260){ const k=1-dist/260; ctx.strokeStyle=`rgba(${C.b},${0.10*k})`; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); } } }
        for(const n of bgNodes){ ctx.fillStyle=`rgba(${C.b},0.10)`; ctx.beginPath(); ctx.arc(n.x,n.y,10,0,Math.PI*2); ctx.fill(); ctx.fillStyle=`rgba(${C.a},0.48)`; ctx.beginPath(); ctx.arc(n.x,n.y,2.0,0,Math.PI*2); ctx.fill(); }
      }

      /* ===== Pathway layout ===== */
      function pathwayLayout(){
        const layout = [];
        if(isFlat){
          const left=w*0.09, right=w*0.91, span=right-left, by=h*0.50, amp=Math.min(h,900)*0.22, n=modules.length;
          const pattern=[-0.75,0.55,-0.20,0.82,-0.58,0.18,0.62];
          for(let i=0;i<n;i++){ const x=left+span*(i/(n-1)); const f=(i<pattern.length)?pattern[i]:Math.sin(i*1.1)*0.7; layout.push({ x, y: by + amp*f }); }
          return layout;
        }
        const marginX=w*0.25, spanX=w*0.50, baseY=h*0.20, rowH=Math.min(h*0.28,300);
        levels.forEach((L,k) => {
          const n=L.end-L.start+1;
          for(let i=0;i<n;i++){ const frac=(k%2===0)?(i/(n-1)):(1-i/(n-1)); layout.push({ x: marginX+spanX*frac, y: baseY + rowH*k + Math.sin(i*1.2+k)*45 }); }
        });
        return layout;
      }
      /* ORDER MATTERS. resize() is what first assigns w/h — they are declared `let w=0,h=0`.
         initBackdrop() and pathwayLayout() both read them, so resize() must run FIRST.
         It used to run last, so the opening init built its field against a 0x0 viewport and
         every particle landed at (0,0); nothing re-seeded it until the user resized the
         window. Latent for as long as this engine has existed. */
      let nodes = pathwayLayout();   /* declared first: resize() assigns to `nodes`, and a
                                        `let` cannot be written before its declaration (TDZ). */

      /* SEEDING. An embed can load at ZERO size — a hidden Rise tab, a closed accordion, a
         lazy iframe below the fold. resize() then has nothing to work with and the field
         would seed into a 0x0 box, putting every particle at (0,0) with nothing to recover
         it. So: never seed at zero, and re-seed on the first real size.
         A window 'resize' event is NOT sufficient on its own — an element inside
         display:none has no layout box at all, and revealing it does not reliably fire one
         inside the iframe. ResizeObserver on the root element does see 0 -> N.
         seedW/seedH dedupe the two sources so a normal resize does the work once. */
      let seedW = -1, seedH = -1;
      function reseed(){
        const nw = Math.floor(window.innerWidth), nh = Math.floor(window.innerHeight);
        if(nw === seedW && nh === seedH) return;
        seedW = nw; seedH = nh;
        resize();
        if(nw > 0 && nh > 0) initBackdrop();   /* the arrays stay [] until there is a real box */
      }
      reseed();
      window.addEventListener('resize', reseed, { passive:true });
      if(typeof ResizeObserver !== 'undefined'){
        new ResizeObserver(reseed).observe(document.documentElement);
      }

      function calcBounds(s, e){
        let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
        for(let i=s;i<=e;i++){ minX=Math.min(minX,nodes[i].x); maxX=Math.max(maxX,nodes[i].x); minY=Math.min(minY,nodes[i].y); maxY=Math.max(maxY,nodes[i].y); }
        return { cx:(minX+maxX)/2, cy:(minY+maxY)/2, spanX:Math.max(100,maxX-minX), spanY:Math.max(100,maxY-minY) };
      }

      let cam = { x: w*0.5, y: h*0.5, z: 1 };
      const ZOOM_IN = isFlat ? 1.55 : 1.6;
      function applyCamera(){ ctx.setTransform(dpr,0,0,dpr,0,0); ctx.translate(w*0.5,h*0.5); ctx.scale(cam.z,cam.z); ctx.translate(-cam.x,-cam.y); }
      function toScreen(pt){ return { x:(pt.x-cam.x)*cam.z + w*0.5, y:(pt.y-cam.y)*cam.z + h*0.5 }; }

      /* ===== Timeline ===== */
      const timeline = []; let tTotal = 0;
      function addPhase(kind, duration, props={}){ timeline.push({ kind, t0:tTotal, t1:tTotal+duration, ...props }); tTotal += duration; }
      /* Phase durations. Defaults reproduce the pre-2026-08-05 hardcoded values exactly, per
         branch; a programme overrides only what it names in PROGRAMME.timing. Omit the key and
         the default stands, so adding `timing` to one data file cannot move any other. */
      const T = Object.assign({
        travel:             1000,
        hold:               isFlat ? 3200 : 3400,
        fadeOut:            400,
        gap:                200,
        levelTravel:        1200,
        camMoveLevel:       1400,
        overviewLevel:      4500,
        overviewFadeOut:    500,
        camMoveAll:         isFlat ? 1600 : 1800,
        overviewAll:        isFlat ? 6500 : 7000,
        overviewFadeOutAll: 600,
        pause:              1000
      }, PROGRAMME.timing || {});

      function buildTimeline(){
        if(isFlat){
          for(let i=0;i<modules.length;i++){
            if(i>0) addPhase("travel",T.travel,{i,from:i-1});
            addPhase("hold",T.hold,{i}); addPhase("fadeOut",T.fadeOut,{i}); addPhase("gap",T.gap,{i});
          }
          addPhase("camMoveAll",T.camMoveAll); addPhase("overviewAll",T.overviewAll); addPhase("overviewFadeOutAll",T.overviewFadeOutAll); addPhase("pause",T.pause);
          return;
        }
        const buildLevel = (levelNum, s, e) => {
          for(let i=s;i<=e;i++){
            if(i>s) addPhase("travel",T.travel,{i,from:i-1});
            addPhase("hold",T.hold,{i}); addPhase("fadeOut",T.fadeOut,{i}); addPhase("gap",T.gap,{i});
          }
          addPhase("camMoveLevel",T.camMoveLevel,{startIdx:s,endIdx:e}); addPhase("overviewLevel",T.overviewLevel,{startIdx:s,endIdx:e}); addPhase("overviewFadeOut",T.overviewFadeOut,{startIdx:s,endIdx:e});
        };
        levels.forEach((L,k) => { buildLevel(L.num, L.start, L.end); if(k<levels.length-1) addPhase("travel",T.levelTravel,{i:levels[k+1].start, from:L.end}); });
        addPhase("camMoveAll",T.camMoveAll); addPhase("overviewAll",T.overviewAll); addPhase("overviewFadeOutAll",T.overviewFadeOutAll); addPhase("pause",T.pause);
      }
      buildTimeline();
      const CYCLE_MS = tTotal;
      const lastStart = isFlat ? Math.max(0, LAST-2) : levels[levels.length-1].start;

      let lastTime = performance.now(), virtualTime = 0, bgTime = 0;

      /* ===== Pathway draw ===== */
      function drawPathway(seg, t, focusIndex, overview){
        ctx.lineWidth = 2.5;
        for(let i=0;i<nodes.length-1;i++){ const a=nodes[i], b=nodes[i+1]; ctx.strokeStyle=`rgba(${C.n},${overview?0.35:0.14})`; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
        if(seg.kind==="travel"){
          const from=nodes[seg.from], to=nodes[seg.i], tr=easeInOutCubic((t-seg.t0)/(seg.t1-seg.t0));
          ctx.strokeStyle=`rgba(${C.a},0.5)`; ctx.lineWidth=3.5; ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(to.x,to.y); ctx.stroke();
          const x=lerp(from.x,to.x,tr), y=lerp(from.y,to.y,tr);
          ctx.fillStyle=`rgba(${C.a},0.95)`; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
          ctx.fillStyle=`rgba(${C.n},0.3)`; ctx.beginPath(); ctx.arc(x,y,24,0,Math.PI*2); ctx.fill();
        }
        for(let i=0;i<nodes.length;i++){
          const n=nodes[i], isFocus=i===focusIndex, pulse=0.6+0.4*Math.sin(bgTime/260+i*0.9);
          let intensity=0.33+(isFocus?0.55:0.08); if(overview) intensity=0.65;
          if((seg.kind==="hold"||seg.kind==="fadeOut") && seg.i===i) intensity=Math.min(1,intensity+0.3);
          ctx.fillStyle=`rgba(${C.n},${0.15*intensity})`; ctx.beginPath(); ctx.arc(n.x,n.y,20+10*pulse*intensity,0,Math.PI*2); ctx.fill();
          ctx.fillStyle=`rgba(${C.a},${0.95*intensity})`; ctx.beginPath(); ctx.arc(n.x,n.y,4,0,Math.PI*2); ctx.fill();
        }
      }

      /* ===== Cards ===== */
      /* ===== Chrome-safe area =====
         The controls are position:fixed with z-index above the card, and the card used to be
         clamped only to the VIEWPORT edges — so on a phone it slid straight underneath them
         and buried its own text. Reported from an iPhone 2026-08-06.

         Measure what the fixed chrome actually occupies and return it as insets. A control
         group that spans most of the width (the mobile bottom bar, the motion pill) eats
         VERTICAL space; a narrow one at the side (the desktop left rail) eats HORIZONTAL
         space. Measuring rather than hardcoding means this keeps working when the media
         queries move things around. */
      function chromeInsets(){
        const pad = 12;
        let top = 0, bottom = 0, left = 0, right = 0;
        for(const sel of ['.controls-right', '.controls-left']){
          const el = document.querySelector(sel);
          if(!el) continue;
          const r = el.getBoundingClientRect();
          if(r.width <= 0 || r.height <= 0) continue;
          if(r.width > w * 0.45){                       /* a bar: constrains vertically */
            if(r.top + r.height/2 < h/2) top    = Math.max(top,    r.bottom + pad);
            else                         bottom = Math.max(bottom, h - r.top + pad);
          } else {                                      /* a rail: constrains horizontally */
            if(r.left + r.width/2 < w/2) left  = Math.max(left,  r.right + pad);
            else                         right = Math.max(right, w - r.left + pad);
          }
        }
        return { top, bottom, left, right };
      }
      /* Clamp that degrades sanely: when the safe band is smaller than the card, centre it in
         the band rather than letting the range invert and throw the card off-screen. */
      function clampRange(v, lo, hi){ return lo > hi ? (lo + hi) / 2 : Math.min(Math.max(v, lo), hi); }

      function showActiveCard(i, screenPt){
        activeIcon.innerHTML = svg(modules[i].icon);
        activeTitle.textContent = modules[i].title;
        activeMeta.textContent = modules[i].meta;
        activeTag.textContent = modules[i].tag;
        let dy;
        if(isFlat){ dy = (i%2===0) ? -170 : 170; }
        else { dy = (levelOfIndex(i)%2===0) ? -180 : 180; }
        /* Cap the card to the space the chrome leaves BEFORE measuring it, or a tall card
           reports a height it was never allowed to occupy and the clamp works off fiction.
           overflow-y:auto is the last resort for a viewport too short for the text. */
        const ins = chromeInsets();
        const bandH = Math.max(120, h - ins.top - ins.bottom - 20);
        activeCard.style.maxHeight = bandH + 'px';
        activeCard.style.overflowY = 'auto';

        const halfW = (activeCard.offsetWidth || 560)/2 + 14;
        const halfH = (activeCard.offsetHeight || 220)/2 + 14;
        const left = clampRange(screenPt.x,      halfW + ins.left, w - halfW - ins.right);
        const top  = clampRange(screenPt.y + dy, halfH + ins.top,  h - halfH - ins.bottom);
        activeCard.style.left = left + 'px'; activeCard.style.top = top + 'px';
        activeCard.classList.remove('fadeOut'); activeCard.classList.add('show');
      }
      function setMiniState(state, s=0, e=LAST){
        minis.forEach((m, i) => {
          if(i>=s && i<=e){
            if(state==="in"){ m.classList.remove('fadeOut'); m.classList.add('show'); }
            else if(state==="out"){ m.classList.add('fadeOut'); m.classList.remove('show'); }
            else { m.classList.remove('fadeOut','show'); }
          } else { m.classList.remove('fadeOut','show'); }
        });
      }
      function placeMiniCards(s=0, e=LAST){
        const dy = (!isFlat && levelOfIndex(s) === levels.length-1) ? 85 : -85;
        for(let i=s;i<=e;i++){ const p=toScreen(nodes[i]); minis[i].style.left=p.x+'px'; minis[i].style.top=(p.y+dy)+'px'; }
      }

      function allTitle(){ return PROGRAMME.allTitle || (PROGRAMME.name + (isFlat ? '' : ' Programme Journey')); }
      function allSub(){ return PROGRAMME.allSub || "The complete pathway mapping all modules."; }
      function levelSub(){ return "Modules completed for this phase of the programme."; }

      function tick(now){
        /* ZERO-SIZE RECOVERY. If we were seeded against a 0x0 box (hidden Rise tab, closed
           accordion, lazy iframe) and there is now a real one, re-seed here. rAF is the one
           trigger that cannot be missed: it is suspended while the document is hidden and
           resumes the moment it renders, which is exactly when the size is known good.
           ResizeObserver and window 'resize' are BOTH unreliable for this — their callbacks
           are driven by the rendering lifecycle, so a document that is hidden when it gains
           its box never receives them. Measured 2026-08-05. Two integer comparisons a frame,
           and only in the pathological case. */
        if((w === 0 || h === 0) && window.innerWidth > 0 && window.innerHeight > 0) reseed();

        let dt = now - lastTime; if(dt > 100) dt = 16; lastTime = now;
        if(mode === 'auto' && !paused) virtualTime += dt;
        if(animBg && !prefersReducedMotion) bgTime += dt;

        const t = virtualTime % CYCLE_MS;
        const cycle = Math.floor(virtualTime / CYCLE_MS);
        if(mode === 'auto' && cycle !== lastCycle){
          lastCycle = cycle;
          activeCard.classList.remove('fadeOut','show'); headerCard.classList.remove('show'); setMiniState("off"); hideSummary();
        }

        let focusIndex=-1, target=nodes[0], targetZ=ZOOM_IN, overview=false;
        let seg = timeline.find(s => t>=s.t0 && t<s.t1) || timeline[timeline.length-1];

        if(mode === 'auto'){
          if(seg.kind==="travel"){ focusIndex=seg.i; const from=nodes[seg.from], to=nodes[seg.i], tt=easeInOutCubic((t-seg.t0)/(seg.t1-seg.t0)); target={ x:lerp(from.x,to.x,tt), y:lerp(from.y,to.y,tt) }; }
          else if(seg.kind==="hold"||seg.kind==="fadeOut"||seg.kind==="gap"){ focusIndex=seg.i; target=nodes[seg.i]; }
          else if(seg.kind==="camMoveLevel"){ const b=calcBounds(seg.startIdx,seg.endIdx), tt=easeInOutCubic((t-seg.t0)/(seg.t1-seg.t0)), prev=nodes[seg.endIdx]; target={ x:lerp(prev.x,b.cx,tt), y:lerp(prev.y,b.cy,tt) }; targetZ=lerp(ZOOM_IN, clamp((w*0.75)/b.spanX,0.6,1.2), tt); }
          else if(seg.kind==="overviewLevel"||seg.kind==="overviewFadeOut"){ const b=calcBounds(seg.startIdx,seg.endIdx); target={ x:b.cx, y:b.cy }; targetZ=clamp((w*0.75)/b.spanX,0.6,1.2); overview=true; }
          else if(seg.kind==="camMoveAll"){ const b=calcBounds(0,LAST), pb=calcBounds(lastStart,LAST), tt=easeInOutCubic((t-seg.t0)/(seg.t1-seg.t0)); target={ x:lerp(pb.cx,b.cx,tt), y:lerp(pb.cy,b.cy,tt) }; const pz=clamp((w*0.75)/pb.spanX,0.6,1.2), az=clamp(Math.min((w*0.85)/b.spanX,(h*0.72)/b.spanY),0.3,0.95); targetZ=lerp(pz,az,tt); }
          else if(seg.kind==="overviewAll"||seg.kind==="overviewFadeOutAll"||seg.kind==="pause"){ const b=calcBounds(0,LAST); target={ x:b.cx, y:b.cy }; targetZ=clamp(Math.min((w*0.85)/b.spanX,(h*0.72)/b.spanY),0.3,0.95); overview=true; }
        } else {
          overview=true; let b;
          if(mode==='ALL'){ b=calcBounds(0,LAST); targetZ=clamp(Math.min((w*0.85)/b.spanX,(h*0.72)/b.spanY),0.3,0.95); setMiniState("off"); showSummary(); hTitle.textContent=allTitle(); hSub.textContent=allSub(); }
          else if(mode.indexOf('LV')===0){ const k=+mode.slice(2); const L=levels[k]; b=calcBounds(L.start,L.end); targetZ=clamp((w*0.75)/b.spanX,0.6,1.2); placeMiniCards(L.start,L.end); setMiniState("in",L.start,L.end); hideSummary(); hTitle.textContent=`${PROGRAMME.name}: ${L.label} Summary`; hSub.textContent=levelSub(); }
          else { b=calcBounds(0,LAST); }
          target={ x:b.cx, y:b.cy }; headerCard.classList.add('show');
        }

        let smoothing = prefersReducedMotion ? 1 : 0.12;
        if(mode==='auto'){ if(seg.kind==="hold"||seg.kind==="fadeOut") smoothing=prefersReducedMotion?1:0.22; if(seg.kind.indexOf("overview")===0) smoothing=1; }
        cam.x=lerp(cam.x,target.x,smoothing); cam.y=lerp(cam.y,target.y,smoothing); cam.z=lerp(cam.z,targetZ,smoothing);

        ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
        drawBackdrop(bgTime);
        applyCamera();
        drawPathway(seg, t, focusIndex, overview);

        const nodeScreen = (focusIndex>=0) ? toScreen(nodes[focusIndex]) : {x:0,y:0};

        if(mode==='auto'){
          if(seg.kind==="hold"){ showActiveCard(seg.i, nodeScreen); }
          else if(seg.kind==="fadeOut"){ activeCard.classList.add('fadeOut'); activeCard.classList.remove('show'); }
          else if(seg.kind==="gap"||seg.kind==="travel"){ activeCard.classList.remove('fadeOut','show'); }

          if(seg.kind==="overviewLevel"){ const k=levelOfIndex(seg.startIdx); hTitle.textContent=`${PROGRAMME.name}: ${levels[k].label} Summary`; hSub.textContent=levelSub(); headerCard.classList.add('show'); placeMiniCards(seg.startIdx,seg.endIdx); setMiniState("in",seg.startIdx,seg.endIdx); }
          else if(seg.kind==="overviewFadeOut"){ headerCard.classList.remove('show'); placeMiniCards(seg.startIdx,seg.endIdx); setMiniState("out",seg.startIdx,seg.endIdx); }

          if(seg.kind==="overviewAll"){ hTitle.textContent=allTitle(); hSub.textContent=allSub(); headerCard.classList.add('show'); setMiniState("off"); showSummary(); }
          else if(seg.kind==="overviewFadeOutAll"){ headerCard.classList.remove('show'); hideSummary(); }
          else if(seg.kind==="pause"){ setMiniState("off"); hideSummary(); }
        }

        requestAnimationFrame(tick);
      }

      buildControls();
      buildSummary();
      updateButtons();
      applyMotionState();          /* paint the pip, icon, word and aria-pressed on load */
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
